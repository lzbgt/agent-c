name: compose-broker-smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker info
        run: docker info

      - name: Compose broker smoke batch
        run: |
          COMPOSE_BUILD_SERIAL=1 tools/verify_compose_broker_smokes.sh

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-broker-smoke-logs
          path: |
            build/*.log
            out/compose_*.log
            out/compose_broker_smokes_*.log
          if-no-files-found: ignore
