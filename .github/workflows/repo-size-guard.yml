name: Repo Size Guard

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  size-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repo hygiene guards
        run: |
          tools/verify_repo_guards.sh --strict
