openapi: 3.0.3
info:
  title: agentd HTTP API
  version: "v1"
  description: |
    Machine-readable contract for the agentd daemon.

    Notes:
    - Many endpoints accept a Bearer auth token when agentd is started with `--auth-token`.
    - `trace_id` is an optional client-provided correlation identifier. If omitted, agentd generates one.
servers:
  - url: http://127.0.0.1:8080

tags:
  - name: health
  - name: caps
  - name: diagnostics
  - name: config
  - name: client
  - name: run
  - name: jobs
  - name: workflows
  - name: tools
  - name: avm
  - name: memory
  - name: edge
  - name: sessions
  - name: blobs

paths:
  $ref: ./agentd/paths.yaml

components:
  $ref: ./agentd/components.yaml
