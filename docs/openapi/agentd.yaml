openapi: 3.0.3
info:
  title: agentd HTTP API
  version: "v1"
  description: |
    Machine-readable contract for the agentd daemon.

    Notes:
    - Many endpoints accept a Bearer auth token when agentd is started with `--auth-token`.
    - `trace_id` is an optional client-provided correlation identifier. If omitted, agentd generates one.
servers:
  - url: http://127.0.0.1:8080

tags:
  - name: health
  - name: run
  - name: jobs
  - name: workflows
  - name: tools
  - name: avm
  - name: memory
  - name: edge
  - name: sessions

paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, version]
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  version: { type: string }

  /api/v1/tools:
    get:
      tags: [tools]
      summary: List available tools
      responses:
        "200":
          description: Tools list
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  defs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ToolDef"

  /api/v1/avm/job_scan:
    post:
      tags: [avm]
      summary: Scan an AVM job object without executing bytecode
      description: |
        Runs `AGENTD_AVM_BIN --print-job-json <tmp.obc>` and returns the parsed job JSON.

        Notes:
        - This endpoint requires daemon auth when `--auth-token` is set (same as most control-plane endpoints).
        - The daemon must be started with `--yolo` (default) because it runs a subprocess.
        - `AGENTD_AVM_BIN` must be set in the daemon environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obc_base64]
              properties:
                obc_base64:
                  type: string
                  description: Base64-encoded `.obc` bytes
      responses:
        "200":
          description: Job JSON plus execution metadata
          content:
            application/json:
              schema:
                type: object
                required: [ok, job, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  job:
                    type: object
                    additionalProperties: true
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Policy rejected (scoped mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AVM binary not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: AVM timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/avm/policy_scan:
    post:
      tags: [avm]
      summary: Scan an AVM capability policy without executing bytecode
      description: |
        Runs `AGENTD_AVM_BIN --print-policy-json <tmp.obc>` and returns the parsed policy JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obc_base64]
              properties:
                obc_base64:
                  type: string
                  description: Base64-encoded `.obc` bytes
      responses:
        "200":
          description: Policy JSON plus execution metadata
          content:
            application/json:
              schema:
                type: object
                required: [ok, policy, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  policy:
                    type: object
                    additionalProperties: true
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }

  /api/v1/avm/inspect:
    post:
      tags: [avm]
      summary: Inspect an OBC capsule without executing bytecode
      description: |
        Runs `AGENTD_AVM_BIN --inspect-json <tmp.obc>` and returns the parsed inspect JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obc_base64]
              properties:
                obc_base64:
                  type: string
                  description: Base64-encoded `.obc` bytes
      responses:
        "200":
          description: Inspect JSON plus execution metadata
          content:
            application/json:
              schema:
                type: object
                required: [ok, inspect, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  inspect:
                    type: object
                    additionalProperties: true
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }

  /api/v1/avm/verify_strict:
    post:
      tags: [avm]
      summary: Verify OBC strict mode (no execution)
      description: |
        Runs `AGENTD_AVM_BIN --verify-strict <tmp.obc>` (verifier only, no bytecode execution).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obc_base64]
              properties:
                obc_base64:
                  type: string
                  description: Base64-encoded `.obc` bytes
      responses:
        "200":
          description: Verified OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }
        "422":
          description: Strict verification failed

  /api/v1/avm/trace_hash:
    post:
      tags: [avm]
      summary: Compute AVM TRACE_HASH for an OBC capsule
      description: |
        Runs `AGENTD_AVM_BIN --print-trace-hash <tmp.obc>` and extracts the `TRACE_HASH` token from output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obc_base64]
              properties:
                obc_base64:
                  type: string
                  description: Base64-encoded `.obc` bytes
      responses:
        "200":
          description: TRACE_HASH plus execution metadata
          content:
            application/json:
              schema:
                type: object
                required: [ok, trace_hash, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  trace_hash: { type: string }
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }

  /api/v1/avm/capsule_run:
    post:
      tags: [avm]
      summary: Execute an OBC capsule under AVM safe defaults (capsule mode)
      description: |
        Executes bytecode using Oren AVM in capsule mode (`--capsule`), with explicit budgets and deterministic knobs.

        This endpoint is intentionally gated:
        - requires daemon auth when enabled
        - requires daemon yolo mode (`--yolo`, default)
        - requires `AGENTD_AVM_BIN` to point to the AVM binary
        - requires `AGENTD_AVM_EXEC=1` in the daemon environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvmCapsuleRunArgs"
      responses:
        "200":
          description: Execution result (ok indicates VM exit_code==0)
          content:
            application/json:
              schema:
                type: object
                required: [ok, run, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  run:
                    type: object
                    additionalProperties: true
                  result_hash: { type: string }
                  trace_hash: { type: string }
                  state_hash: { type: string }
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }
        "403":
          description: Execution disabled by policy
        "400":
          description: Invalid request
        "502":
          description: AVM failed
        "504":
          description: AVM timed out

  /api/v1/run:
    post:
      tags: [run]
      summary: Run a prompt (sync)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Run result (OK or error; see `ok`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"

  /api/v1/run_async:
    post:
      tags: [run, jobs]
      summary: Run a prompt (async job)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, job_id, trace_id]
                properties:
                  ok: { type: boolean }
                  job_id: { type: string }
                  trace_id: { $ref: "#/components/schemas/TraceID" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: job_id collision

  /api/v1/job:
    get:
      tags: [jobs]
      summary: Get job status (optionally with bounded events slice)
      parameters:
        - in: query
          name: job_id
          required: true
          schema: { type: string }
        - in: query
          name: include_events
          required: false
          schema: { type: boolean }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: uint64 }
        - in: query
          name: max_events
          required: false
          schema: { type: integer, format: uint64 }
      responses:
        "200":
          description: Job snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobGetResponse"
    delete:
      tags: [jobs]
      summary: Delete a terminal job from memory (best-effort)
      parameters:
        - in: query
          name: job_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted (or already absent)

  /api/v1/job/cancel:
    post:
      tags: [jobs]
      summary: Request job cancellation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id]
              properties:
                job_id: { type: string }
      responses:
        "200":
          description: Cancellation requested

  /api/v1/job/stream:
    get:
      tags: [jobs]
      summary: Stream job events (SSE)
      description: |
        Streams `agent_event` and terminal `job_done` events as Server-Sent Events.
      parameters:
        - in: query
          name: job_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: uint64 }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/trace:
    get:
      tags: [run]
      summary: Lookup persisted audit records by trace_id
      description: |
        Returns audit records whose JSON contains the given `trace_id`.

        Notes:
        - Only runs persisted with `no_session=false` will appear (audit_records are DB-backed).
        - This is a best-effort query intended for debugging/correlation, not a primary index.
      parameters:
        - in: query
          name: trace_id
          required: true
          schema:
            $ref: "#/components/schemas/TraceID"
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
        - in: query
          name: max_bytes
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Trace lookup response
          content:
            application/json:
              schema:
                type: object
                required: [ok, trace_id, records]
                properties:
                  ok: { type: boolean }
                  trace_id: { $ref: "#/components/schemas/TraceID" }
                  count: { type: integer, format: int32 }
                  records:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /api/v1/memory/consolidate:
    post:
      tags: [memory]
      summary: Promote @mem markers into structured memory
      description: |
        Deterministic rolling consolidation:
        - scans recent daily memory files for explicit `@mem` markers
        - upserts them into `memory/STRUCTURED.md`
        - writes a checkpoint snapshot (best-effort) when changes occur
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                daily_days: { type: integer, format: int32 }
                keep_checkpoints: { type: integer, format: int32 }
                max_entries: { type: integer, format: int32 }
                dry_run: { type: boolean }
      responses:
        "200":
          description: Consolidation report
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Invalid request or consolidation not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workflow/submit:
    post:
      tags: [workflows]
      summary: Submit a durable workflow (DAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowSubmitRequest"
      responses:
        "200":
          description: Workflow accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow_id, trace_id]
                properties:
                  ok: { type: boolean }
                  workflow_id: { type: string }
                  trace_id: { $ref: "#/components/schemas/TraceID" }
                  session_id: { type: string }

  /api/v1/workflow:
    get:
      tags: [workflows]
      summary: Get workflow status
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: include_tasks
          required: false
          schema: { type: boolean }
        - in: query
          name: include_results
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Workflow snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowGetResponse"

  /api/v1/workflows:
    get:
      tags: [workflows]
      summary: List workflows by status
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Workflow list

  /api/v1/workflow/cancel:
    post:
      tags: [workflows]
      summary: Cancel a workflow (best-effort)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id]
              properties:
                workflow_id: { type: string }
      responses:
        "200":
          description: Cancellation requested

  /api/v1/workflow/events:
    get:
      tags: [workflows]
      summary: List workflow events (durable)
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: after_event_id
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Workflow event slice
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow_id, events, cursor_next]
                properties:
                  ok: { type: boolean }
                  workflow_id: { type: string }
                  after_event_id: { type: integer, format: int64 }
                  cursor_next: { type: integer, format: int64 }
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /api/v1/workflow/stream:
    get:
      tags: [workflows]
      summary: Stream workflow events (SSE)
      description: |
        Streams `workflow_event` events (durable workflow event log) and ends with terminal `workflow_done`.
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/edge/message:
    post:
      tags: [edge]
      summary: Ingest an UM-BMP message envelope (edge interop)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeMessageEnvelope"
      responses:
        "200":
          description: Accepted (idempotent)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  deduped: { type: boolean }

  /api/v1/edge/outbox:
    get:
      tags: [edge]
      summary: Poll outbound UM-BMP messages for a node (outbox cursor)
      parameters:
        - in: query
          name: node_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Outbox slice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgeOutboxResponse"

  /api/v1/edge/nodes:
    get:
      tags: [edge]
      summary: List registered edge nodes
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Nodes list

  /api/v1/edge/node:
    get:
      tags: [edge]
      summary: Get node registry record (summary)
      parameters:
        - in: query
          name: node_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Node record

  /api/v1/edge/node/caps:
    get:
      tags: [edge]
      summary: Get node capability manifest (UM-ACDS)
      parameters:
        - in: query
          name: node_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Node manifest

  /api/v1/edge/task/assign:
    post:
      tags: [edge]
      summary: Enqueue a TASK_ASSIGN to a node (platform helper)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeTaskAssignRequest"
      responses:
        "200":
          description: Enqueued
          content:
            application/json:
              schema:
                type: object
                required: [ok, node_id, task_id, step_id, outbox_id]
                properties:
                  ok: { type: boolean }
                  node_id: { type: string }
                  task_id: { type: string }
                  step_id: { type: string }
                  outbox_id: { type: integer, format: int64 }
                  deduped: { type: boolean }

  /api/v1/edge/task:
    get:
      tags: [edge]
      summary: Get an edge task status
      parameters:
        - in: query
          name: task_id
          required: true
          schema: { type: string }
        - in: query
          name: step_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task state
          content:
            application/json:
              schema:
                type: object
                required: [ok, task]
                properties:
                  ok: { type: boolean }
                  task:
                    type: object
                    additionalProperties: true

  /api/v1/edge/rule/upsert:
    post:
      tags: [edge]
      summary: Create or update an automation rule (SENSOR_EVENT -> TASK_ASSIGN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeRuleUpsertRequest"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                type: object
                required: [ok, rule_id]
                properties:
                  ok: { type: boolean }
                  rule_id: { type: string }

  /api/v1/edge/rules:
    get:
      tags: [edge]
      summary: List automation rules
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Rules list

  /api/v1/edge/rule:
    delete:
      tags: [edge]
      summary: Delete an automation rule
      parameters:
        - in: query
          name: rule_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/v1/edge/workflow/submit:
    post:
      tags: [edge]
      summary: Submit a durable edge workflow (UM-WF)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeWorkflowSubmitRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow_id]
                properties:
                  ok: { type: boolean }
                  workflow_id: { type: string }

  /api/v1/edge/workflow/cancel:
    post:
      tags: [edge]
      summary: Cancel an edge workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id]
              properties:
                workflow_id: { type: string }
      responses:
        "200":
          description: Canceled

  /api/v1/edge/workflow:
    get:
      tags: [edge]
      summary: Get an edge workflow
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: include_steps
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Workflow

  /api/v1/edge/workflow/events:
    get:
      tags: [edge]
      summary: List edge workflow events (paged)
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Events list

  /api/v1/edge/workflow/stream:
    get:
      tags: [edge]
      summary: Stream edge workflow events (SSE)
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: SSE stream (text/event-stream)

  /api/v1/edge/workflows:
    get:
      tags: [edge]
      summary: List edge workflows by status
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Workflows list

  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: List sessions
      responses:
        "200":
          description: Sessions list

components:
  schemas:
    TraceID:
      type: string
      description: Correlation identifier (client-provided or server-generated)
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:@-]{1,128}$"

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error: { type: string }

    EdgeMessageEnvelope:
      type: object
      required: [msg_id, ts_utc_ms, type, from, to, body]
      properties:
        msg_id: { type: string }
        ts_utc_ms: { type: integer, format: int64 }
        type: { type: string }
        from: { type: string }
        to:
          description: Destination address or null
          type: string
          nullable: true
        body:
          type: object
          additionalProperties: true
        auth:
          type: object
          additionalProperties: true
        trace:
          type: object
          additionalProperties: true

    EdgeOutboxResponse:
      type: object
      required: [ok, node_id, cursor_base, cursor_next, messages]
      properties:
        ok: { type: boolean }
        node_id: { type: string }
        cursor_base: { type: integer, format: int64 }
        cursor_next: { type: integer, format: int64 }
        messages:
          type: array
          items:
            type: object
            required: [outbox_id, ts_utc_ms]
            properties:
              outbox_id: { type: integer, format: int64 }
              ts_utc_ms: { type: integer, format: int64 }
              msg:
                $ref: "#/components/schemas/EdgeMessageEnvelope"
              msg_raw: { type: string }
              parse_error: { type: string }

    EdgeTaskAssignRequest:
      type: object
      required: [task_id, step_id, idempotency_key, mode, deadline_utc_ms, payload]
      properties:
        node_id:
          type: string
          description: Explicit target node_id (preferred when known)
        match_any:
          type: object
          description: Capability-based node selection
          additionalProperties: true
        allow_hazards:
          type: array
          description: Explicitly allowed hazard tags (unsafe; use sparingly)
          items: { type: string }
        allow_high_side_effect:
          type: boolean
          description: Allow dispatch when tool side_effect_level is high
        task_id: { type: string }
        step_id: { type: string }
        idempotency_key: { type: string }
        mode:
          type: string
          enum: [invoke, agent]
        deadline_utc_ms: { type: integer, format: int64 }
        attempt:
          type: integer
          format: int32
          description: Optional attempt number (for workflow orchestration/debug; default 0)
        payload:
          type: object
          additionalProperties: true

    EdgeRuleUpsertRequest:
      type: object
      required: [event_type, action]
      properties:
        rule_id:
          type: string
          description: Optional; if omitted, server generates one
        enabled: { type: boolean }
        event_type: { type: string }
        min_confidence: { type: number, format: double }
        cooldown_ms: { type: integer, format: int32 }
        action:
          type: object
          description: Rule action (currently supports {type:"task_assign", ...})
          additionalProperties: true

    EdgeWorkflowSubmitRequest:
      type: object
      required: [steps]
      properties:
        workflow_id:
          type: string
          description: Optional; if omitted, server generates one
        goal: { type: string }
        priority: { type: integer, format: int32 }
        steps:
          type: array
          items:
            type: object
            required: [step_id, kind]
            properties:
              step_id: { type: string }
              kind: { type: string, enum: [invoke_tool, run_agent, join] }
              depends_on:
                type: array
                items: { type: string }
              target:
                type: object
                additionalProperties: true
              payload:
                type: object
                additionalProperties: true
              join_mode: { type: string, enum: [all, any] }
              deadline_utc_ms: { type: integer, format: int64 }
              max_attempts: { type: integer, format: int32 }
              backoff_ms: { type: integer, format: int32 }

    ToolDef:
      type: object
      required: [name, description, parameters]
      properties:
        name: { type: string }
        description: { type: string }
        parameters:
          type: object
          description: JSON Schema-like parameters

    RunRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        session_id: { type: string }
        no_session: { type: boolean }
        priority:
          type: integer
          format: int32
          description: Higher runs sooner (scheduler hint). Default 0. Clamped to [-1000, 1000].
        tools:
          type: string
          description: Tool mode
          enum: [none, basic, host]
        model: { type: string }
        base_url: { type: string }
        api_key: { type: string }
        max_steps: { type: integer, format: int64 }
        verbose: { type: boolean }

    AgentEvent:
      type: object
      required: [type, data]
      properties:
        type: { type: string }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        data:
          type: object
          additionalProperties: true

    RunResponse:
      type: object
      required: [ok, trace_id, assistant_text, events]
      properties:
        ok: { type: boolean }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        assistant_text: { type: string }
        error: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvent"

    JobGetResponse:
      type: object
      required: [ok, job_id, status, cancel_requested, created_unix_ms, updated_unix_ms, events_cursor_base, events_cursor_end]
      properties:
        ok: { type: boolean }
        job_id: { type: string }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        status: { type: string }
        priority:
          type: integer
          format: int32
          description: Higher jobs run sooner (scheduler hint).
        error: { type: string }
        cancel_requested: { type: boolean }
        created_unix_ms: { type: integer, format: int64 }
        updated_unix_ms: { type: integer, format: int64 }
        events_cursor_base: { type: integer, format: uint64 }
        events_cursor_end: { type: integer, format: uint64 }
        events_reset: { type: boolean }
        events_cursor_next: { type: integer, format: uint64 }
        events:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvent"

    WorkflowTaskSpec:
      description: |
        Workflow task specification.

        This is a tagged union:
        - LLM/tool tasks: `request` (a `RunRequest`) with a non-empty `prompt`
        - Deterministic capsule tasks: `kind: avm_capsule` with `capsule` (see `AvmCapsuleRunArgs`)
        - Deterministic aggregation tasks: `kind: aggregate` with `aggregate` (see `WorkflowAggregateSpec`)
        - Edge collaboration tasks: `kind: edge_invoke` with `edge` (see `WorkflowEdgeInvokeSpec`)

        Note: OpenAPI cannot express conditional required fields perfectly; see the server-side behavior:
        - If `kind == avm_capsule`, `capsule.obc_base64` is required and `request.prompt` is not used.
        - If `kind == aggregate`, `aggregate.task_ids` is required and `request.prompt` is not used.
        - If `kind == edge_invoke`, `edge.tool`/`edge.args` are required and `request.prompt` is not used.
        - Otherwise, `request.prompt` is required (or prompt at the top-level is accepted by the server for legacy reasons).
      oneOf:
        - $ref: "#/components/schemas/WorkflowTaskRunSpec"
        - $ref: "#/components/schemas/WorkflowTaskAvmCapsuleSpec"
        - $ref: "#/components/schemas/WorkflowTaskAggregateSpec"
        - $ref: "#/components/schemas/WorkflowTaskEdgeInvokeSpec"

    WorkflowTaskRunSpec:
      type: object
      required: [task_id, request]
      properties:
        task_id: { type: string }
        allow_error:
          type: boolean
          description: If true, task failure does not fail the workflow (soft-fail).
        depends_on:
          type: array
          items: { type: string }
        max_attempts: { type: integer, format: int32 }
        priority:
          type: integer
          format: int32
          description: Higher tasks run sooner (scheduler hint). Overrides workflow priority.
        request:
          $ref: "#/components/schemas/RunRequest"
        expect:
          type: object
          description: Deterministic correctness assertions (engine-enforced)
          additionalProperties: true

    WorkflowTaskAvmCapsuleSpec:
      type: object
      required: [task_id, kind, capsule]
      properties:
        task_id: { type: string }
        allow_error:
          type: boolean
          description: If true, task failure does not fail the workflow (soft-fail).
        kind:
          type: string
          enum: [avm_capsule]
          description: Deterministic capsule execution task (no LLM required).
        depends_on:
          type: array
          items: { type: string }
        max_attempts: { type: integer, format: int32 }
        priority:
          type: integer
          format: int32
          description: Higher tasks run sooner (scheduler hint). Overrides workflow priority.
        capsule:
          $ref: "#/components/schemas/AvmCapsuleRunArgs"
        expect:
          type: object
          description: Deterministic correctness assertions (engine-enforced)
          additionalProperties: true

    WorkflowTaskAggregateSpec:
      type: object
      required: [task_id, kind, aggregate]
      properties:
        task_id: { type: string }
        allow_error:
          type: boolean
          description: If true, task failure does not fail the workflow (soft-fail).
        kind:
          type: string
          enum: [aggregate]
          description: Deterministic aggregation/join task (no LLM required).
        depends_on:
          type: array
          items: { type: string }
        max_attempts: { type: integer, format: int32 }
        priority:
          type: integer
          format: int32
          description: Higher tasks run sooner (scheduler hint). Overrides workflow priority.
        aggregate:
          $ref: "#/components/schemas/WorkflowAggregateSpec"
        expect:
          type: object
          description: Deterministic correctness assertions (engine-enforced)
          additionalProperties: true

    WorkflowAggregateSpec:
      type: object
      required: [task_ids]
      properties:
        mode:
          type: string
          enum: [quorum_hashes, collect, first_ok]
          description: Aggregation strategy.
        task_ids:
          type: array
          description: Task IDs to read results from (votes).
          items: { type: string }
        quorum:
          type: integer
          format: int32
          description: Minimum number of matching votes required (default: N=task_ids length).
        pointers:
          type: array
          description: JSON pointers into each task result JSON to compare (default: [/avm/result_hash, /avm/trace_hash]).
          items: { type: string }
        require_all:
          type: boolean
          description: For mode=collect, require every pointer for every task_id (default true).
        ok_pointer:
          type: string
          description: For mode=first_ok, JSON pointer used to test ok (default /ok).
        value_pointer:
          type: string
          description: For mode=first_ok, JSON pointer used as assistant_text (default /assistant_text).

    WorkflowTaskEdgeInvokeSpec:
      type: object
      required: [task_id, kind, edge]
      properties:
        task_id: { type: string }
        allow_error:
          type: boolean
          description: If true, task failure does not fail the workflow (soft-fail).
        kind:
          type: string
          enum: [edge_invoke]
          description: Dispatch a UM‑EAIS TASK_ASSIGN invoke_tool to an edge node and wait for TASK_DONE.
        depends_on:
          type: array
          items: { type: string }
        max_attempts:
          type: integer
          format: int32
          description: |
            Poll budget for completion. If omitted, server defaults to a higher value than normal tasks.
        priority:
          type: integer
          format: int32
          description: Higher tasks run sooner (scheduler hint). Overrides workflow priority.
        edge:
          $ref: "#/components/schemas/WorkflowEdgeInvokeSpec"
        expect:
          type: object
          description: Deterministic correctness assertions (engine-enforced)
          additionalProperties: true

    WorkflowEdgeInvokeSpec:
      type: object
      required: []
      properties:
        node_id:
          type: string
          description: Explicit target node (preferred when known).
        match_any:
          type: object
          description: Capability-based node selection (requires_tools/tags_*).
          additionalProperties: true
        mode:
          type: string
          enum: [invoke, agent]
          description: |
            - invoke: payload is an explicit tool call (requires `tool` + `args`)
            - agent: payload is a goal/prompt for on-device `agent_core` (requires `payload` or `prompt`)
        tool:
          type: string
          description: Required when mode=invoke.
        args:
          type: object
          additionalProperties: true
          description: Required when mode=invoke.
        prompt:
          type: string
          description: Convenience for mode=agent (server maps to payload.prompt).
        payload:
          type: object
          additionalProperties: true
          description: Raw payload for mode=agent (preferred).
        timeout_ms:
          type: integer
          format: int32
          description: Relative deadline; converted to `deadline_utc_ms` by the platform.
        deadline_utc_ms:
          type: integer
          format: int64
          description: Absolute deadline in UTC ms (preferred when caller has a clock).
        idempotency_key:
          type: string
          description: Idempotency key (defaults to `${workflow_id}:${task_id}`).
        allow_hazards:
          type: array
          items: { type: string }
          description: Explicitly allow hazard tags (unsafe; use sparingly).
        allow_high_side_effect:
          type: boolean
          description: Allow dispatch for tools marked side_effect_level=high.
      description: |
        Conditional requirements:
        - If `mode` is omitted, defaults to `invoke`.
        - `node_id` or `match_any` must be provided.
        - If `mode=invoke`: `tool` and `args` are required.
        - If `mode=agent`: `payload` OR `prompt` is required.

    AvmCapsuleRunArgs:
      type: object
      required: [obc_base64]
      properties:
        obc_base64:
          type: string
          description: Base64-encoded `.obc` bytes
        timeout_ms:
          type: integer
          format: int32
          description: Wall-time deadline (passed to AVM `--timeout-ms`)
        gas:
          type: integer
          format: int64
          description: Instruction-step budget (env `AVM_GAS`)
        mem_bytes:
          type: integer
          format: int64
          description: Heap budget (env `AVM_MEM_BYTES`)
        io_bytes:
          type: integer
          format: int64
          description: FS I/O budget (env `AVM_IO_BYTES`)
        log_bytes:
          type: integer
          format: int64
          description: Record/replay log budget (env `AVM_LOG_BYTES`)
        deterministic:
          type: boolean
          description: Enable deterministic TIME/RNG (env `AVM_DETERMINISTIC`)
        rng_seed:
          type: integer
          format: int64
          description: Deterministic RNG seed (env `AVM_RNG_SEED`)
        time_start_ns:
          type: integer
          format: int64
          description: Virtual clock origin (env `AVM_TIME_START_NS`)
        allow_domains:
          type: string
          description: CSV allowlist passed to AVM `--allow-domains` (still virtualized by capsule defaults)

    WorkflowSubmitRequest:
      type: object
      required: [tasks]
      properties:
        workflow_id: { type: string }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        session_id: { type: string }
        priority:
          type: integer
          format: int32
          description: Higher workflows/tasks run sooner (scheduler hint). Default 0. Clamped to [-1000, 1000].
        allow_sessions: { type: boolean }
        allow_inline_api_keys: { type: boolean }
        defaults:
          type: object
          additionalProperties: true
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowTaskSpec"

    WorkflowGetResponse:
      type: object
      required: [ok, workflow]
      properties:
        ok: { type: boolean }
        workflow:
          type: object
          required: [workflow_id, status, cancel_requested, created_unix_ms, updated_unix_ms]
          properties:
            workflow_id: { type: string }
            status: { type: string }
            priority:
              type: integer
              format: int32
              description: Higher workflows/tasks run sooner (scheduler hint).
            trace_id: { $ref: "#/components/schemas/TraceID" }
            session_id: { type: string }
            cancel_requested: { type: boolean }
            error: { type: string }
            created_unix_ms: { type: integer, format: int64 }
            updated_unix_ms: { type: integer, format: int64 }
        tasks:
          type: array
          items:
            type: object
            additionalProperties: true
        result:
          type: object
          additionalProperties: true
