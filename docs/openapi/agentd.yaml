openapi: 3.0.3
info:
  title: agentd HTTP API
  version: "v1"
  description: |
    Machine-readable contract for the agentd daemon.

    Notes:
    - Many endpoints accept a Bearer auth token when agentd is started with `--auth-token`.
    - `trace_id` is an optional client-provided correlation identifier. If omitted, agentd generates one.
servers:
  - url: http://127.0.0.1:8080

tags:
  - name: health
  - name: run
  - name: jobs
  - name: workflows
  - name: tools
  - name: memory
  - name: sessions

paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, version]
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  version: { type: string }

  /api/v1/tools:
    get:
      tags: [tools]
      summary: List available tools
      responses:
        "200":
          description: Tools list
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  defs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ToolDef"

  /api/v1/run:
    post:
      tags: [run]
      summary: Run a prompt (sync)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Run result (OK or error; see `ok`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"

  /api/v1/run_async:
    post:
      tags: [run, jobs]
      summary: Run a prompt (async job)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, job_id, trace_id]
                properties:
                  ok: { type: boolean }
                  job_id: { type: string }
                  trace_id: { $ref: "#/components/schemas/TraceID" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: job_id collision

  /api/v1/job:
    get:
      tags: [jobs]
      summary: Get job status (optionally with bounded events slice)
      parameters:
        - in: query
          name: job_id
          required: true
          schema: { type: string }
        - in: query
          name: include_events
          required: false
          schema: { type: boolean }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: uint64 }
        - in: query
          name: max_events
          required: false
          schema: { type: integer, format: uint64 }
      responses:
        "200":
          description: Job snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobGetResponse"
    delete:
      tags: [jobs]
      summary: Delete a terminal job from memory (best-effort)
      parameters:
        - in: query
          name: job_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted (or already absent)

  /api/v1/job/cancel:
    post:
      tags: [jobs]
      summary: Request job cancellation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id]
              properties:
                job_id: { type: string }
      responses:
        "200":
          description: Cancellation requested

  /api/v1/job/stream:
    get:
      tags: [jobs]
      summary: Stream job events (SSE)
      description: |
        Streams `agent_event` and terminal `job_done` events as Server-Sent Events.
      parameters:
        - in: query
          name: job_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: uint64 }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/trace:
    get:
      tags: [run]
      summary: Lookup persisted audit records by trace_id
      description: |
        Returns audit records whose JSON contains the given `trace_id`.

        Notes:
        - Only runs persisted with `no_session=false` will appear (audit_records are DB-backed).
        - This is a best-effort query intended for debugging/correlation, not a primary index.
      parameters:
        - in: query
          name: trace_id
          required: true
          schema:
            $ref: "#/components/schemas/TraceID"
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
        - in: query
          name: max_bytes
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Trace lookup response
          content:
            application/json:
              schema:
                type: object
                required: [ok, trace_id, records]
                properties:
                  ok: { type: boolean }
                  trace_id: { $ref: "#/components/schemas/TraceID" }
                  count: { type: integer, format: int32 }
                  records:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /api/v1/memory/consolidate:
    post:
      tags: [memory]
      summary: Promote @mem markers into structured memory
      description: |
        Deterministic rolling consolidation:
        - scans recent daily memory files for explicit `@mem` markers
        - upserts them into `memory/STRUCTURED.md`
        - writes a checkpoint snapshot (best-effort) when changes occur
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                daily_days: { type: integer, format: int32 }
                keep_checkpoints: { type: integer, format: int32 }
                max_entries: { type: integer, format: int32 }
                dry_run: { type: boolean }
      responses:
        "200":
          description: Consolidation report
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Invalid request or consolidation not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workflow/submit:
    post:
      tags: [workflows]
      summary: Submit a durable workflow (DAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowSubmitRequest"
      responses:
        "200":
          description: Workflow accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow_id, trace_id]
                properties:
                  ok: { type: boolean }
                  workflow_id: { type: string }
                  trace_id: { $ref: "#/components/schemas/TraceID" }
                  session_id: { type: string }

  /api/v1/workflow:
    get:
      tags: [workflows]
      summary: Get workflow status
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: include_tasks
          required: false
          schema: { type: boolean }
        - in: query
          name: include_results
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Workflow snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowGetResponse"

  /api/v1/workflows:
    get:
      tags: [workflows]
      summary: List workflows by status
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Workflow list

  /api/v1/workflow/cancel:
    post:
      tags: [workflows]
      summary: Cancel a workflow (best-effort)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id]
              properties:
                workflow_id: { type: string }
      responses:
        "200":
          description: Cancellation requested

  /api/v1/workflow/events:
    get:
      tags: [workflows]
      summary: List workflow events (durable)
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: after_event_id
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Workflow event slice
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow_id, events, cursor_next]
                properties:
                  ok: { type: boolean }
                  workflow_id: { type: string }
                  after_event_id: { type: integer, format: int64 }
                  cursor_next: { type: integer, format: int64 }
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /api/v1/workflow/stream:
    get:
      tags: [workflows]
      summary: Stream workflow events (SSE)
      description: |
        Streams `workflow_event` events (durable workflow event log) and ends with terminal `workflow_done`.
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: List sessions
      responses:
        "200":
          description: Sessions list

components:
  schemas:
    TraceID:
      type: string
      description: Correlation identifier (client-provided or server-generated)
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:@-]{1,128}$"

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error: { type: string }

    ToolDef:
      type: object
      required: [name, description, parameters]
      properties:
        name: { type: string }
        description: { type: string }
        parameters:
          type: object
          description: JSON Schema-like parameters

    RunRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        session_id: { type: string }
        no_session: { type: boolean }
        priority:
          type: integer
          format: int32
          description: Higher runs sooner (scheduler hint). Default 0. Clamped to [-1000, 1000].
        tools:
          type: string
          description: Tool mode
          enum: [none, basic, host]
        model: { type: string }
        base_url: { type: string }
        api_key: { type: string }
        max_steps: { type: integer, format: int64 }
        verbose: { type: boolean }

    AgentEvent:
      type: object
      required: [type, data]
      properties:
        type: { type: string }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        data:
          type: object
          additionalProperties: true

    RunResponse:
      type: object
      required: [ok, trace_id, assistant_text, events]
      properties:
        ok: { type: boolean }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        assistant_text: { type: string }
        error: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvent"

    JobGetResponse:
      type: object
      required: [ok, job_id, status, cancel_requested, created_unix_ms, updated_unix_ms, events_cursor_base, events_cursor_end]
      properties:
        ok: { type: boolean }
        job_id: { type: string }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        status: { type: string }
        priority:
          type: integer
          format: int32
          description: Higher jobs run sooner (scheduler hint).
        error: { type: string }
        cancel_requested: { type: boolean }
        created_unix_ms: { type: integer, format: int64 }
        updated_unix_ms: { type: integer, format: int64 }
        events_cursor_base: { type: integer, format: uint64 }
        events_cursor_end: { type: integer, format: uint64 }
        events_reset: { type: boolean }
        events_cursor_next: { type: integer, format: uint64 }
        events:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvent"

    WorkflowTaskSpec:
      type: object
      required: [task_id, request]
      properties:
        task_id: { type: string }
        depends_on:
          type: array
          items: { type: string }
        max_attempts: { type: integer, format: int32 }
        priority:
          type: integer
          format: int32
          description: Higher tasks run sooner (scheduler hint). Overrides workflow priority.
        request:
          $ref: "#/components/schemas/RunRequest"
        expect:
          type: object
          description: Deterministic correctness assertions (engine-enforced)
          additionalProperties: true

    WorkflowSubmitRequest:
      type: object
      required: [tasks]
      properties:
        workflow_id: { type: string }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        session_id: { type: string }
        priority:
          type: integer
          format: int32
          description: Higher workflows/tasks run sooner (scheduler hint). Default 0. Clamped to [-1000, 1000].
        allow_sessions: { type: boolean }
        allow_inline_api_keys: { type: boolean }
        defaults:
          type: object
          additionalProperties: true
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowTaskSpec"

    WorkflowGetResponse:
      type: object
      required: [ok, workflow]
      properties:
        ok: { type: boolean }
        workflow:
          type: object
          required: [workflow_id, status, cancel_requested, created_unix_ms, updated_unix_ms]
          properties:
            workflow_id: { type: string }
            status: { type: string }
            priority:
              type: integer
              format: int32
              description: Higher workflows/tasks run sooner (scheduler hint).
            trace_id: { $ref: "#/components/schemas/TraceID" }
            session_id: { type: string }
            cancel_requested: { type: boolean }
            error: { type: string }
            created_unix_ms: { type: integer, format: int64 }
            updated_unix_ms: { type: integer, format: int64 }
        tasks:
          type: array
          items:
            type: object
            additionalProperties: true
        result:
          type: object
          additionalProperties: true
