openapi: 3.0.3
info:
  title: agentd HTTP API
  version: "v1"
  description: |
    Machine-readable contract for the agentd daemon.

    Notes:
    - Many endpoints accept a Bearer auth token when agentd is started with `--auth-token`.
    - `trace_id` is an optional client-provided correlation identifier. If omitted, agentd generates one.
servers:
  - url: http://127.0.0.1:8080

tags:
  - name: health
  - name: config
  - name: run
  - name: jobs
  - name: workflows
  - name: tools
  - name: avm
  - name: memory
  - name: edge
  - name: sessions

paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, version]
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  version: { type: string }

  /api/v1/config:
    get:
      tags: [config]
      summary: Get daemon configuration (safe snapshot)
      description: |
        Returns a safe snapshot of the daemon configuration.

        Notes:
        - Requires Bearer auth when the daemon is started with `--auth-token`.
        - Does not include secret values (auth token, provider API keys).
        - `engines.workflow_http_*` fields describe outbound deterministic HTTP policy for workflow tasks like
          `kind:"http_json"` and `kind:"agentd_call"`.
      responses:
        "200":
          description: Config snapshot (safe)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentdConfigResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/config/update:
    post:
      tags: [config]
      summary: Update daemon configuration defaults (persists to DB)
      description: |
        Updates non-secret default configuration values and persists them to the daemon DB so they survive restart.

        Notes:
        - Requires Bearer auth when the daemon is started with `--auth-token`.
        - This endpoint is intended for operator control planes and local bring-up tooling.
        - Provider API keys may be set/cleared via `provider_keys` or `api_key` and are stored in the daemon DB
          (response only includes boolean flags, not secret values).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentdConfigUpdateRequest"
      responses:
        "200":
          description: Update acknowledged (safe summary)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentdConfigUpdateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Persist failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tools:
    get:
      tags: [tools]
      summary: List available tools
      responses:
        "200":
          description: Tools list
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  defs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ToolDef"

  /api/v1/avm/job_scan:
    post:
      tags: [avm]
      summary: Scan an AVM job object without executing bytecode
      description: |
        Runs `AGENTD_AVM_BIN --print-job-json <tmp.obc>` and returns the parsed job JSON.

        Notes:
        - This endpoint requires daemon auth when `--auth-token` is set (same as most control-plane endpoints).
        - The daemon must be started with `--yolo` (default) because it runs a subprocess.
        - `AGENTD_AVM_BIN` must be set in the daemon environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obc_base64]
              properties:
                obc_base64:
                  type: string
                  description: Base64-encoded `.obc` bytes
      responses:
        "200":
          description: Job JSON plus execution metadata
          content:
            application/json:
              schema:
                type: object
                required: [ok, job, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  job:
                    type: object
                    additionalProperties: true
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Policy rejected (scoped mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AVM binary not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: AVM timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/avm/policy_scan:
    post:
      tags: [avm]
      summary: Scan an AVM capability policy without executing bytecode
      description: |
        Runs `AGENTD_AVM_BIN --print-policy-json <tmp.obc>` and returns the parsed policy JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obc_base64]
              properties:
                obc_base64:
                  type: string
                  description: Base64-encoded `.obc` bytes
      responses:
        "200":
          description: Policy JSON plus execution metadata
          content:
            application/json:
              schema:
                type: object
                required: [ok, policy, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  policy:
                    type: object
                    additionalProperties: true
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }

  /api/v1/avm/inspect:
    post:
      tags: [avm]
      summary: Inspect an OBC capsule without executing bytecode
      description: |
        Runs `AGENTD_AVM_BIN --inspect-json <tmp.obc>` and returns the parsed inspect JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obc_base64]
              properties:
                obc_base64:
                  type: string
                  description: Base64-encoded `.obc` bytes
      responses:
        "200":
          description: Inspect JSON plus execution metadata
          content:
            application/json:
              schema:
                type: object
                required: [ok, inspect, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  inspect:
                    type: object
                    additionalProperties: true
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }

  /api/v1/avm/verify_strict:
    post:
      tags: [avm]
      summary: Verify OBC strict mode (no execution)
      description: |
        Runs `AGENTD_AVM_BIN --verify-strict <tmp.obc>` (verifier only, no bytecode execution).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obc_base64]
              properties:
                obc_base64:
                  type: string
                  description: Base64-encoded `.obc` bytes
      responses:
        "200":
          description: Verified OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }
        "422":
          description: Strict verification failed

  /api/v1/avm/trace_hash:
    post:
      tags: [avm]
      summary: Compute AVM TRACE_HASH for an OBC capsule
      description: |
        Runs `AGENTD_AVM_BIN --print-trace-hash <tmp.obc>` and extracts the `TRACE_HASH` token from output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obc_base64]
              properties:
                obc_base64:
                  type: string
                  description: Base64-encoded `.obc` bytes
      responses:
        "200":
          description: TRACE_HASH plus execution metadata
          content:
            application/json:
              schema:
                type: object
                required: [ok, trace_hash, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  trace_hash: { type: string }
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }

  /api/v1/avm/capsule_run:
    post:
      tags: [avm]
      summary: Execute an OBC capsule under AVM safe defaults (capsule mode)
      description: |
        Executes bytecode using Oren AVM in capsule mode (`--capsule`), with explicit budgets and deterministic knobs.

        This endpoint is intentionally gated:
        - requires daemon auth when enabled
        - requires daemon yolo mode (`--yolo`, default)
        - requires `AGENTD_AVM_BIN` to point to the AVM binary
        - requires `AGENTD_AVM_EXEC=1` in the daemon environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvmCapsuleRunArgs"
      responses:
        "200":
          description: Execution result (ok indicates VM exit_code==0)
          content:
            application/json:
              schema:
                type: object
                required: [ok, run, exit_code, timed_out, truncated, stdout]
                properties:
                  ok: { type: boolean }
                  run:
                    type: object
                    additionalProperties: true
                  result_hash: { type: string }
                  trace_hash: { type: string }
                  state_hash: { type: string }
                  exit_code: { type: integer, format: int32 }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  stdout: { type: string }
        "403":
          description: Execution disabled by policy
        "400":
          description: Invalid request
        "502":
          description: AVM failed
        "504":
          description: AVM timed out

  /api/v1/run:
    post:
      tags: [run]
      summary: Run a prompt (sync)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Run result (OK or error; see `ok`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"

  /api/v1/run_async:
    post:
      tags: [run, jobs]
      summary: Run a prompt (async job)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, job_id, trace_id]
                properties:
                  ok: { type: boolean }
                  job_id: { type: string }
                  trace_id: { $ref: "#/components/schemas/TraceID" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: job_id collision

  /api/v1/job:
    get:
      tags: [jobs]
      summary: Get job status (optionally with bounded events slice)
      parameters:
        - in: query
          name: job_id
          required: true
          schema: { type: string }
        - in: query
          name: include_events
          required: false
          schema: { type: boolean }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: uint64 }
        - in: query
          name: max_events
          required: false
          schema: { type: integer, format: uint64 }
      responses:
        "200":
          description: Job snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobGetResponse"
    delete:
      tags: [jobs]
      summary: Delete a terminal job from memory (best-effort)
      parameters:
        - in: query
          name: job_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted (or already absent)

  /api/v1/job/cancel:
    post:
      tags: [jobs]
      summary: Request job cancellation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id]
              properties:
                job_id: { type: string }
      responses:
        "200":
          description: Cancellation requested

  /api/v1/job/stream:
    get:
      tags: [jobs]
      summary: Stream job events (SSE)
      description: |
        Streams `agent_event` and terminal `job_done` events as Server-Sent Events.
      parameters:
        - in: query
          name: job_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: uint64 }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/trace:
    get:
      tags: [run]
      summary: Lookup persisted records by trace_id
      description: |
        Returns best-effort persisted records whose JSON contains the given `trace_id`.

        Sources (best-effort):
        - durable run/workflow audit records (`audit_records`)
        - durable workflow events (`workflow_events`) for workflows whose `workflows.trace_id` matches (indexed),
          returned as wrapper objects with `source:"workflow_event"`.
        - edge interop task metadata (`edge_tasks`), task events (`edge_task_events`), and inbound envelopes (`edge_inbox_messages`)
          returned as wrapper objects with `source:"edge_task"` / `source:"edge_task_event"` / `source:"edge_inbox_message"`.
        - edge workflow events (`edge_workflow_events`) correlated via `edge_tasks.trace_id` (and also `workflow_id == trace_id`),
          returned as wrapper objects with `source:"edge_workflow_event"`.

        Notes:
        - Only runs persisted with `no_session=false` will appear (audit_records are DB-backed).
        - This is a best-effort query intended for debugging/correlation, not a primary index.
      parameters:
        - in: query
          name: trace_id
          required: true
          schema:
            $ref: "#/components/schemas/TraceID"
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
        - in: query
          name: max_bytes
          required: false
          schema: { type: integer, format: int32 }
        - in: query
          name: include_memory
          required: false
          schema: { type: boolean }
          description: When true, also attach best-effort structured memory correlation under `memory_correlate` (default false).
        - in: query
          name: memory_since_utc_ms
          required: false
          schema: { type: integer, format: int64 }
          description: When include_memory=true, lower bound for checkpoint scan (default 0).
        - in: query
          name: memory_until_utc_ms
          required: false
          schema: { type: integer, format: int64 }
          description: When include_memory=true, upper bound for checkpoint scan (default INT64_MAX).
        - in: query
          name: memory_max_entries
          required: false
          schema: { type: integer, format: int32 }
          description: When include_memory=true, max entries to return per checkpoint (default 200; clamped).
        - in: query
          name: memory_timeline
          required: false
          schema: { type: boolean }
          description: When include_memory=true, return a bounded checkpoint timeline instead of only the newest checkpoint (default false).
      responses:
        "200":
          description: Trace lookup response
          content:
            application/json:
              schema:
                type: object
                required: [ok, trace_id, records]
                properties:
                  ok: { type: boolean }
                  trace_id: { $ref: "#/components/schemas/TraceID" }
                  count: { type: integer, format: int32 }
                  records:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  memory_correlate:
                    $ref: "#/components/schemas/MemoryCorrelateResponse"

  /api/v1/memory/consolidate:
    post:
      tags: [memory]
      summary: Promote @mem markers into structured memory
      description: |
        Deterministic rolling consolidation:
        - scans recent daily memory files for explicit `@mem` markers
        - upserts them into `memory/STRUCTURED.md`
        - writes a checkpoint snapshot (best-effort) when changes occur
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                daily_days: { type: integer, format: int32 }
                keep_checkpoints: { type: integer, format: int32 }
                max_entries: { type: integer, format: int32 }
                dry_run: { type: boolean }
      responses:
        "200":
          description: Consolidation report
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Invalid request or consolidation not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/memory/checkpoints:
    get:
      tags: [memory]
      summary: List structured memory checkpoints (rolling snapshots)
      description: |
        Lists `memory/checkpoints/structured_*.json` snapshots with deterministic `sha256`.
        Useful for time correlation and replay surfaces.
      parameters:
        - in: query
          name: since_utc_ms
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: until_utc_ms
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: structured_path
          required: false
          schema: { type: string }
          description: Only return checkpoints whose `path` matches this structured file (e.g. `STRUCTURED.md`).
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Checkpoints list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCheckpointsResponse"

  /api/v1/memory/correlate:
    get:
      tags: [memory]
      summary: Correlate structured memory evidence by trace_id (bounded)
      description: |
        Selects the newest structured checkpoint in the requested time window and returns
        structured keys whose `sources[]` mention `trace:<trace_id>`.
      parameters:
        - in: query
          name: trace_id
          required: true
          schema: { $ref: "#/components/schemas/TraceID" }
        - in: query
          name: since_utc_ms
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: until_utc_ms
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: structured_path
          required: false
          schema: { type: string }
          description: Only consider checkpoints whose `path` matches this structured file (e.g. `STRUCTURED.md`).
        - in: query
          name: max_entries
          required: false
          schema: { type: integer, format: int32 }
        - in: query
          name: key_prefix
          required: false
          schema: { type: string }
          description: Restrict matches to keys that start with this prefix (e.g. `wf.test.`).
        - in: query
          name: timeline
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Correlation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCorrelateResponse"

  /api/v1/memory/query:
    get:
      tags: [memory]
      summary: Query structured memory current view (bounded)
      description: |
        Selects the newest structured checkpoint in the requested time window and returns
        the current structured keys filtered by `key_prefix` (if provided).
      parameters:
        - in: query
          name: since_utc_ms
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: until_utc_ms
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: structured_path
          required: false
          schema: { type: string }
          description: Only consider checkpoints whose `path` matches this structured file (e.g. `STRUCTURED.md`).
        - in: query
          name: key_prefix
          required: false
          schema: { type: string }
          description: Restrict results to keys that start with this prefix (e.g. `wf.`).
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
          description: Max number of entries to return (clamped).
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryQueryResponse"

  /api/v1/workflow/submit:
    post:
      tags: [workflows]
      summary: Submit a durable workflow (DAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowSubmitRequest"
      responses:
        "200":
          description: Workflow accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow_id, trace_id, deduped]
                properties:
                  ok: { type: boolean }
                  workflow_id: { type: string }
                  trace_id: { $ref: "#/components/schemas/TraceID" }
                  session_id: { type: string }
                  deduped:
                    type: boolean
                    description: If true, the workflow already existed for the provided idempotency_key and was not re-created.
        "429":
          description: Admission control / backpressure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workflow:
    get:
      tags: [workflows]
      summary: Get workflow status
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: include_tasks
          required: false
          schema: { type: boolean }
        - in: query
          name: include_results
          required: false
          schema: { type: boolean }
        - in: query
          name: include_spec
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Workflow snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowGetResponse"

  /api/v1/workflow/stats:
    get:
      tags: [workflows]
      summary: Workflow scheduler stats (queue pressure)
      parameters:
        - in: query
          name: include_budget_pressure
          required: false
          schema: { type: boolean }
          description: If true, include best-effort aggregate budget pressure under `budget_pressure`.
        - in: query
          name: budget_workflow_limit
          required: false
          schema: { type: integer, format: int32 }
          description: Max number of queued|running workflows to scan for budget pressure (default 64; max 512).
        - in: query
          name: include_budget_workflows
          required: false
          schema: { type: boolean }
          description: If true, include a small sampled workflow list under `budget_pressure.workflows` (best-effort).
        - in: query
          name: include_sessions
          required: false
          schema: { type: boolean }
          description: If true, include per-session inflight snapshot under `sessions` (best-effort).
        - in: query
          name: session_limit
          required: false
          schema: { type: integer, format: int32 }
          description: Max number of session rows to return when include_sessions=true (default 32; max 512).
        - in: query
          name: include_no_session
          required: false
          schema: { type: boolean }
          description: When include_sessions=true, include empty session_id bucket (default false).
      responses:
        "200":
          description: Scheduler stats snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatsResponse"

  /api/v1/workflows:
    get:
      tags: [workflows]
      summary: List workflows by status
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                type: object
                required: [ok, status, workflows]
                properties:
                  ok: { type: boolean }
                  status: { type: string }
                  workflows:
                    type: array
                    items:
                      type: object
                      required: [workflow_id, status, priority, cancel_requested, created_unix_ms, updated_unix_ms]
                      properties:
                        workflow_id: { type: string }
                        status: { type: string }
                        priority: { type: integer, format: int32 }
                        deadline_unix_ms: { type: integer, format: int64 }
                        idempotency_key: { type: string }
                        trace_id: { $ref: "#/components/schemas/TraceID" }
                        session_id: { type: string }
                        cancel_requested: { type: boolean }
                        error: { type: string }
                        created_unix_ms: { type: integer, format: int64 }
                        updated_unix_ms: { type: integer, format: int64 }

  /api/v1/workflow/cancel:
    post:
      tags: [workflows]
      summary: Cancel a workflow (best-effort)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id]
              properties:
                workflow_id: { type: string }
      responses:
        "200":
          description: Cancellation requested

  /api/v1/workflow/events:
    get:
      tags: [workflows]
      summary: List workflow events (durable)
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: after_event_id
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Workflow event slice
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow_id, events, cursor_next]
                properties:
                  ok: { type: boolean }
                  workflow_id: { type: string }
                  after_event_id: { type: integer, format: int64 }
                  cursor_next: { type: integer, format: int64 }
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /api/v1/workflow/stream:
    get:
      tags: [workflows]
      summary: Stream workflow events (SSE)
      description: |
        Streams `workflow_event` events (durable workflow event log) and ends with terminal `workflow_done`.
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/edge/message:
    post:
      tags: [edge]
      summary: Ingest an UM-BMP message envelope (edge interop)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeMessageEnvelope"
      responses:
        "200":
          description: Accepted (idempotent)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  deduped: { type: boolean }

  /api/v1/edge/outbox:
    get:
      tags: [edge]
      summary: Poll outbound UM-BMP messages for a node (outbox cursor)
      parameters:
        - in: query
          name: node_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Outbox slice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgeOutboxResponse"

  /api/v1/edge/nodes:
    get:
      tags: [edge]
      summary: List registered edge nodes
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Nodes list

  /api/v1/edge/node:
    get:
      tags: [edge]
      summary: Get node registry record (summary)
      parameters:
        - in: query
          name: node_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Node record

  /api/v1/edge/node/caps:
    get:
      tags: [edge]
      summary: Get node capability manifest (UM-ACDS)
      parameters:
        - in: query
          name: node_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Node manifest

  /api/v1/edge/task/assign:
    post:
      tags: [edge]
      summary: Enqueue a TASK_ASSIGN to a node (platform helper)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeTaskAssignRequest"
      responses:
        "200":
          description: Enqueued
          content:
            application/json:
              schema:
                type: object
                required: [ok, node_id, task_id, step_id, outbox_id]
                properties:
                  ok: { type: boolean }
                  node_id: { type: string }
                  task_id: { type: string }
                  step_id: { type: string }
                  outbox_id: { type: integer, format: int64 }
                  deduped: { type: boolean }

  /api/v1/edge/task:
    get:
      tags: [edge]
      summary: Get an edge task status
      description: |
        Returns a platform-side view of the edge task row.

        Notes (best-effort):
        - When a task reaches `SUCCEEDED` with a persisted `result`, the platform also stores a deterministic
          hash surface `result_sha256` (sha256 of stored `result_json` bytes).
        - If the node reports a `result.attest` object in `TASK_DONE`, the platform persists it and surfaces it
          as `task.attest`.
      parameters:
        - in: query
          name: task_id
          required: true
          schema: { type: string }
        - in: query
          name: step_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task state
          content:
            application/json:
              schema:
                type: object
                required: [ok, task]
                properties:
                  ok: { type: boolean }
                  task:
                    type: object
                    additionalProperties: true

  /api/v1/edge/rule/upsert:
    post:
      tags: [edge]
      summary: Create or update an automation rule (SENSOR_EVENT -> action)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeRuleUpsertRequest"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                type: object
                required: [ok, rule_id]
                properties:
                  ok: { type: boolean }
                  rule_id: { type: string }

  /api/v1/edge/rules:
    get:
      tags: [edge]
      summary: List automation rules
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Rules list

  /api/v1/edge/rule:
    delete:
      tags: [edge]
      summary: Delete an automation rule
      parameters:
        - in: query
          name: rule_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/v1/edge/workflow/submit:
    post:
      tags: [edge]
      summary: Submit a durable edge workflow (UM-WF)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeWorkflowSubmitRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow_id]
                properties:
                  ok: { type: boolean }
                  workflow_id: { type: string }

  /api/v1/edge/workflow/cancel:
    post:
      tags: [edge]
      summary: Cancel an edge workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id]
              properties:
                workflow_id: { type: string }
      responses:
        "200":
          description: Canceled

  /api/v1/edge/workflow:
    get:
      tags: [edge]
      summary: Get an edge workflow
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: include_steps
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Workflow

  /api/v1/edge/workflow/events:
    get:
      tags: [edge]
      summary: List edge workflow events (paged)
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Events list

  /api/v1/edge/workflow/stream:
    get:
      tags: [edge]
      summary: Stream edge workflow events (SSE)
      parameters:
        - in: query
          name: workflow_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: SSE stream (text/event-stream)

  /api/v1/edge/workflows:
    get:
      tags: [edge]
      summary: List edge workflows by status
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Workflows list

  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: List sessions
      responses:
        "200":
          description: Sessions list

components:
  schemas:
    TraceID:
      type: string
      description: Correlation identifier (client-provided or server-generated)
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:@-]{1,128}$"

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error: { type: string }

    AgentdConfigResponse:
      type: object
      required: [ok, service, version, daemon, engines]
      properties:
        ok: { type: boolean }
        service: { type: string }
        version: { type: string }
        have_jsoncpp: { type: boolean }
        have_sqlite3: { type: boolean }
        daemon:
          type: object
          additionalProperties: true
          properties:
            listen_host: { type: string }
            listen_port: { type: integer, format: int64 }
            base_url: { type: string }
            model: { type: string }
            summary_model: { type: string, nullable: true }
            summary_max_chars: { type: integer, format: int64 }
            timeout_ms: { type: integer, format: int64 }
            proxy_url_set: { type: boolean }
            api_key_set: { type: boolean }
            provider_keys_set:
              type: object
              additionalProperties: true
              properties:
                deepseek: { type: boolean }
                openrouter: { type: boolean }
                moonshot: { type: boolean }
                openai: { type: boolean }
            auth_enabled: { type: boolean }
            allow_unauthenticated_non_loopback: { type: boolean }
            db_path: { type: string, nullable: true }
            state_dir: { type: string, nullable: true }
            sessions_root_dir: { type: string, nullable: true }
        cors:
          type: object
          additionalProperties: true
        sandbox:
          type: object
          additionalProperties: true
        jobs:
          type: object
          additionalProperties: true
        engines:
          type: object
          additionalProperties: true
          properties:
            workflow_enable_http_tasks: { type: boolean }
            workflow_http_allow_hosts:
              type: array
              items: { type: string }
            workflow_http_allow_cidrs:
              type: array
              items: { type: string }
            workflow_http_deny_cidrs:
              type: array
              items: { type: string }
            workflow_http_deny_private_addrs: { type: boolean }
            workflow_http_dns_pin: { type: boolean }
        memory:
          type: object
          additionalProperties: true

    AgentdConfigUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        base_url:
          type: string
          description: Default base_url (used for provider inference and some clients)
        model:
          type: string
          description: Default model
        system_profile:
          type: string
          description: Default host system profile (e.g. default, jules_codex)
        summary_model:
          type: string
          nullable: true
          description: Optional model for compaction summaries (set null to clear)
        summary_max_chars:
          type: integer
          format: int64
          description: Max chars for inserted summary
        timeout_ms:
          type: integer
          format: int64
          description: Provider HTTP timeout in ms
        proxy_url:
          type: string
          nullable: true
          description: Optional HTTP proxy override (set null to clear)
        workflow_admit_max_inflight_tasks_per_session:
          type: integer
          format: int32
          description: Admission control cap (queued|running tasks per session); 0 disables
        workflow_admit_max_inflight_tasks_total:
          type: integer
          format: int32
          description: Admission control cap (queued|running tasks total); 0 disables
        workflow_http_allow_hosts:
          type: array
          items: { type: string }
          description: Optional allowlist for workflow outbound HTTP targets (replaces the whole list)
        workflow_http_allow_cidrs:
          type: array
          items: { type: string }
          description: Optional CIDR allowlist for workflow outbound HTTP targets (replaces the whole list)
        workflow_http_deny_cidrs:
          type: array
          items: { type: string }
          description: Optional CIDR denylist for workflow outbound HTTP targets (replaces the whole list)
        workflow_http_deny_private_addrs:
          type: boolean
          description: Deny private/loopback/link-local unless explicitly allowed (defense-in-depth)
        workflow_http_dns_pin:
          type: boolean
          description: Pin hostname DNS results per request (defense-in-depth vs DNS rebinding)
        provider:
          type: string
          description: Provider name for `api_key` (if omitted, inferred from base_url)
        api_key:
          type: string
          description: Provider API key (empty string clears)
        provider_keys:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: Map of provider name → API key (null clears that provider key)

    AgentdConfigUpdateResponse:
      type: object
      required: [ok, base_url, model, system_profile, summary_max_chars, timeout_ms, proxy_url_set, provider_keys_set]
      properties:
        ok: { type: boolean }
        base_url: { type: string }
        model: { type: string }
        system_profile: { type: string }
        summary_model: { type: string, nullable: true }
        summary_max_chars: { type: integer, format: int64 }
        timeout_ms: { type: integer, format: int64 }
        proxy_url_set: { type: boolean }
        engines:
          type: object
          additionalProperties: true
          description: Best-effort echo of workflow outbound HTTP policy knobs after update
        provider_keys_set:
          type: object
          additionalProperties: true
          properties:
            deepseek: { type: boolean }
            openrouter: { type: boolean }
            moonshot: { type: boolean }
            openai: { type: boolean }

    MemoryCheckpointMeta:
      type: object
      required: [checkpoint_path, ts_utc, ts_utc_ms, sha256, bytes]
      properties:
        checkpoint_path: { type: string }
        structured_path: { type: string }
        ts_utc: { type: string }
        ts_utc_ms: { type: integer, format: int64 }
        sha256:
          type: string
          description: SHA-256 of the checkpoint JSON bytes (lowercase hex)
          pattern: "^[a-f0-9]{64}$"
        bytes: { type: integer, format: int64 }

    MemoryCheckpointsResponse:
      type: object
      required: [ok, memory_root, since_utc_ms, until_utc_ms, checkpoints]
      properties:
        ok: { type: boolean }
        memory_root: { type: string }
        since_utc_ms: { type: integer, format: int64 }
        until_utc_ms: { type: integer, format: int64 }
        structured_path_filter:
          type: string
          description: Echoes the requested `structured_path` filter when provided.
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/MemoryCheckpointMeta"

    MemoryCorrelateResponse:
      type: object
      required: [ok, trace_id, needle, since_utc_ms, until_utc_ms]
      properties:
        ok: { type: boolean }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        needle:
          type: string
          description: Evidence needle used against sources[] (default trace:<trace_id>)
        since_utc_ms: { type: integer, format: int64 }
        until_utc_ms: { type: integer, format: int64 }
        structured_path_filter:
          type: string
          description: Echoes the requested `structured_path` filter when provided.
        key_prefix:
          type: string
          description: Echoes the requested `key_prefix` filter when provided.
        checkpoint:
          $ref: "#/components/schemas/MemoryCheckpointMeta"
        entries:
          type: array
          items:
            type: object
            required: [key, record]
            properties:
              key: { type: string }
              record:
                type: object
                additionalProperties: true
        timeline:
          type: array
          items:
            type: object
            required: [checkpoint, entries]
            properties:
              checkpoint:
                $ref: "#/components/schemas/MemoryCheckpointMeta"
              entries:
                type: array
                items:
                  type: object
                  required: [key, record]
                  properties:
                    key: { type: string }
                    record:
                      type: object
                      additionalProperties: true

    MemoryQueryResponse:
      type: object
      required: [ok, memory_root, since_utc_ms, until_utc_ms, limit, returned, checkpoint, entries]
      properties:
        ok: { type: boolean }
        memory_root: { type: string }
        since_utc_ms: { type: integer, format: int64 }
        until_utc_ms: { type: integer, format: int64 }
        structured_path_filter:
          type: string
          description: Echoes the requested `structured_path` filter when provided.
        key_prefix:
          type: string
          description: Echoes the requested `key_prefix` filter when provided.
        limit:
          type: integer
          format: int32
          description: Max entries requested (after clamping).
        returned:
          type: integer
          format: int32
          description: Number of entries returned.
        checkpoint:
          $ref: "#/components/schemas/MemoryCheckpointMeta"
        entries:
          type: array
          items:
            type: object
            required: [key, record]
            properties:
              key: { type: string }
              record:
                type: object
                additionalProperties: true

    EdgeMessageEnvelope:
      type: object
      required: [msg_id, ts_utc_ms, type, from, to, body]
      properties:
        msg_id: { type: string }
        ts_utc_ms: { type: integer, format: int64 }
        type: { type: string }
        from: { type: string }
        to:
          description: Destination address or null
          type: string
          nullable: true
        body:
          type: object
          additionalProperties: true
        auth:
          type: object
          additionalProperties: true
        trace:
          type: object
          additionalProperties: true

    EdgeOutboxResponse:
      type: object
      required: [ok, node_id, cursor_base, cursor_next, messages]
      properties:
        ok: { type: boolean }
        node_id: { type: string }
        cursor_base: { type: integer, format: int64 }
        cursor_next: { type: integer, format: int64 }
        messages:
          type: array
          items:
            type: object
            required: [outbox_id, ts_utc_ms]
            properties:
              outbox_id: { type: integer, format: int64 }
              ts_utc_ms: { type: integer, format: int64 }
              msg:
                $ref: "#/components/schemas/EdgeMessageEnvelope"
              msg_raw: { type: string }
              parse_error: { type: string }

    EdgeTaskAssignRequest:
      type: object
      required: [task_id, step_id, idempotency_key, mode, deadline_utc_ms, payload]
      properties:
        trace:
          type: object
          description: Optional trace correlation object (best-effort). Recommended field: trace_id.
          additionalProperties: true
        node_id:
          type: string
          description: Explicit target node_id (preferred when known)
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
        match_any:
          type: object
          description: |
            Capability-based node selection.

            Common keys (best-effort):
            - `requires_tools` (array of tool names)
            - `tags_all`, `tags_any`, `tags_none` (arrays of tag strings)
            - `exclude_node_ids` (array of node_id strings to exclude; useful for distinct-node fan-out)
          additionalProperties: true
        allow_hazards:
          type: array
          description: Explicitly allowed hazard tags (unsafe; use sparingly)
          items: { type: string }
        allow_high_side_effect:
          type: boolean
          description: Allow dispatch when tool side_effect_level is high
        task_id:
          type: string
          description: Task identifier (id-safe token)
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
        step_id:
          type: string
          description: Step identifier within the task/workflow (id-safe token)
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
        idempotency_key:
          type: string
          description: Idempotency token used for platform-side dedupe (id-safe token)
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
        mode:
          type: string
          enum: [invoke, agent]
        deadline_utc_ms: { type: integer, format: int64 }
        attempt:
          type: integer
          format: int32
          description: Optional attempt number (for workflow orchestration/debug; default 0)
        payload:
          type: object
          description: |
            Task payload.

            - mode=invoke: requires payload.tool (string) and payload.args (object). When the target node has a stored
              manifest, payload.args is validated (best-effort) against the tool schema in the node manifest:
              manifest.tools[].parameters_schema (preferred) or manifest.tools[].parameters (fallback).
              If the schema specifies additionalProperties:false, unknown keys are rejected.
            - mode=agent: payload is forwarded to the node/embedded agent_core; platform does not interpret it.
          additionalProperties: true

    EdgeRuleUpsertRequest:
      type: object
      required: [event_type, action]
      properties:
        rule_id:
          type: string
          description: Optional; if omitted, server generates one
        enabled: { type: boolean }
        event_type: { type: string }
        min_confidence: { type: number, format: double }
        cooldown_ms: { type: integer, format: int32 }
        action:
          type: object
          description: |
            Rule action.

            Supported `type` values:
            - `task_assign`: enqueue a UM‑BMP `TASK_ASSIGN` (like `POST /api/v1/edge/task/assign`)
            - `durable_workflow_submit`: submit a durable workflow to the platform workflow engine

            Note: OpenAPI cannot fully express the conditional shape; see server behavior.
          additionalProperties: true

    EdgeWorkflowSubmitRequest:
      type: object
      required: [steps]
      properties:
        workflow_id:
          type: string
          description: Optional; if omitted, server generates one
        goal: { type: string }
        priority: { type: integer, format: int32 }
        steps:
          type: array
          items:
            type: object
            required: [step_id, kind]
            properties:
              step_id: { type: string }
              kind: { type: string, enum: [invoke_tool, run_agent, join] }
              depends_on:
                type: array
                items: { type: string }
              target:
                type: object
                additionalProperties: true
              payload:
                type: object
                additionalProperties: true
              join_mode: { type: string, enum: [all, any] }
              deadline_utc_ms: { type: integer, format: int64 }
              max_attempts: { type: integer, format: int32 }
              backoff_ms: { type: integer, format: int32 }

    ToolDef:
      type: object
      required: [name, description, parameters]
      properties:
        name: { type: string }
        description: { type: string }
        parameters:
          type: object
          description: JSON Schema-like parameters

    RunRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        session_id: { type: string }
        no_session: { type: boolean }
        inputs:
          type: object
          description: Optional workflow/task-local input variables (expanded in durable workflow tasks).
          additionalProperties: true
        priority:
          type: integer
          format: int32
          description: Higher runs sooner (scheduler hint). Default 0. Clamped to [-1000, 1000].
        tools:
          type: string
          description: Tool mode
          enum: [none, basic, host]
        model: { type: string }
        base_url: { type: string }
        api_key: { type: string }
        max_steps: { type: integer, format: int64 }
        max_tool_calls_total:
          type: integer
          format: int64
          minimum: 0
          description: Total tool calls allowed in the tool loop (0 disables/unlimited).
        max_tool_calls_per_tool:
          type: integer
          format: int64
          minimum: 0
