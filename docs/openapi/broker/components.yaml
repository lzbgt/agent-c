parameters:
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: false
    schema: { type: string }
    description: |
      Optional idempotency key for safe retries. Allowed characters: [A-Za-z0-9-_.:@], max length 128.
      Alias header: X-Idempotency-Key.
schemas:
  BrokerCapsResponse:
    type: object
    required: [ok, service, version, api_version]
    properties:
      ok: { type: boolean }
      service: { type: string }
      version: { type: string }
      api_version: { type: string }
      now_unix_ms: { type: integer, format: int64 }
      uptime_ms: { type: integer, format: int64 }
      features:
        type: object
        additionalProperties: true
      limits:
        type: object
        additionalProperties: true

  ClientPrefsConnectionProfile:
    $ref: ./components/client_prefs.yaml#/ClientPrefsConnectionProfile
  ClientPrefsConnection:
    $ref: ./components/client_prefs.yaml#/ClientPrefsConnection
  ClientPrefs:
    $ref: ./components/client_prefs.yaml#/ClientPrefs
  ClientPrefsUpdateRequest:
    $ref: ./components/client_prefs.yaml#/ClientPrefsUpdateRequest
  ClientPrefsResponse:
    $ref: ./components/client_prefs.yaml#/ClientPrefsResponse

  AudioSessionCreateRequest:
    type: object
    required: [agent_id]
    properties:
      agent_id: { type: string }
      deployment_id: { type: string }
      mode: { type: string, description: "Signaling mode (default: webrtc)" }
      metadata:
        type: object
        additionalProperties: true

  AudioSessionCreateResponse:
    type: object
    required: [ok, session_id]
    properties:
      ok: { type: boolean }
      session_id: { type: string }
      expires_unix_ms: { type: integer, format: int64 }
      signal:
        type: object
        properties:
          send_url: { type: string }
          recv_url: { type: string }

  AudioSignalRequest:
    type: object
    required: [type]
    properties:
      type:
        type: string
        description: "offer|answer|candidate|bye|control"
      payload:
        type: object
        additionalProperties: true

  AudioSignalResponse:
    type: object
    required: [ok]
    properties:
      ok: { type: boolean }

  AudioSignalEvent:
    type: object
    required: [type, ts_unix_ms]
    properties:
      type: { type: string }
      payload:
        type: object
        additionalProperties: true
      from: { type: string }
      ts_unix_ms: { type: integer, format: int64 }

  AgentInfo:
    type: object
    required: [agent_id, owner_sub, enabled, created_unix_ms, connected]
    properties:
      agent_id: { type: string }
      owner_sub: { type: string }
      enabled: { type: boolean }
      created_unix_ms: { type: integer, format: int64 }
      connected: { type: boolean }
      connected_unix_ms: { type: integer, format: int64 }
      last_seen_unix_ms: { type: integer, format: int64 }
      remote_addr: { type: string }
      labels:
        type: object
        additionalProperties: true
      meta:
        type: object
        additionalProperties: true
      deployments:
        type: array
        items:
          $ref: "#/components/schemas/DeploymentInfo"
  DeploymentInfo:
    type: object
    required: [deployment_id, connected]
    properties:
      deployment_id: { type: string }
      connected: { type: boolean }
      connected_unix_ms: { type: integer, format: int64 }
      last_seen_unix_ms: { type: integer, format: int64 }
      remote_addr: { type: string }
      meta:
        type: object
        additionalProperties: true
  AgentDeploymentsResponse:
    type: object
    required: [ok, agent_id, deployments]
    properties:
      ok: { type: boolean }
      agent_id: { type: string }
      default_deployment_id: { type: string }
      deployments:
        type: array
        items:
          $ref: "#/components/schemas/DeploymentInfo"
  BrokerOtaUpdateRequest:
    type: object
    required: [url]
    properties:
      url: { type: string }
      sha256: { type: string }
      version: { type: string }
      reason: { type: string }
      trace_id: { type: string }
      drain_timeout_ms: { type: integer, format: int64 }
      deployment_ids:
        type: array
        items: { type: string }
      deployment_id: { type: string }
      deployments:
        type: array
        items: { type: string }
    additionalProperties: true
  BrokerOtaBulkResult:
    type: object
    required: [deployment_id, status, data]
    properties:
      deployment_id: { type: string }
      status: { type: integer, format: int32 }
      data:
        type: object
        additionalProperties: true
  BrokerOtaBulkResponse:
    type: object
    required: [ok, agent_id, results]
    properties:
      ok: { type: boolean }
      agent_id: { type: string }
      total: { type: integer, format: int32 }
      ok_count: { type: integer, format: int32 }
      error_count: { type: integer, format: int32 }
      results:
        type: array
        items:
          $ref: "#/components/schemas/BrokerOtaBulkResult"
  BrokerFanoutResult:
    type: object
    required: [deployment_id, status, data]
    properties:
      deployment_id: { type: string }
      status: { type: integer, format: int32 }
      data:
        type: object
        additionalProperties: true
  BrokerFanoutResponse:
    type: object
    required: [ok, agent_id, results]
    properties:
      ok: { type: boolean }
      agent_id: { type: string }
      total: { type: integer, format: int32 }
      ok_count: { type: integer, format: int32 }
      error_count: { type: integer, format: int32 }
      results:
        type: array
        items:
          $ref: "#/components/schemas/BrokerFanoutResult"
  AgentMember:
    type: object
    required: [user_sub, role, created_unix_ms]
    properties:
      user_sub: { type: string }
      role: { type: string }
      created_unix_ms: { type: integer, format: int64 }
  MembershipAuditRow:
    type: object
    required: [ts_unix_ms, actor_sub, target_sub, agent_id, action]
    properties:
      ts_unix_ms: { type: integer, format: int64 }
      actor_sub: { type: string }
      target_sub: { type: string }
      agent_id: { type: string }
      action: { type: string }
      role: { type: string }
      trace_id: { type: string }

  Team:
    type: object
    required: [team_id, display_name, created_unix_ms]
    properties:
      team_id: { type: string }
      display_name: { type: string }
      created_by: { type: string }
      created_unix_ms: { type: integer, format: int64 }
      tags:
        type: array
        items: { type: string }
      policy_ref: { type: string }
      shared_memory_scope_id: { type: string }
      meta:
        type: object
        additionalProperties: true

  TeamListResponse:
    type: object
    required: [ok, teams]
    properties:
      ok: { type: boolean }
      teams:
        type: array
        items:
          $ref: "#/components/schemas/Team"

  TeamCreateRequest:
    type: object
    required: [display_name]
    properties:
      display_name: { type: string }
      tags:
        type: array
        items: { type: string }
      policy_ref: { type: string }
      shared_memory_scope_id: { type: string }
      meta:
        type: object
        additionalProperties: true

  TeamCreateResponse:
    type: object
    required: [ok, team]
    properties:
      ok: { type: boolean }
      team:
        $ref: "#/components/schemas/Team"

  TeamGetResponse:
    type: object
    required: [ok, team]
    properties:
      ok: { type: boolean }
      team:
        $ref: "#/components/schemas/Team"

  TeamUpdateRequest:
    type: object
    properties:
      display_name: { type: string }
      tags:
        type: array
        items: { type: string }
      policy_ref: { type: string }
      shared_memory_scope_id: { type: string }
      meta:
        type: object
        additionalProperties: true

  TeamDeleteResponse:
    type: object
    required: [ok]
    properties:
      ok: { type: boolean }

  TeamMember:
    type: object
    required: [member_id, team_id, role, status, created_unix_ms]
    properties:
      member_id: { type: string }
      team_id: { type: string }
      deployment_id: { type: string }
      agent_id: { type: string }
      role: { type: string }
      capabilities:
        type: array
        items: { type: string }
      status: { type: string }
      weight: { type: integer, format: int32 }
      created_unix_ms: { type: integer, format: int64 }
      meta:
        type: object
        additionalProperties: true

  TeamMemberListResponse:
    type: object
    required: [ok, team_id, members]
    properties:
      ok: { type: boolean }
      team_id: { type: string }
      members:
        type: array
        items:
          $ref: "#/components/schemas/TeamMember"

  TeamMemberUpsertRequest:
    type: object
    required: [role]
    properties:
      member_id: { type: string }
      deployment_id: { type: string }
      agent_id: { type: string }
      role: { type: string }
      capabilities:
        type: array
        items: { type: string }
      status: { type: string }
      weight: { type: integer, format: int32 }
      meta:
        type: object
        additionalProperties: true

  TeamMemberUpdateRequest:
    type: object
    properties:
      role: { type: string }
      deployment_id: { type: string }
      agent_id: { type: string }
      capabilities:
        type: array
        items: { type: string }
      status: { type: string }
      weight: { type: integer, format: int32 }
      meta:
        type: object
        additionalProperties: true

  TeamMemberUpsertResponse:
    type: object
    required: [ok, member]
    properties:
      ok: { type: boolean }
      member:
        $ref: "#/components/schemas/TeamMember"

  TeamRunRuntimeMember:
    type: object
    required: [agent_id, role]
    properties:
      member_id: { type: string }
      agent_id: { type: string }
      deployment_id: { type: string }
      role: { type: string }
      capabilities:
        type: array
        items: { type: string }
      status: { type: string }
      weight: { type: integer, format: int32 }
      meta:
        type: object
        additionalProperties: true

  TeamRunMemberJob:
    type: object
    properties:
      member_id: { type: string }
      agent_id: { type: string }
      deployment_id: { type: string }
      job_id: { type: string }
      status: { type: string }
      ok: { type: boolean }
      error: { type: string }
      http_status: { type: integer, format: int32 }
      updated_unix_ms: { type: integer, format: int64 }
      dispatch_error: { type: string }

  TeamRunMemberJobSummary:
    type: object
    properties:
      total: { type: integer, format: int32 }
      queued: { type: integer, format: int32 }
      running: { type: integer, format: int32 }
      done: { type: integer, format: int32 }
      error: { type: integer, format: int32 }
      cancelled: { type: integer, format: int32 }
      interrupted: { type: integer, format: int32 }
      unknown: { type: integer, format: int32 }
      ok: { type: integer, format: int32 }
      failed: { type: integer, format: int32 }
      dispatch_errors: { type: integer, format: int32 }

  TeamRunCancelResult:
    type: object
    properties:
      member_id: { type: string }
      agent_id: { type: string }
      deployment_id: { type: string }
      job_id: { type: string }
      ok: { type: boolean }
      error: { type: string }
      http_status: { type: integer, format: int32 }

  TeamRunDispatchError:
    type: object
    properties:
      member_id: { type: string }
      agent_id: { type: string }
      error: { type: string }

  TeamQuorumRule:
    type: object
    required: [rule_id, team_id, action, min_approvals, quorum_mode]
    properties:
      rule_id: { type: string }
      team_id: { type: string }
      action: { type: string }
      tool_names:
        type: array
        items: { type: string }
      min_approvals: { type: integer, format: int32 }
      role_allowlist:
        type: array
        items: { type: string }
      require_distinct_roles: { type: boolean }
      timeout_ms: { type: integer, format: int64 }
      quorum_mode: { type: string }
      created_unix_ms: { type: integer, format: int64 }
      meta:
        type: object
        additionalProperties: true

  TeamQuorumRuleListResponse:
    type: object
    required: [ok, team_id, rules]
    properties:
      ok: { type: boolean }
      team_id: { type: string }
      rules:
        type: array
        items:
          $ref: "#/components/schemas/TeamQuorumRule"

  TeamQuorumRuleUpsertRequest:
    type: object
    required: [action, min_approvals, quorum_mode]
    properties:
      action: { type: string }
      tool_names:
        type: array
        items: { type: string }
      min_approvals: { type: integer, format: int32 }
      role_allowlist:
        type: array
        items: { type: string }
      require_distinct_roles: { type: boolean }
      timeout_ms: { type: integer, format: int64 }
      quorum_mode: { type: string }
      meta:
        type: object
        additionalProperties: true

  TeamQuorumRuleUpsertResponse:
    type: object
    required: [ok, rule]
    properties:
      ok: { type: boolean }
      rule:
        $ref: "#/components/schemas/TeamQuorumRule"

  TeamRunRequest:
    type: object
    required: [run]
    properties:
      run:
        type: object
        description: Run request payload forwarded to agentd (schema-compatible with /api/v1/run).
        additionalProperties: true
      team:
        type: object
        description: Team execution metadata (role filters, concurrency, quorum policy).
        properties:
          mode:
            type: string
            enum: [sync, async]
            description: Run mode (sync blocks; async dispatches run_async per member).
          role:
            type: string
            description: Single role filter for eligible team members.
          roles:
            type: array
            items: { type: string }
            description: Role allowlist for eligible team members.
          max_concurrency:
            type: integer
            format: int32
            description: Max concurrent member runs (1-16).
          timeout_ms:
            type: integer
            format: int64
            description: Per-member run timeout (100-300000).
          runtime_members:
            type: array
            description: Ephemeral per-run members (not persisted in team registry).
            items:
              $ref: "#/components/schemas/TeamRunRuntimeMember"
          quorum_policy:
            type: object
            properties:
              mode:
                type: string
                enum: [auto, off]
            description: Quorum enforcement mode for team_run rules (default auto).
          run_overrides_mode:
            type: string
            enum: [off, member_meta, explicit]
            description: Per-member run override mode (default off).
          role_overrides:
            type: object
            additionalProperties: true
            description: Map of role to run override objects (applied before member_overrides; allowlist enforced server-side).
          member_overrides:
            type: object
            additionalProperties: true
            description: Map of member_id to run override objects (allowlist enforced server-side).
          approvals:
            type: array
            description: Approvals for quorum-gated team runs (member IDs or objects).
            items:
              oneOf:
                - type: string
                - type: object
                  properties:
                    rule_id: { type: string }
                    member_id: { type: string }
                    decision: { type: string }
                    reason: { type: string }
        additionalProperties: true

  TeamRunResponse:
    type: object
    required: [ok, team_id, team_run_id, status]
    properties:
      ok: { type: boolean }
      team_id: { type: string }
      team_run_id: { type: string }
      status: { type: string }
      created_unix_ms: { type: integer, format: int64 }
      mode: { type: string }
      member_jobs:
        type: array
        items:
          $ref: "#/components/schemas/TeamRunMemberJob"
      dispatch_errors:
        type: array
        items:
          $ref: "#/components/schemas/TeamRunDispatchError"
      member_job_summary:
        $ref: "#/components/schemas/TeamRunMemberJobSummary"

  TeamRunSummary:
    type: object
    required: [team_id, team_run_id, status]
    properties:
      team_id: { type: string }
      team_run_id: { type: string }
      status: { type: string }
      created_by: { type: string }
      created_unix_ms: { type: integer, format: int64 }
      mode: { type: string }
      member_job_summary:
        $ref: "#/components/schemas/TeamRunMemberJobSummary"

  TeamRunListResponse:
    type: object
    required: [ok, team_id, runs]
    properties:
      ok: { type: boolean }
      team_id: { type: string }
      limit: { type: integer, format: int32 }
      offset: { type: integer, format: int32 }
      status: { type: string }
      runs:
        type: array
        items:
          $ref: "#/components/schemas/TeamRunSummary"

  TeamRunStatusResponse:
    type: object
    required: [ok, team_id, team_run_id, status]
    properties:
      ok: { type: boolean }
      team_id: { type: string }
      team_run_id: { type: string }
      status: { type: string }
      created_unix_ms: { type: integer, format: int64 }
      mode: { type: string }
      members:
        type: array
        items:
          $ref: "#/components/schemas/TeamMember"
      runtime_members:
        type: array
        description: Runtime members included in the team run (if provided).
        items:
          $ref: "#/components/schemas/TeamRunRuntimeMember"
      member_jobs:
        type: array
        items:
          $ref: "#/components/schemas/TeamRunMemberJob"
      dispatch_errors:
        type: array
        items:
          $ref: "#/components/schemas/TeamRunDispatchError"
      member_job_summary:
        $ref: "#/components/schemas/TeamRunMemberJobSummary"
      cancel_requested_unix_ms: { type: integer, format: int64 }
      cancel_results:
        type: array
        items:
          $ref: "#/components/schemas/TeamRunCancelResult"

  TeamRunRuntimeMembersUpdateRequest:
    type: object
    required: [runtime_members]
    properties:
      mode:
        type: string
        enum: [replace, merge]
        description: Replace current runtime members or merge new entries (default replace).
      runtime_members:
        type: array
        description: Updated runtime members for this team run.
        items:
          $ref: "#/components/schemas/TeamRunRuntimeMember"

  TeamRunApprovalInput:
    type: object
    required: [member_id]
    properties:
      rule_id: { type: string }
      member_id: { type: string }
      decision: { type: string }
      reason: { type: string }

  TeamRunApprovalCreateRequest:
    oneOf:
      - $ref: "#/components/schemas/TeamRunApprovalInput"
      - type: object
        properties:
          approvals:
            type: array
            items:
              $ref: "#/components/schemas/TeamRunApprovalInput"

  TeamRunApproval:
    type: object
    required: [approval_id, team_id, team_run_id, rule_id, member_id, role, decision, created_unix_ms]
    properties:
      approval_id: { type: string }
      team_id: { type: string }
      team_run_id: { type: string }
      rule_id: { type: string }
      member_id: { type: string }
      role: { type: string }
      decision: { type: string }
      reason: { type: string }
      created_by: { type: string }
      created_unix_ms: { type: integer, format: int64 }

  TeamRunApprovalListResponse:
    type: object
    required: [ok, team_id, team_run_id, approvals]
    properties:
      ok: { type: boolean }
      team_id: { type: string }
      team_run_id: { type: string }
      approvals:
        type: array
        items:
          $ref: "#/components/schemas/TeamRunApproval"

  OrchestrateRequest:
    type: object
    required: [tasks]
    properties:
      trace_id:
        type: string
        description: Optional correlation id propagated to task run bodies (if missing)
      max_concurrency: { type: integer, format: int32 }
      timeout_ms: { type: integer, format: int32 }
      allow_sessions: { type: boolean }
      defaults:
        type: object
        description: Default run request keys applied to tasks (missing keys only)
        additionalProperties: true
      tasks:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/OrchestrateTask"

  OrchestrateTask:
    type: object
    required: [agent_id]
    description: |
      A single task forwarded to an agent (default path is `/api/v1/run`).

      Tasks may either include:
      - `request`: the forwarded agentd request object, or
      - shorthand keys at the top-level (e.g. `prompt`, `tools`, etc.)
    properties:
      task_id: { type: string }
      agent_id: { type: string }
      deployment_id: { type: string }
      method: { type: string }
      path: { type: string }
      query: { type: string }
      headers:
        type: object
        additionalProperties: { type: string }
      request:
        type: object
        additionalProperties: true
    additionalProperties: true

  OrchestrateTaskResult:
    type: object
    required: [task_id, agent_id, ok, ms]
    properties:
      task_id: { type: string }
      agent_id: { type: string }
      deployment_id: { type: string }
      ok: { type: boolean }
      ms: { type: integer, format: int32 }
      http_status: { type: integer, format: int32 }
      error: { type: string }
      result:
        type: object
        additionalProperties: true
