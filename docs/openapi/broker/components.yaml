parameters:
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: false
    schema: { type: string }
    description: |
      Optional idempotency key for safe retries. Allowed characters: [A-Za-z0-9-_.:@], max length 128.
      Alias header: X-Idempotency-Key.
schemas:
  BrokerCapsResponse:
    type: object
    required: [ok, service, version, api_version]
    properties:
      ok: { type: boolean }
      service: { type: string }
      version: { type: string }
      api_version: { type: string }
      now_unix_ms: { type: integer, format: int64 }
      uptime_ms: { type: integer, format: int64 }
      features:
        type: object
        additionalProperties: true
      limits:
        type: object
        additionalProperties: true

  AgentInfo:
    type: object
    required: [agent_id, owner_sub, enabled, created_unix_ms, connected]
    properties:
      agent_id: { type: string }
      owner_sub: { type: string }
      enabled: { type: boolean }
      created_unix_ms: { type: integer, format: int64 }
      connected: { type: boolean }
      connected_unix_ms: { type: integer, format: int64 }
      last_seen_unix_ms: { type: integer, format: int64 }
      remote_addr: { type: string }
      labels:
        type: object
        additionalProperties: true
      meta:
        type: object
        additionalProperties: true
      deployments:
        type: array
        items:
          $ref: "#/components/schemas/DeploymentInfo"
  DeploymentInfo:
    type: object
    required: [deployment_id, connected]
    properties:
      deployment_id: { type: string }
      connected: { type: boolean }
      connected_unix_ms: { type: integer, format: int64 }
      last_seen_unix_ms: { type: integer, format: int64 }
      remote_addr: { type: string }
      meta:
        type: object
        additionalProperties: true
  AgentDeploymentsResponse:
    type: object
    required: [ok, agent_id, deployments]
    properties:
      ok: { type: boolean }
      agent_id: { type: string }
      default_deployment_id: { type: string }
      deployments:
        type: array
        items:
          $ref: "#/components/schemas/DeploymentInfo"
  BrokerOtaUpdateRequest:
    type: object
    required: [url]
    properties:
      url: { type: string }
      sha256: { type: string }
      version: { type: string }
      reason: { type: string }
      trace_id: { type: string }
      drain_timeout_ms: { type: integer, format: int64 }
      deployment_ids:
        type: array
        items: { type: string }
      deployment_id: { type: string }
      deployments:
        type: array
        items: { type: string }
    additionalProperties: true
  BrokerOtaBulkResult:
    type: object
    required: [deployment_id, status, data]
    properties:
      deployment_id: { type: string }
      status: { type: integer, format: int32 }
      data:
        type: object
        additionalProperties: true
  BrokerOtaBulkResponse:
    type: object
    required: [ok, agent_id, results]
    properties:
      ok: { type: boolean }
      agent_id: { type: string }
      total: { type: integer, format: int32 }
      ok_count: { type: integer, format: int32 }
      error_count: { type: integer, format: int32 }
      results:
        type: array
        items:
          $ref: "#/components/schemas/BrokerOtaBulkResult"
  BrokerFanoutResult:
    type: object
    required: [deployment_id, status, data]
    properties:
      deployment_id: { type: string }
      status: { type: integer, format: int32 }
      data:
        type: object
        additionalProperties: true
  BrokerFanoutResponse:
    type: object
    required: [ok, agent_id, results]
    properties:
      ok: { type: boolean }
      agent_id: { type: string }
      total: { type: integer, format: int32 }
      ok_count: { type: integer, format: int32 }
      error_count: { type: integer, format: int32 }
      results:
        type: array
        items:
          $ref: "#/components/schemas/BrokerFanoutResult"
  AgentMember:
    type: object
    required: [user_sub, role, created_unix_ms]
    properties:
      user_sub: { type: string }
      role: { type: string }
      created_unix_ms: { type: integer, format: int64 }
  MembershipAuditRow:
    type: object
    required: [ts_unix_ms, actor_sub, target_sub, agent_id, action]
    properties:
      ts_unix_ms: { type: integer, format: int64 }
      actor_sub: { type: string }
      target_sub: { type: string }
      agent_id: { type: string }
      action: { type: string }
      role: { type: string }
      trace_id: { type: string }

  OrchestrateRequest:
    type: object
    required: [tasks]
    properties:
      trace_id:
        type: string
        description: Optional correlation id propagated to task run bodies (if missing)
      max_concurrency: { type: integer, format: int32 }
      timeout_ms: { type: integer, format: int32 }
      allow_sessions: { type: boolean }
      defaults:
        type: object
        description: Default run request keys applied to tasks (missing keys only)
        additionalProperties: true
      tasks:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/OrchestrateTask"

  OrchestrateTask:
    type: object
    required: [agent_id]
    description: |
      A single task forwarded to an agent (default path is `/api/v1/run`).

      Tasks may either include:
      - `request`: the forwarded agentd request object, or
      - shorthand keys at the top-level (e.g. `prompt`, `tools`, etc.)
    properties:
      task_id: { type: string }
      agent_id: { type: string }
      deployment_id: { type: string }
      method: { type: string }
      path: { type: string }
      query: { type: string }
      headers:
        type: object
        additionalProperties: { type: string }
      request:
        type: object
        additionalProperties: true
    additionalProperties: true

  OrchestrateTaskResult:
    type: object
    required: [task_id, agent_id, ok, ms]
    properties:
      task_id: { type: string }
      agent_id: { type: string }
      deployment_id: { type: string }
      ok: { type: boolean }
      ms: { type: integer, format: int32 }
      http_status: { type: integer, format: int32 }
      error: { type: string }
      result:
        type: object
        additionalProperties: true
