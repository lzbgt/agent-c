      count: { type: integer, format: int32 }
      events:
        type: array
        items:
          $ref: "#/components/schemas/BrokerEvent"

  OrchestratorRun:
    type: object
    required: [orchestrator_run_id, team_id, status]
    properties:
      orchestrator_run_id: { type: string }
      team_id: { type: string }
      status: { type: string }
      goal: { type: string }
      created_by: { type: string }
      created_unix_ms: { type: integer, format: int64 }
      updated_unix_ms: { type: integer, format: int64 }
      last_heartbeat_unix_ms: { type: integer, format: int64 }
      heartbeat_age_ms: { type: integer, format: int64 }
      lease_timeout_ms: { type: integer, format: int64 }
      lease_status: { type: string, enum: [ok, stale, missing, unknown] }
      goal_contract:
        $ref: "#/components/schemas/TeamRunGoalContract"
      role_plan_snapshot:
        type: object
        additionalProperties: true
      meta:
        type: object
        additionalProperties: true
        description: >
          Free-form orchestrator metadata. Revision fields may include
          goal_version, goal_versions, goal_updated_unix_ms, role_plan_version,
          role_plan_versions, role_plan_updated_unix_ms. Entries inside
          goal_versions/role_plan_versions may include goal_changed,
          goal_contract_changed, goal_contract_diff, or role_plan_diff
          (added/removed/changed key lists). Change flags are only set when true.
          Diff key lists are top-level only; nested changes appear under the parent key.
          Revision histories are bounded to 50 entries each.

  OrchestratorRunCreateRequest:
    type: object
    properties:
      orchestrator_run_id: { type: string }
      goal: { type: string }
      status: { type: string }
      goal_contract:
        $ref: "#/components/schemas/TeamRunGoalContract"
      role_plan_snapshot:
        type: object
        additionalProperties: true
      meta:
        type: object
        additionalProperties: true

