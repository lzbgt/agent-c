/healthz:
  get:
    tags: [health]
    summary: Health check
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean }

/readyz:
  get:
    tags: [health]
    summary: Readiness check
    responses:
      "200":
        description: Ready
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean }
                ts_unix_ms: { type: integer, format: int64 }
                client_auth:
                  type: object
                  additionalProperties: true
      "503":
        description: Not ready
        content:
          application/json:
            schema:
              type: object
              required: [ok, error]
              properties:
                ok: { type: boolean }
                error: { type: string }
                ts_unix_ms: { type: integer, format: int64 }
                client_auth:
                  type: object
                  additionalProperties: true

/metrics:
  get:
    tags: [health]
    summary: Prometheus metrics
    responses:
      "200":
        description: OK
        content:
          text/plain; version=0.0.4:
            schema:
              type: string

/v1/caps:
  get:
    tags: [caps]
    summary: Capability descriptor (features + limits)
    responses:
      "200":
        description: Capability snapshot
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrokerCapsResponse"

/v1/client_prefs:
  get:
    tags: [client_prefs]
    summary: Get client prefs (WebUI profiles)
    parameters:
      - in: query
        name: client_id
        required: true
        schema: { type: string }
      - in: query
        name: client_kind
        required: false
        schema: { type: string, default: webui }
    responses:
      "200":
        description: Client prefs
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientPrefsResponse"
  post:
    tags: [client_prefs]
    summary: Store client prefs (WebUI profiles)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientPrefsUpdateRequest"
    responses:
      "200":
        description: Stored client prefs
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientPrefsResponse"

/v1/connectors:
