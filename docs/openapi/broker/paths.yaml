/v1/trace:
  get:
    tags: [events]
    summary: Correlated trace lookup (broker + agent fanout)
    description: |
      Returns broker relay audit rows for a `trace_id` and (best-effort) fans out to referenced agents
      to query their `/api/v1/trace` endpoint for persisted audit records.
    parameters:
      - in: query
        name: trace_id
        required: true
        schema: { type: string }
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
      - in: query
        name: fanout
        required: false
        schema: { type: boolean }
    responses:
      "200":
        description: Trace response
        content:
          application/json:
            schema:
              type: object
              required: [ok, trace_id]
              properties:
                ok: { type: boolean }
                trace_id: { type: string }
                orchestrate:
                  type: array
                  description: Persisted orchestrate audit rows (request/response JSON), keyed by trace_id
                  items:
                    type: object
                    required: [ts_unix_ms, trace_id, request_json, response_json]
                    properties:
                      ts_unix_ms: { type: integer, format: int64 }
                      trace_id: { type: string }
                      request_json:
                        type: object
                        additionalProperties: true
                      response_json:
                        type: object
                        additionalProperties: true
                relay_audit:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                membership:
                  type: array
                  items:
                    $ref: "#/components/schemas/MembershipAuditRow"
                agentd:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
