/healthz:
  get:
    tags: [health]
    summary: Health check
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean }

/readyz:
  get:
    tags: [health]
    summary: Readiness check
    responses:
      "200":
        description: Ready
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean }
                ts_unix_ms: { type: integer, format: int64 }
                client_auth:
                  type: object
                  additionalProperties: true
      "503":
        description: Not ready
        content:
          application/json:
            schema:
              type: object
              required: [ok, error]
              properties:
                ok: { type: boolean }
                error: { type: string }
                ts_unix_ms: { type: integer, format: int64 }
                client_auth:
                  type: object
                  additionalProperties: true

/metrics:
  get:
    tags: [health]
    summary: Prometheus metrics
    responses:
      "200":
        description: OK
        content:
          text/plain; version=0.0.4:
            schema:
              type: string

