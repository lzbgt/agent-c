        required: false
        schema: { type: string }
      - in: query
        name: deployment_ids
        required: false
        schema: { type: string }
        description: Comma-delimited deployment ids (omit to target all connected deployments).
    responses:
      "200":
        description: Fan-out recap list
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrokerFanoutResponse"
  post:
