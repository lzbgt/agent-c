    summary: Add or update agent member (owner/admin)
    parameters:
      - in: path
        name: agent_id
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              user_sub: { type: string }
              role: { type: string, enum: [user, admin, owner] }
            required: [user_sub]
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean }
