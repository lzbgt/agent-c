          $ref: "#/components/schemas/MemoryRecapItem"
      daily_items:
        type: array
        items:
          $ref: "#/components/schemas/MemoryRecapItem"
      prompt: { type: string }
      prompt_truncated: { type: boolean }
      summary_text: { type: string }
      summary:
        type: object
        additionalProperties: true
      recap_path: { type: string }
      recap_bytes: { type: integer, format: int64 }

  MemoryCorrelateResponse:
    type: object
