          type: object
          required: [key, record]
          properties:
            key: { type: string }
            record:
              type: object
              additionalProperties: true
      timeline:
        type: array
        items:
          type: object
          required: [checkpoint, entries]
          properties:
            checkpoint:
              $ref: "#/components/schemas/MemoryCheckpointMeta"
            entries:
              type: array
              items:
                type: object
                required: [key, record]
                properties:
                  key: { type: string }
                  record:
                    type: object
                    additionalProperties: true

  MemoryQueryResponse:
    type: object
    required: [ok, memory_root, since_utc_ms, until_utc_ms, limit, returned, checkpoint, entries]
    properties:
      ok: { type: boolean }
      memory_root: { type: string }
      since_utc_ms: { type: integer, format: int64 }
      until_utc_ms: { type: integer, format: int64 }
      structured_path_filter:
        type: string
        description: Echoes the requested `structured_path` filter when provided.
      key_prefix:
        type: string
        description: Echoes the requested `key_prefix` filter when provided.
      limit:
        type: integer
        format: int32
        description: Max entries requested (after clamping).
      returned:
        type: integer
        format: int32
        description: Number of entries returned.
      checkpoint:
        $ref: "#/components/schemas/MemoryCheckpointMeta"
      entries:
        type: array
        items:
          type: object
          required: [key, record]
          properties:
            key: { type: string }
            record:
              type: object
              additionalProperties: true

  EdgeMessageEnvelope:
    type: object
    required: [msg_id, ts_utc_ms, type, from, to, body]
    properties:
      msg_id: { type: string }
      ts_utc_ms: { type: integer, format: int64 }
      type: { type: string }
      from: { type: string }
      to:
        description: Destination address or null
        type: string
        nullable: true
      body:
        type: object
        additionalProperties: true
      auth:
        type: object
        additionalProperties: true
      trace:
        type: object
        additionalProperties: true

  EdgeOutboxResponse:
    type: object
    required: [ok, node_id, cursor_base, cursor_next, messages]
    properties:
      ok: { type: boolean }
      node_id: { type: string }
      cursor_base: { type: integer, format: int64 }
      cursor_next: { type: integer, format: int64 }
      messages:
        type: array
        items:
          type: object
          required: [outbox_id, ts_utc_ms]
          properties:
            outbox_id: { type: integer, format: int64 }
            ts_utc_ms: { type: integer, format: int64 }
            msg:
              $ref: "#/components/schemas/EdgeMessageEnvelope"
            msg_raw: { type: string }
            parse_error: { type: string }

  EdgeTaskAssignRequest:
    type: object
    required: [task_id, step_id, idempotency_key, mode, deadline_utc_ms, payload]
    properties:
      trace:
        type: object
        description: Optional trace correlation object (best-effort). Recommended field: trace_id.
        additionalProperties: true
      node_id:
        type: string
        description: Explicit target node_id (preferred when known)
        maxLength: 128
        pattern: "^[A-Za-z0-9_.:-]+$"
      match_any:
        type: object
        description: |
          Capability-based node selection.

          Common keys (best-effort):
          - `requires_tools` (array of tool names)
          - `tags_all`, `tags_any`, `tags_none` (arrays of tag strings)
          - `exclude_node_ids` (array of node_id strings to exclude; useful for distinct-node fan-out)
        additionalProperties: true
      allow_hazards:
        type: array
        description: Explicitly allowed hazard tags (unsafe; use sparingly)
        items: { type: string }
      allow_high_side_effect:
        type: boolean
        description: Allow dispatch when tool side_effect_level is high
      task_id:
        type: string
        description: Task identifier (id-safe token)
        maxLength: 128
        pattern: "^[A-Za-z0-9_.:-]+$"
      step_id:
        type: string
        description: Step identifier within the task/workflow (id-safe token)
        maxLength: 128
        pattern: "^[A-Za-z0-9_.:-]+$"
      idempotency_key:
        type: string
        description: Idempotency token used for platform-side dedupe (id-safe token)
        maxLength: 128
        pattern: "^[A-Za-z0-9_.:-]+$"
      mode:
        type: string
        enum: [invoke, agent]
      deadline_utc_ms: { type: integer, format: int64 }
      attempt:
        type: integer
        format: int32
        description: Optional attempt number (for workflow orchestration/debug; default 0)
      payload:
        type: object
        description: |
          Task payload.

          - mode=invoke: requires payload.tool (string) and payload.args (object). When the target node has a stored
            manifest, payload.args is validated (best-effort) against the tool schema in the node manifest:
            manifest.tools[].parameters_schema (preferred) or manifest.tools[].parameters (fallback).
            If the schema specifies additionalProperties:false, unknown keys are rejected.
          - mode=agent: payload is forwarded to the node/embedded agent_core; platform does not interpret it.
        additionalProperties: true

  EdgeRuleUpsertRequest:
    type: object
    required: [event_type, action]
    properties:
      rule_id:
        type: string
        description: Optional; if omitted, server generates one
      enabled: { type: boolean }
      event_type: { type: string }
      min_confidence: { type: number, format: double }
      cooldown_ms: { type: integer, format: int32 }
      action:
        type: object
        description: |
          Rule action.

          Supported `type` values:
          - `task_assign`: enqueue a UM‑BMP `TASK_ASSIGN` (like `POST /api/v1/edge/task/assign`)
          - `durable_workflow_submit`: submit a durable workflow to the platform workflow engine

          Note: OpenAPI cannot fully express the conditional shape; see server behavior.
        additionalProperties: true

  EdgeWorkflowSubmitRequest:
    type: object
    required: [steps]
    properties:
      workflow_id:
        type: string
        description: Optional; if omitted, server generates one
      goal: { type: string }
      priority: { type: integer, format: int32 }
      steps:
        type: array
        items:
          type: object
          required: [step_id, kind]
          properties:
            step_id: { type: string }
            kind: { type: string, enum: [invoke_tool, run_agent, join] }
            depends_on:
              type: array
              items: { type: string }
            target:
              type: object
              additionalProperties: true
            payload:
              type: object
              additionalProperties: true
            join_mode: { type: string, enum: [all, any] }
            deadline_utc_ms: { type: integer, format: int64 }
            max_attempts: { type: integer, format: int32 }
            backoff_ms: { type: integer, format: int32 }

  ToolDef:
    type: object
    required: [name, description, parameters]
    properties:
      name: { type: string }
      description: { type: string }
      parameters:
        type: object
        description: JSON Schema-like parameters

  RunRequest:
    type: object
    required: [prompt]
    properties:
      prompt: { type: string }
      trace_id: { $ref: "#/components/schemas/TraceID" }
      session_id: { type: string }
      no_session: { type: boolean }
      inputs:
        type: object
        description: Optional workflow/task-local input variables (expanded in durable workflow tasks).
        additionalProperties: true
      priority:
        type: integer
        format: int32
        description: Higher runs sooner (scheduler hint). Default 0. Clamped to [-1000, 1000].
      tools:
        type: string
        description: Tool mode
        enum: [none, basic, host]
      memory_context_mode:
        type: string
        enum: [files, search, index, salience]
        description: Memory context injection mode (files=load durable Markdown files; search=ranked memory snippets; index=progressive file index; salience=ranked recency/importance).
      memory_include_structured:
        type: boolean
        description: When true, include memory/STRUCTURED.md in file-based memory context.
      memory_include_core:
        type: boolean
        description: When true, include memory/MEMORY.md in file-based memory context.
      memory_include_daily:
        type: boolean
        description: When true, include memory/YYYY-MM-DD.md in file-based memory context.
      memory_include_session:
        type: boolean
        description: When true, include memory/sessions/<session_id>.md in file-based memory context.
      memory_daily_days:
        type: integer
        format: int32
        description: Number of daily memory files to include/scan (clamped).
      memory_total_cap:
        type: integer
        format: int64
        description: Max bytes for injected memory context (clamped).
      memory_search_query:
        type: string
        description: Explicit query for search-based memory context (defaults to prompt when omitted).
      memory_search_use_index:
        type: boolean
        description: When true, prefer SQLite FTS index for memory search (default true).
      memory_search_case_sensitive:
        type: boolean
        description: When true, use case-sensitive substring search (disables FTS).
      memory_search_order:
        type: string
        description: Result ordering for memory search context (ranked | newest | oldest; default ranked).
        enum: [ranked, newest, oldest]
      memory_search_fallback_to_files:
        type: boolean
        description: When true, fall back to file-based memory context if search yields no results.
      memory_search_max_results:
        type: integer
        format: int32
        description: Max memory search results injected (clamped).
      memory_search_max_snippet_chars:
        type: integer
        format: int32
        description: Max characters per memory snippet (clamped).
      memory_search_context_lines:
        type: integer
        format: int32
        description: Context lines to include around substring matches (clamped).
      memory_salience_max_items:
        type: integer
        format: int32
        description: Max total salience items (default from daemon config; clamped).
      memory_salience_structured_max_items:
        type: integer
        format: int32
        description: Max structured salience items (default from daemon config; clamped).
      memory_salience_daily_max_items:
        type: integer
        format: int32
        description: Max daily salience items (default from daemon config; clamped).
      memory_salience_half_life_days:
        type: number
        format: double
        description: Salience decay half-life in days (default from daemon config).
      memory_salience_importance_weight:
        type: number
        format: double
        description: Weight for @obs importance in salience (default from daemon config).
      model: { type: string }
      base_url: { type: string }
      api_key: { type: string }
      max_steps: { type: integer, format: int64 }
      max_tool_calls_total:
        type: integer
        format: int64
        minimum: 0
        description: Total tool calls allowed in the tool loop (0 disables/unlimited).
      max_tool_calls_per_tool:
        type: integer
        format: int64
        minimum: 0
        description: Per-tool call limit in the tool loop (0 disables/unlimited).
      max_tool_call_args_chars:
        type: integer
        format: int64
        minimum: 0
        description: Max length of a single tool call arguments JSON (0 disables/unlimited).
      max_tool_result_chars:
        type: integer
        format: int64
        minimum: 0
        description: Max tool result chars before re-inserting into the prompt (0 disables/unlimited).
      verbose: { type: boolean }

  AgentEvent:
    type: object
    required: [type, data]
    properties:
      type: { type: string }
      trace_id: { $ref: "#/components/schemas/TraceID" }
      data_truncated:
        type: boolean
        description: True when the event payload was truncated to keep memory bounded.
      data_bytes:
        type: integer
        format: int64
        description: Original payload byte size before truncation (when data_truncated=true).
      data_bytes_kept:
        type: integer
        format: int64
        description: Bytes retained in the stored payload (when data_truncated=true).
      data:
        description: |
          Event payload. When the payload is too large or cannot be parsed, it is stored as a string.
          If `data_truncated=true`, the string is a truncated prefix of the original payload.
        oneOf:
          - type: object
            additionalProperties: true
          - type: string

  RunResponse:
    type: object
    required: [ok, trace_id, assistant_text, events]
    properties:
      ok: { type: boolean }
      trace_id: { $ref: "#/components/schemas/TraceID" }
      assistant_text: { type: string }
      error: { type: string }
      elapsed_ms:
        type: integer
        format: int64
        minimum: 0
        description: Wall-clock duration of the run endpoint (best-effort).
      effective_model:
        type: string
        description: Effective model used by the daemon (non-secret; useful for audit/quorum correlation).
      effective_base_url:
        type: string
        description: Effective provider base_url used by the daemon (non-secret; useful for audit/quorum correlation).
      effective_max_steps:
        type: integer
        format: int64
        minimum: 0
        description: Effective max_steps enforced by the daemon.
      effective_max_tool_calls_total:
        type: integer
        format: int64
        minimum: 0
        description: Effective max_tool_calls_total enforced by the daemon.
      effective_max_tool_calls_per_tool:
        type: integer
        format: int64
        minimum: 0
        description: Effective max_tool_calls_per_tool enforced by the daemon.
      effective_max_tool_call_args_chars:
        type: integer
        format: int64
        minimum: 0
        description: Effective max_tool_call_args_chars enforced by the daemon.
      effective_max_tool_result_chars:
        type: integer
        format: int64
        minimum: 0
        description: Effective max_tool_result_chars enforced by the daemon.
      steps_executed:
        type: integer
        format: int64
        minimum: 0
        description: Tool-loop steps executed (0 for non-tool-loop runs).
      tool_calls_total:
        type: integer
        format: int64
        minimum: 0
        description: Total tool calls executed by the tool loop (0 for non-tool-loop runs).
      tool_calls_by_tool:
        type: object
        description: Best-effort map of tool_name => tool call count.
        additionalProperties:
          type: integer
          format: int64
          minimum: 0
      events:
        type: array
        items:
          $ref: "#/components/schemas/AgentEvent"

  RunReplayBundle:
    type: object
    required: [schema, request, response, tool_records]
    properties:
      schema: { type: string }
      request:
        type: object
        description: Redacted request JSON (best-effort).
        additionalProperties: true
      response:
        type: object
        description: Redacted response JSON (best-effort).
        additionalProperties: true
      tool_records:
        type: array
        items:
          type: object
          additionalProperties: true

  RunReplayResponse:
    type: object
    required: [ok, run_id, bundle]
    properties:
