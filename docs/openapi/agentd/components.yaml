    type: object
    description: |
      Memory timeline configuration for `kind:memory_timeline`.

      This maps to the host tool `memory_timeline` (see `cli/src/toolset_host_memory.cpp`).

      Provide either `citation` (`path:line`) or explicit `path` + `line`.
    properties:
      citation:
        type: string
        description: Citation string in the form `path:line` (preferred when derived from memory_search).
      path:
        type: string
        description: Relative memory Markdown path under the daemon memory directory.
      line:
        type: integer
        format: int32
        description: 1-based line number within the referenced memory file.
      context_lines:
        type: integer
        format: int32
        description: Context lines to include around the cited line (default 3; clamped 0-50).
      max_chars:
        type: integer
        format: int32
        description: Max characters returned in `text` (default 2000; clamped 200-10000).

  WorkflowMemoryStructuredQuerySpec:
    type: object
    description: |
      Structured memory query configuration for `kind:memory_structured_query`.

      This maps to the host tool `memory_structured_query` (see `cli/src/toolset_host_memory.cpp`).

      Note: the server requires at least one filter (`key`, `key_prefix`, non-empty `kinds[]`, or `source_contains`) to avoid accidental full dumps.
    properties:
      path:
        type: string
        description: Relative memory Markdown path under the daemon memory directory (default `STRUCTURED.md`).
      key:
        type: string
        description: Exact record key to fetch (optional).
      key_prefix:
        type: string
        description: Prefix filter for record keys (optional).
      key_case_insensitive:
        type: boolean
        description: If true, key/prefix matching is case-insensitive (default false).
      source_contains:
        type: string
        description: Optional substring filter applied to record `sources[]` (e.g. trace/workflow/session correlation).
      source_case_insensitive:
        type: boolean
        description: If true, source_contains matching is case-insensitive (default false).
      updated_since_utc:
        type: string
        description: Optional lower bound on record updated_utc (ISO UTC like 2026-02-05T00:00:00Z).
      updated_until_utc:
        type: string
        description: Optional upper bound on record updated_utc (ISO UTC like 2026-02-05T23:59:59Z).
      order_by:
        type: string
        description: Sort order: key_asc (default) or updated_desc.
      kinds:
        type: array
        description: Optional kinds filter (e.g. `["fact"]`, `["preference"]`, `["task"]`).
        items: { type: string }
      status:
        type: string
        description: Status filter (default `active`). Use `any` to include deprecated.
      include_sources:
        type: boolean
        description: Include `sources[]` in returned records (default true).
      include_versions:
        type: boolean
        description: Include `versions[]` history in returned records (default false).
      limit:
        type: integer
        format: int32
        description: Max records to return (default 50; max 200).

  WorkflowMemoryCorrelateSpec:
    type: object
    description: |
      Deterministic memory correlation configuration for `kind:memory_correlate`.

      The engine scans rolling structured checkpoints under `memory/checkpoints/structured_*.json` and returns
      entries whose `record.sources[]` contains a substring `trace:<trace_id>`.
    properties:
      trace_id:
        type: string
        description: If omitted, the engine uses the workflow trace_id.
      since_utc_ms:
        type: integer
        format: int64
        description: Lower bound on checkpoint timestamp in UTC milliseconds (inclusive; default 0).
      until_utc_ms:
        type: integer
        format: int64
        description: Upper bound on checkpoint timestamp in UTC milliseconds (inclusive; default max int64).
      max_entries:
        type: integer
        format: int32
        description: Max entries to return per checkpoint (default 50; clamped 1..500).
      timeline:
        type: boolean
        description: If true, returns multiple checkpoints (up to 50) instead of only the newest in-window checkpoint.

  WorkflowMemoryQuerySpec:
    type: object
    description: |
      Deterministic structured memory query configuration for `kind:memory_query`.

      The engine reads the newest structured checkpoint under `memory/checkpoints/structured_*.json`
      in a bounded time window and returns keys filtered by optional `key_prefix`.
    properties:
      since_utc_ms:
        type: integer
        format: int64
        description: Lower bound on checkpoint timestamp in UTC milliseconds (inclusive; default 0).
      until_utc_ms:
        type: integer
        format: int64
        description: Upper bound on checkpoint timestamp in UTC milliseconds (inclusive; default max int64).
      structured_path:
        type: string
        description: Optional structured file path filter (e.g. `STRUCTURED.md`).
      key_prefix:
        type: string
        description: Optional prefix filter (e.g. `wf.`).
      limit:
        type: integer
        format: int32
        description: Max entries to return (default 50; clamped 1..1000).

