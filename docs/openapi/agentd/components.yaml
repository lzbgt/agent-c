schemas:
  TraceID:
    type: string
    description: Correlation identifier (client-provided or server-generated)
    maxLength: 128
    pattern: "^[A-Za-z0-9_.:@-]{1,128}$"

  ErrorResponse:
    type: object
    required: [ok, error]
    properties:
      ok: { type: boolean, enum: [false] }
      error: { type: string }

  CapsResponse:
    type: object
    required: [ok, service, version, api_version]
    properties:
      ok: { type: boolean }
      service: { type: string }
      version: { type: string }
      api_version: { type: string }
      now_unix_ms: { type: integer, format: int64 }
      uptime_ms: { type: integer, format: int64 }
      features:
        type: object
        additionalProperties: true
      limits:
        type: object
        additionalProperties: true

  DiagnosticsResponse:
    type: object
    required: [ok, service, version, now_unix_ms, uptime_ms, ready]
    properties:
      ok: { type: boolean }
      service: { type: string }
      version: { type: string }
      now_unix_ms: { type: integer, format: int64 }
      uptime_ms: { type: integer, format: int64 }
      ready: { type: boolean }
      checks:
        type: object
        additionalProperties: true
      db:
        type: object
        additionalProperties: true
      jobs:
        type: object
        additionalProperties: true
      workflows:
        type: object
        additionalProperties: true
      warnings:
        type: array
        items: { type: string }

  DiagnosticsProvidersResponse:
    type: object
    required: [ok, service, version, now_unix_ms, uptime_ms, providers]
    properties:
      ok: { type: boolean }
      service: { type: string }
      version: { type: string }
      now_unix_ms: { type: integer, format: int64 }
      uptime_ms: { type: integer, format: int64 }
      providers:
        type: object
        additionalProperties: true

  DiagnosticsProviderTestRequest:
    type: object
    required: [provider]
    properties:
      provider: { type: string }
      base_url: { type: string }
      model: { type: string }
      prompt: { type: string }
      expect: { type: string }
      tools:
        type: string
        enum: [none, basic, host]
      require_tool_call: { type: boolean }
      timeout_ms: { type: integer, format: int64 }
      max_steps: { type: integer, format: int64 }
      max_tool_calls_total: { type: integer, format: int64 }
      max_tool_calls_per_tool: { type: integer, format: int64 }
      max_tool_call_args_chars: { type: integer, format: int64 }
      max_tool_result_chars: { type: integer, format: int64 }
      max_repeated_tool_calls: { type: integer, format: int64 }
      include_run: { type: boolean }

  DiagnosticsProviderTestResponse:
    type: object
    required: [ok, provider, base_url, model, duration_ms]
    properties:
      ok: { type: boolean }
      provider: { type: string }
      base_url: { type: string }
      model: { type: string }
      duration_ms: { type: integer, format: int64 }
      expect: { type: string }
      assistant_text: { type: string }
      error: { type: string }
      http_status: { type: integer, format: int64 }
      run:
        type: object
        additionalProperties: true

  BlobStoreConfig:
    type: object
    additionalProperties: false
    properties:
      mode: { type: string, enum: [local, object] }
      endpoint: { type: string, nullable: true }
      region: { type: string }
      bucket: { type: string, nullable: true }
      prefix: { type: string }
      path_style: { type: boolean }
      read_mode: { type: string, enum: [redirect, proxy] }
      cache_mode: { type: string, enum: [read-through, none] }
      cache_max_bytes: { type: integer, format: int64 }
      presign_ttl_sec: { type: integer, format: int64 }
      timeout_ms: { type: integer, format: int64 }
      access_key_set: { type: boolean }
      secret_key_set: { type: boolean }
      session_token_set: { type: boolean }

  BlobStoreUpdate:
    type: object
    additionalProperties: false
    properties:
      mode: { type: string, enum: [local, object] }
      endpoint: { type: string, nullable: true }
      region: { type: string }
      bucket: { type: string, nullable: true }
      prefix: { type: string }
      path_style: { type: boolean }
      read_mode: { type: string, enum: [redirect, proxy] }
      cache_mode: { type: string, enum: [read-through, none] }
      cache_max_bytes: { type: integer, format: int64 }
      presign_ttl_sec: { type: integer, format: int64 }
      timeout_ms: { type: integer, format: int64 }

  BlobStoreSecretsUpdate:
    type: object
    additionalProperties: false
    properties:
      access_key: { type: string, nullable: true }
      secret_key: { type: string, nullable: true }
      session_token: { type: string, nullable: true }

  BlobTierConfig:
    type: object
    additionalProperties: false
    properties:
      local_max_bytes: { type: integer, format: int64 }
      local_max_age_ms: { type: integer, format: int64 }
      promote_after_ms: { type: integer, format: int64 }
      promote_max_bytes: { type: integer, format: int64 }

  BlobTierEnforceRequest:
    type: object
    additionalProperties: false
    properties:
      dry_run: { type: boolean }
      local_max_bytes: { type: integer, format: int64 }
      local_max_age_ms: { type: integer, format: int64 }
      promote_after_ms: { type: integer, format: int64 }
      promote_max_bytes: { type: integer, format: int64 }
      max_rows: { type: integer, format: int64 }

  BlobTierEnforceResponse:
    type: object
    required: [ok, generated_utc_ms, promoted_count, promoted_bytes, evicted_count, evicted_bytes, total_local_bytes_before, total_local_bytes_after]
    properties:
      ok: { type: boolean }
      generated_utc_ms: { type: integer, format: int64 }
      dry_run: { type: boolean }
      local_max_bytes: { type: integer, format: int64 }
      local_max_age_ms: { type: integer, format: int64 }
      promote_after_ms: { type: integer, format: int64 }
      promote_max_bytes: { type: integer, format: int64 }
      promoted_count: { type: integer, format: int64 }
      promoted_bytes: { type: integer, format: int64 }
      evicted_count: { type: integer, format: int64 }
      evicted_bytes: { type: integer, format: int64 }
      total_local_bytes_before: { type: integer, format: int64 }
      total_local_bytes_after: { type: integer, format: int64 }
      errors:
        type: array
        items: { type: string }

  BlobArchiveRequest:
    type: object
    additionalProperties: false
    properties:
      blob_id: { type: string }
      blob_ids:
        type: array
        items: { type: string }
      storage_class:
        type: string
        description: Object-store storage class to copy into when archiving (required for archive transitions).

  BlobArchiveResult:
    type: object
    required: [blob_id, ok]
    properties:
      blob_id: { type: string }
      ok: { type: boolean }
      error: { type: string }
      tier: { type: string }
      storage_class: { type: string, nullable: true }

  BlobArchiveResponse:
    type: object
    required: [ok, count, results]
    properties:
      ok: { type: boolean }
      count: { type: integer, format: int64 }
      results:
        type: array
        items:
          $ref: "#/components/schemas/BlobArchiveResult"

  BlobRestoreRequest:
    type: object
    additionalProperties: false
    required: [restore_days]
    properties:
      blob_id: { type: string }
      blob_ids:
        type: array
        items: { type: string }
      restore_days:
        type: integer
        format: int32
        description: Number of days to keep the restored copy available.
      restore_tier:
        type: string
        description: Restore tier (for Glacier); defaults to Standard when omitted.

  BlobRestoreResult:
    type: object
    required: [blob_id, ok]
    properties:
      blob_id: { type: string }
      ok: { type: boolean }
      error: { type: string }
      tier: { type: string }
      storage_class: { type: string, nullable: true }
      restore_days: { type: integer, format: int32 }
      restore_tier: { type: string }
      restore_status: { type: string }
      restore_expiry_utc_ms: { type: integer, format: int64, nullable: true }
      restore_header: { type: string }

  BlobRestoreResponse:
    type: object
    required: [ok, count, results]
    properties:
      ok: { type: boolean }
      count: { type: integer, format: int64 }
      results:
        type: array
        items:
          $ref: "#/components/schemas/BlobRestoreResult"

  BlobMetaResponse:
    type: object
    required: [ok, blob_id, size_bytes, sha256_hex, created_utc_ms, last_access_utc_ms, ref_count, tier, location]
    properties:
      ok: { type: boolean }
      blob_id: { type: string }
      size_bytes: { type: integer, format: int64 }
      mime: { type: string, nullable: true }
      sha256_hex: { type: string }
      created_utc_ms: { type: integer, format: int64 }
      last_access_utc_ms: { type: integer, format: int64 }
      ref_count: { type: integer, format: int64 }
      tier: { type: string }
      location: { type: string }
      etag: { type: string, nullable: true }
      storage_class: { type: string, nullable: true }

  BlobUploadResponse:
    type: object
    required: [ok, blob_id, sha256_hex, size_bytes, tier, location, ref_count, created_utc_ms, last_access_utc_ms, already_present]
    properties:
      ok: { type: boolean }
      blob_id: { type: string }
      sha256_hex: { type: string }
      size_bytes: { type: integer, format: int64 }
      mime: { type: string, nullable: true }
      tier: { type: string }
      location: { type: string }
      etag: { type: string, nullable: true }
      storage_class: { type: string, nullable: true }
      ref_count: { type: integer, format: int64 }
      created_utc_ms: { type: integer, format: int64 }
      last_access_utc_ms: { type: integer, format: int64 }
      already_present: { type: boolean }

  AgentdConfigResponse:
    type: object
    required: [ok, service, version, daemon, engines, edge_auth, edge_attest]
    properties:
      ok: { type: boolean }
      service: { type: string }
      version: { type: string }
      have_jsoncpp: { type: boolean }
      have_sqlite3: { type: boolean }
      daemon:
        type: object
        additionalProperties: true
        properties:
          listen_host: { type: string }
          listen_port: { type: integer, format: int64 }
          base_url: { type: string }
          model: { type: string }
          summary_model: { type: string, nullable: true }
          summary_max_chars: { type: integer, format: int64 }
          timeout_ms: { type: integer, format: int64 }
          proxy_url_set: { type: boolean }
          api_key_set: { type: boolean }
          provider_keys_set:
            type: object
            additionalProperties: true
            properties:
              deepseek: { type: boolean }
              openrouter: { type: boolean }
              moonshot: { type: boolean }
              openai: { type: boolean }
          auth_enabled: { type: boolean }
          allow_unauthenticated_non_loopback: { type: boolean }
          db_path: { type: string, nullable: true }
          state_dir: { type: string, nullable: true }
          sessions_root_dir: { type: string, nullable: true }
          max_steps_default: { type: integer, format: int64 }
          max_tool_calls_total_default: { type: integer, format: int64 }
          max_tool_calls_per_tool_default: { type: integer, format: int64 }
          max_tool_call_args_chars_default: { type: integer, format: int64 }
          max_tool_result_chars_default: { type: integer, format: int64 }
          tool_call_limits_default:
            type: array
            items:
              type: object
              required: [tool, max_calls]
              properties:
                tool: { type: string }
                max_calls: { type: integer, format: int64 }
          blob_store:
            $ref: "#/components/schemas/BlobStoreConfig"
          blob_tier:
            $ref: "#/components/schemas/BlobTierConfig"
      cors:
        type: object
        additionalProperties: true
      sandbox:
        type: object
        additionalProperties: true
      jobs:
        type: object
        additionalProperties: true
      engines:
        type: object
        additionalProperties: true
        properties:
          workflow_enable_http_tasks: { type: boolean }
          workflow_http_allow_hosts:
            type: array
            items: { type: string }
          workflow_http_allow_cidrs:
            type: array
            items: { type: string }
          workflow_http_deny_cidrs:
            type: array
            items: { type: string }
          workflow_http_deny_private_addrs: { type: boolean }
          workflow_http_dns_pin: { type: boolean }
      edge_auth:
        type: object
        additionalProperties: true
        properties:
          required: { type: boolean }
          require_ts: { type: boolean }
          max_skew_ms: { type: integer, format: int64 }
          require_seq: { type: boolean }
          kid_policy: { type: string }
          hmac_keys_set: { type: integer, format: int64 }
          ed25519_pubkeys_set: { type: integer, format: int64 }
      edge_attest:
        type: object
        additionalProperties: true
        properties:
          required: { type: boolean }
          require_sig: { type: boolean }
      memory:
        type: object
        additionalProperties: true
        properties:
          consolidate_interval_ms: { type: integer, format: int64 }
          consolidate_daily_days: { type: integer, format: int32 }
          consolidate_keep_checkpoints: { type: integer, format: int32 }
          retention_interval_ms: { type: integer, format: int64 }
          retention_daily_max_days: { type: integer, format: int32 }
          retention_daily_max_bytes: { type: integer, format: int64 }
          retention_checkpoint_max_days: { type: integer, format: int32 }
          retention_checkpoint_max_count: { type: integer, format: int32 }
          retention_structured_deprecate_days: { type: integer, format: int32 }
          retention_structured_deprecate_max_entries: { type: integer, format: int32 }
          salience_daily_days: { type: integer, format: int32 }
          salience_max_items: { type: integer, format: int32 }
          salience_structured_max_items: { type: integer, format: int32 }
          salience_daily_max_items: { type: integer, format: int32 }
          salience_half_life_days: { type: number, format: double }
          salience_importance_weight: { type: number, format: double }

  AgentdConfigUpdateRequest:
    type: object
    additionalProperties: false
    properties:
      edge_attest_required:
        type: boolean
        description: When true, invoke-mode edge TASK_DONE requires `result.attest` with a matching `result_sha256`
      edge_attest_require_sig:
        type: boolean
        description: When true, invoke-mode edge TASK_DONE requires a valid attestation signature
      edge_auth_required:
        type: boolean
        description: When true, `/api/v1/edge/message` requires a valid `envelope.auth` (HMAC/Ed25519 profiles)
      edge_auth_require_ts:
        type: boolean
        description: When true, authenticated envelopes must include `ts_utc_ms` (> 0)
      edge_auth_max_skew_ms:
        type: integer
        format: int64
        description: Max allowed absolute time skew (ms) for authenticated envelopes; 0 disables
      edge_auth_require_seq:
        type: boolean
        description: When true, authenticated envelopes must include a monotonic `auth.seq` and be strictly increasing per node
      edge_auth_kid_policy:
        type: string
        description: Key selection policy for authenticated node envelopes (any|match_node|node_prefix)
      edge_auth_hmac_keys:
        type: object
        additionalProperties:
          type: string
          nullable: true
        description: Map of `kid` → shared secret for edge envelope auth (null clears that kid)
      edge_auth_ed25519_pubkeys:
        type: object
        additionalProperties:
          type: string
          nullable: true
        description: Map of `kid` → base64(pubkey32) for Ed25519 edge envelope auth (null clears that kid)
      base_url:
        type: string
        description: Default base_url (used for provider inference and some clients)
      model:
        type: string
        description: Default model
      system_profile:
        type: string
        description: Default host system profile (e.g. default, jules_codex)
      summary_model:
        type: string
        nullable: true
        description: Optional model for compaction summaries (set null to clear)
      summary_max_chars:
        type: integer
        format: int64
        description: Max chars for inserted summary
      max_steps_default:
        type: integer
        format: int64
        description: Default max_steps for tool loops
      max_tool_calls_total_default:
        type: integer
        format: int64
        description: Default max tool calls total for tool loops
      max_tool_calls_per_tool_default:
        type: integer
        format: int64
        description: Default max tool calls per tool for tool loops
      max_tool_call_args_chars_default:
        type: integer
        format: int64
        description: Default max tool call args JSON length
      max_tool_result_chars_default:
        type: integer
        format: int64
        description: Default max tool result chars before prompt reinsertion
      tool_call_limits_default:
        type: array
        description: Default per-tool call limits (replaces the whole list)
        items:
          type: object
          required: [tool, max_calls]
          properties:
            tool: { type: string }
            max_calls: { type: integer, format: int64 }
      timeout_ms:
        type: integer
        format: int64
        description: Provider HTTP timeout in ms
      proxy_url:
        type: string
        nullable: true
        description: Optional HTTP proxy override (set null to clear)
      workflow_admit_max_inflight_tasks_per_session:
        type: integer
        format: int32
        description: Admission control cap (queued|running tasks per session); 0 disables
      workflow_admit_max_inflight_tasks_total:
        type: integer
        format: int32
        description: Admission control cap (queued|running tasks total); 0 disables
      workflow_http_allow_hosts:
        type: array
        items: { type: string }
        description: Optional allowlist for workflow outbound HTTP targets (replaces the whole list)
      workflow_http_allow_cidrs:
        type: array
        items: { type: string }
        description: Optional CIDR allowlist for workflow outbound HTTP targets (replaces the whole list)
      workflow_http_deny_cidrs:
        type: array
        items: { type: string }
        description: Optional CIDR denylist for workflow outbound HTTP targets (replaces the whole list)
      workflow_http_deny_private_addrs:
        type: boolean
        description: Deny private/loopback/link-local unless explicitly allowed (defense-in-depth)
      workflow_http_dns_pin:
        type: boolean
        description: Pin hostname DNS results per request (defense-in-depth vs DNS rebinding)
      provider:
        type: string
        enum: [deepseek, openrouter, moonshot, openai]
        description: Provider name for `api_key` (if omitted, inferred from base_url)
      api_key:
        type: string
        description: Provider API key (empty string clears)
      provider_keys:
        type: object
        additionalProperties:
          type: string
          nullable: true
        description: Map of provider name → API key (null clears that provider key). Keys must be one of deepseek|openrouter|moonshot|openai.
      blob_store:
        $ref: "#/components/schemas/BlobStoreUpdate"
      blob_store_secrets:
        $ref: "#/components/schemas/BlobStoreSecretsUpdate"
      blob_tier:
        $ref: "#/components/schemas/BlobTierConfig"
      memory:
        type: object
        additionalProperties: false
        properties:
          consolidate_interval_ms: { type: integer, format: int64 }
          consolidate_daily_days: { type: integer, format: int32 }
          consolidate_keep_checkpoints: { type: integer, format: int32 }
          retention_interval_ms: { type: integer, format: int64 }
          retention_daily_max_days: { type: integer, format: int32 }
          retention_daily_max_bytes: { type: integer, format: int64 }
          retention_checkpoint_max_days: { type: integer, format: int32 }
          retention_checkpoint_max_count: { type: integer, format: int32 }
          retention_structured_deprecate_days: { type: integer, format: int32 }
          retention_structured_deprecate_max_entries: { type: integer, format: int32 }
          salience_daily_days: { type: integer, format: int32 }
          salience_max_items: { type: integer, format: int32 }
          salience_structured_max_items: { type: integer, format: int32 }
          salience_daily_max_items: { type: integer, format: int32 }
          salience_half_life_days: { type: number, format: double }
          salience_importance_weight: { type: number, format: double }

  AgentdConfigUpdateResponse:
    type: object
    required: [ok, base_url, model, system_profile, summary_max_chars, timeout_ms, proxy_url_set, provider_keys_set, edge_auth_required, edge_auth_hmac_keys_set, edge_auth_ed25519_pubkeys_set, edge_attest_required, edge_attest_require_sig]
    properties:
      ok: { type: boolean }
      base_url: { type: string }
      model: { type: string }
      system_profile: { type: string }
      summary_model: { type: string, nullable: true }
      summary_max_chars: { type: integer, format: int64 }
      timeout_ms: { type: integer, format: int64 }
      max_steps_default: { type: integer, format: int64 }
      max_tool_calls_total_default: { type: integer, format: int64 }
      max_tool_calls_per_tool_default: { type: integer, format: int64 }
      max_tool_call_args_chars_default: { type: integer, format: int64 }
      max_tool_result_chars_default: { type: integer, format: int64 }
      tool_call_limits_default:
        type: array
        items:
          type: object
          required: [tool, max_calls]
          properties:
            tool: { type: string }
            max_calls: { type: integer, format: int64 }
      proxy_url_set: { type: boolean }
      edge_auth_required: { type: boolean }
      edge_auth_require_ts: { type: boolean }
      edge_auth_max_skew_ms: { type: integer, format: int64 }
      edge_auth_require_seq: { type: boolean }
      edge_auth_kid_policy: { type: string }
      edge_attest_required: { type: boolean }
      edge_attest_require_sig: { type: boolean }
      memory:
        type: object
        additionalProperties: true
        properties:
          consolidate_interval_ms: { type: integer, format: int64 }
          consolidate_daily_days: { type: integer, format: int32 }
          consolidate_keep_checkpoints: { type: integer, format: int32 }
          retention_interval_ms: { type: integer, format: int64 }
          retention_daily_max_days: { type: integer, format: int32 }
          retention_daily_max_bytes: { type: integer, format: int64 }
          retention_checkpoint_max_days: { type: integer, format: int32 }
          retention_checkpoint_max_count: { type: integer, format: int32 }
          retention_structured_deprecate_days: { type: integer, format: int32 }
          retention_structured_deprecate_max_entries: { type: integer, format: int32 }
          salience_daily_days: { type: integer, format: int32 }
          salience_max_items: { type: integer, format: int32 }
          salience_structured_max_items: { type: integer, format: int32 }
          salience_daily_max_items: { type: integer, format: int32 }
          salience_half_life_days: { type: number, format: double }
          salience_importance_weight: { type: number, format: double }
      edge_auth_hmac_keys_set:
        type: integer
        format: int64
        description: Number of HMAC keys currently provisioned (secrets are not returned)
      edge_auth_ed25519_pubkeys_set:
        type: integer
        format: int64
        description: Number of Ed25519 pubkeys currently provisioned (pubkeys are not returned)
      engines:
        type: object
        additionalProperties: true
        description: Best-effort echo of workflow outbound HTTP policy knobs after update
      provider_keys_set:
        type: object
        additionalProperties: true
        properties:
          deepseek: { type: boolean }
          openrouter: { type: boolean }
          moonshot: { type: boolean }
          openai: { type: boolean }
      blob_store:
        $ref: "#/components/schemas/BlobStoreConfig"
      blob_tier:
        $ref: "#/components/schemas/BlobTierConfig"

  OtaUpdateRequest:
    type: object
    required: [url]
    properties:
      url:
        type: string
        description: OTA artifact URL (https/file)
      sha256:
        type: string
        description: Optional sha256 checksum (hex)
      version:
        type: string
        description: Optional version label for audit
      reason:
        type: string
        description: Optional human-readable reason
      drain_timeout_ms:
        type: integer
        format: int64
        description: Grace window before restart (ms)
      trace_id:
        $ref: "#/components/schemas/TraceID"

  OtaUpdateResponse:
    type: object
    required: [ok, ota_id, status]
    properties:
      ok: { type: boolean }
      ota_id: { type: string }
      status: { type: string }
      error: { type: string }

  OtaStatusResponse:
    type: object
    required: [ok, status]
    properties:
      ok: { type: boolean }
      status: { type: string }
      ota_id: { type: string }
      updated_unix_ms: { type: integer, format: int64 }
