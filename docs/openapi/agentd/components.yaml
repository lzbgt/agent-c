  WorkflowHttpJsonSpec:
    type: object
    required: [url]
    description: |
      Outbound HTTP JSON configuration for `kind:http_json` workflow tasks.

      Result note:
      - When response JSON parsing succeeds, the engine emits a best-effort deterministic hash token under `http.response_sha256`
        (canonical JSON hash, algorithm `agent_json_c14n_v1`) for quorum/correlation.

      Security:
      - Disabled by default. Operator must start agentd with `--workflow-enable-http-tasks` (SSRF risk).
      - Optional hardening: restrict outbound targets with `--workflow-http-allow-host <host[:port]>` (repeatable), or env `AGENTD_WORKFLOW_HTTP_ALLOW_HOSTS=...`.
      - Further hardening: `--workflow-http-allow-cidr <cidr>` / `AGENTD_WORKFLOW_HTTP_ALLOW_CIDRS=...`, and `--workflow-http-deny-private` / `AGENTD_WORKFLOW_HTTP_DENY_PRIVATE=1`.
      - Do not persist secret headers (like `Authorization`) inside workflow specs. Prefer `bearer_env`.
    properties:
      url:
        type: string
        description: Required URL (must start with http:// or https://).
      method:
        type: string
        enum: [GET, POST]
        description: HTTP method (default POST).
      headers:
        type: object
        description: Optional extra request headers (string values only). `Authorization` is not allowed.
        additionalProperties:
          type: string
      bearer_env:
        type: string
        description: Optional env var name containing a Bearer token (runtime adds Authorization header; the secret value is not persisted).
      body:
        description: Optional JSON request body (any JSON value). Must be omitted for method=GET.
        nullable: true
      timeout_ms:
        type: integer
        format: int64
        description: Request timeout in milliseconds (default 30000; clamp 1..300000).
      max_bytes:
        type: integer
        format: int64
        description: Max response bytes to capture (default 1048576; clamp 1024..16777216).

  WorkflowTaskAgentdCallSpec:
