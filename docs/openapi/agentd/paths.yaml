/api/v1/health:
  get:
    tags: [health]
    summary: Health check
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [ok, service, version]
              properties:
                ok: { type: boolean }
                service: { type: string }
                version: { type: string }
                now_unix_ms: { type: integer, format: int64 }
                uptime_ms: { type: integer, format: int64 }

/api/v1/ready:
  get:
    tags: [health]
    summary: Readiness check
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [ok, ready, service, version]
              properties:
                ok: { type: boolean }
                ready: { type: boolean }
                service: { type: string }
                version: { type: string }
                now_unix_ms: { type: integer, format: int64 }
                uptime_ms: { type: integer, format: int64 }
                checks:
                  type: object
                  properties:
                    db_open: { type: boolean }

/metrics:
  get:
    tags: [health]
    summary: Prometheus metrics
    responses:
      "200":
        description: OK
        content:
          text/plain; version=0.0.4:
            schema:
              type: string

/api/v1/caps:
