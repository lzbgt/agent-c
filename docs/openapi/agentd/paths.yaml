/api/v1/health:
  get:
    tags: [health]
    summary: Health check
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [ok, service, version]
              properties:
                ok: { type: boolean }
                service: { type: string }
                version: { type: string }
                now_unix_ms: { type: integer, format: int64 }
                uptime_ms: { type: integer, format: int64 }

/api/v1/ready:
  get:
    tags: [health]
    summary: Readiness check
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [ok, ready, service, version]
              properties:
                ok: { type: boolean }
                ready: { type: boolean }
                service: { type: string }
                version: { type: string }
                now_unix_ms: { type: integer, format: int64 }
                uptime_ms: { type: integer, format: int64 }
                checks:
                  type: object
                  properties:
                    db_open: { type: boolean }

/metrics:
  get:
    tags: [health]
    summary: Prometheus metrics
    responses:
      "200":
        description: OK
        content:
          text/plain; version=0.0.4:
            schema:
              type: string

/api/v1/caps:
  get:
    tags: [caps]
    summary: Capability descriptor (features + limits)
    responses:
      "200":
        description: Capability snapshot
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapsResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/diagnostics:
  get:
    tags: [diagnostics]
    summary: Diagnostics snapshot (readiness + DB stats)
    responses:
      "200":
        description: Diagnostics snapshot
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticsResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/diagnostics/providers:
  get:
    tags: [diagnostics]
    summary: Provider key presence + defaults
    responses:
      "200":
        description: Provider diagnostics
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticsProvidersResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/diagnostics/provider_test:
  post:
    tags: [diagnostics]
    summary: Run a provider test (no session)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagnosticsProviderTestRequest"
    responses:
      "200":
        description: Provider test result
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticsProviderTestResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/config:
  get:
    tags: [config]
    summary: Get daemon configuration (safe snapshot)
    description: |
      Returns a safe snapshot of the daemon configuration.

      Notes:
      - Requires Bearer auth when the daemon is started with `--auth-token`.
      - Does not include secret values (auth token, provider API keys).
      - `engines.workflow_http_*` fields describe outbound deterministic HTTP policy for workflow tasks like
        `kind:"http_json"` and `kind:"agentd_call"`.
    responses:
      "200":
        description: Config snapshot (safe)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentdConfigResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/config/update:
  post:
    tags: [config]
    summary: Update daemon configuration defaults (persists to DB)
    description: |
      Updates non-secret default configuration values and persists them to the daemon DB so they survive restart.

      Notes:
      - Requires Bearer auth when the daemon is started with `--auth-token`.
      - This endpoint is intended for operator control planes and local bring-up tooling.
      - Provider API keys may be set/cleared via `provider_keys` or `api_key` and are stored in the daemon DB
        (response only includes boolean flags, not secret values).
      - Object-store credentials can be set via `blob_store_secrets` (response only includes boolean flags).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentdConfigUpdateRequest"
    responses:
      "200":
        description: Update acknowledged (safe summary)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentdConfigUpdateResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/edge/auth/trust_roots:
  get:
    tags: [config, edge]
    summary: Get safe edge auth trust-root bundle
    description: |
      Returns the current durable edge-auth trust-root set as a first-class bundle.

      Notes:
      - HMAC secrets are not returned; only `hmac_kids` are exposed.
      - Ed25519 public keys are returned because they are trust roots, not secrets.
      - When run-attestation signing keys are configured, the bundle includes an `attest` block.
    responses:
      "200":
        description: Trust-root bundle
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeAuthTrustRootsResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/edge/auth/trust_roots/rotate:
  post:
    tags: [config, edge]
    summary: Rotate durable edge auth trust roots
    description: |
      Applies a monotonic trust-root rotation epoch and updates the current HMAC / Ed25519
      trust-root set.

      Notes:
      - Requires Bearer auth when daemon auth is enabled.
      - `mode:"replace"` clears the current trust-root set before applying the request body.
      - `rotation_epoch` must be strictly greater than the current epoch.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EdgeAuthTrustRootsRotateRequest"
    responses:
      "200":
        description: Rotation acknowledged
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeAuthTrustRootsRotateResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "409":
        description: Rotation epoch conflict
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/edge/auth/trust_roots/send:
  post:
    tags: [config, edge]
    summary: Enqueue the signed trust-root bundle to one node outbox
    description: |
      Builds the current signed `edge_auth_trust_roots_v1` bundle and enqueues it to the
      recipient node as a `PLATFORM_TRUST_ROOTS_BUNDLE` outbox message. When
      `confidential_kid` is set, the outbox envelope uses `body_enc` instead of plaintext `body`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EdgeAuthTrustRootsSendRequest"
    responses:
      "200":
        description: Bundle queued for node delivery
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeAuthTrustRootsSendResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "404":
        description: Target node not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/edge/auth/cert_roots:
  get:
    tags: [config, edge]
    summary: Get safe edge auth certificate-root bundle
    description: |
      Returns the current durable PEM certificate-root bundle as a first-class signed artifact.

      Notes:
      - This is a control-plane distribution surface for certificate/root-chain material.
      - It does not imply full X.509 path validation is already enforced for UM-BMP envelopes.
    responses:
      "200":
        description: Certificate-root bundle
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeAuthCertRootsResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/edge/auth/cert_roots/rotate:
  post:
    tags: [config, edge]
    summary: Rotate durable edge auth certificate roots
    description: |
      Applies a monotonic certificate-root epoch and updates the current PEM certificate-root set.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EdgeAuthCertRootsRotateRequest"
    responses:
      "200":
        description: Rotation acknowledged
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeAuthCertRootsRotateResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "409":
        description: Rotation epoch conflict
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/edge/auth/cert_roots/send:
  post:
    tags: [config, edge]
    summary: Enqueue the signed certificate-root bundle to one node outbox
    description: |
      Builds the current signed `edge_auth_cert_roots_v1` bundle and enqueues it to the
      recipient node as a `PLATFORM_CERT_ROOTS_BUNDLE` outbox message. When
      `confidential_kid` is set, the outbox envelope uses `body_enc` instead of plaintext `body`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EdgeAuthCertRootsSendRequest"
    responses:
      "200":
        description: Bundle queued for node delivery
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeAuthCertRootsSendResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "404":
        description: Target node not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/edge/auth/cert_roots/verify_chain:
  post:
    tags: [config, edge]
    summary: Verify a certificate chain against the current stored certificate roots
    description: |
      Uses the current durable PEM certificate-root set to verify a submitted certificate chain.

      Notes:
      - This is a structured operator/control-plane verification surface.
      - It narrows the gap toward X.509 enforcement, but does not yet mean `/api/v1/edge/message`
        enforces certificate chains inline for UM-BMP envelopes.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EdgeAuthCertRootsVerifyChainRequest"
    responses:
      "200":
        description: Verification result
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeAuthCertRootsVerifyChainResponse"
      "400":
        description: Invalid request or malformed PEM material
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/edge/auth/node_binding:
  get:
    tags: [config, edge]
    summary: Inspect effective edge auth binding for one node
    parameters:
