        required: true
        schema: { type: string }
    responses:
      "200":
        description: Deleted

/api/v1/edge/workflow/submit:
  post:
    tags: [edge]
    summary: Submit a durable edge workflow (UM-WF)
    requestBody:
      required: true
      content:
        application/json:
