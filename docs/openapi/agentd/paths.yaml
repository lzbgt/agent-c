    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModeratorDirectiveRequest"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModeratorPostResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/moderator/task:
  post:
    tags: [moderator]
