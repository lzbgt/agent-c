/api/v1/edge/auth/provision_node:
  post:
    tags: [config, edge]
    summary: Provision edge auth trust roots for one node
    description: |
      Helper endpoint for per-node trust-root bootstrap and rotation. Applies the requested
      key material, enforces the current `edge_auth_kid_policy`, advances the trust-root epoch,
      and returns both the updated trust-root bundle and the effective node binding.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EdgeAuthProvisionNodeRequest"
    responses:
      "200":
        description: Provisioning acknowledged
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeAuthProvisionNodeResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "409":
        description: Kid policy or epoch conflict
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/edge/auth/revocations:
  get:
    tags: [config, edge]
    summary: Get safe edge auth revocation bundle
    description: |
      Returns the durable edge-auth revocation set as a first-class bundle.

      Notes:
      - Revoked kids and revoked node ids are returned.
      - When run-attestation signing keys are configured, the bundle includes an `attest` block.
    responses:
      "200":
        description: Revocation bundle
