    responses:
      "200":
        description: Policy JSON plus execution metadata
        content:
          application/json:
            schema:
              type: object
              required: [ok, policy, exit_code, timed_out, truncated, stdout]
              properties:
                ok: { type: boolean }
                policy:
                  type: object
                  additionalProperties: true
                exit_code: { type: integer, format: int32 }
                timed_out: { type: boolean }
                truncated: { type: boolean }
                stdout: { type: string }

/api/v1/avm/inspect:
