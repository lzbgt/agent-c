/api/v1/trace:
  get:
    tags: [run]
    summary: Lookup persisted records by trace_id
    description: |
      Returns best-effort persisted records whose JSON contains the given `trace_id`.

      Sources (best-effort):
      - durable run/workflow audit records (`audit_records`)
      - durable workflow events (`workflow_events`) for workflows whose `workflows.trace_id` matches (indexed),
        returned as wrapper objects with `source:"workflow_event"`.
      - edge interop task metadata (`edge_tasks`), task events (`edge_task_events`), and inbound envelopes (`edge_inbox_messages`)
        returned as wrapper objects with `source:"edge_task"` / `source:"edge_task_event"` / `source:"edge_inbox_message"`.
      - edge workflow events (`edge_workflow_events`) correlated via `edge_tasks.trace_id` (and also `workflow_id == trace_id`),
        returned as wrapper objects with `source:"edge_workflow_event"`.

      Notes:
      - Only runs persisted with `no_session=false` will appear (audit_records are DB-backed).
      - This is a best-effort query intended for debugging/correlation, not a primary index.
    parameters:
      - in: query
        name: trace_id
        required: true
        schema:
          $ref: "#/components/schemas/TraceID"
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
      - in: query
        name: max_bytes
        required: false
        schema: { type: integer, format: int32 }
      - in: query
        name: include_memory
        required: false
        schema: { type: boolean }
        description: When true, also attach best-effort structured memory correlation under `memory_correlate` (default false).
      - in: query
        name: memory_since_utc_ms
        required: false
        schema: { type: integer, format: int64 }
        description: When include_memory=true, lower bound for checkpoint scan (default 0).
      - in: query
        name: memory_until_utc_ms
        required: false
        schema: { type: integer, format: int64 }
        description: When include_memory=true, upper bound for checkpoint scan (default INT64_MAX).
      - in: query
        name: memory_max_entries
        required: false
        schema: { type: integer, format: int32 }
        description: When include_memory=true, max entries to return per checkpoint (default 200; clamped).
      - in: query
        name: memory_timeline
        required: false
        schema: { type: boolean }
        description: When include_memory=true, return a bounded checkpoint timeline instead of only the newest checkpoint (default false).
    responses:
      "200":
        description: Trace lookup response
        content:
          application/json:
            schema:
              type: object
              required: [ok, trace_id, records]
              properties:
                ok: { type: boolean }
                trace_id: { $ref: "#/components/schemas/TraceID" }
                count: { type: integer, format: int32 }
                records:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                memory_correlate:
                  $ref: "#/components/schemas/MemoryCorrelateResponse"

/api/v1/memory/consolidate:
  post:
    tags: [memory]
    summary: Promote @mem markers into structured memory
    description: |
      Deterministic rolling consolidation:
      - scans recent daily memory files for explicit `@mem` markers
      - upserts them into `memory/STRUCTURED.md`
      - writes a checkpoint snapshot (best-effort) when changes occur
      - rebuilds the correlation index (best-effort) when `dry_run=false`
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              daily_days: { type: integer, format: int32 }
              keep_checkpoints: { type: integer, format: int32 }
              max_entries: { type: integer, format: int32 }
              dry_run: { type: boolean }
    responses:
      "200":
        description: Consolidation report
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean }
                data:
                  type: object
                  additionalProperties: true
      "400":
        description: Invalid request or consolidation not allowed
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/memory/retention/enforce:
  post:
    tags: [memory]
    summary: Enforce deterministic memory retention
    description: |
      Applies a deterministic retention policy to daily memory logs and structured checkpoints.
      Supports `dry_run` and per-call overrides.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MemoryRetentionEnforceRequest"
    responses:
      "200":
        description: Retention report
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryRetentionEnforceResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "500":
        description: Retention failed
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/memory/checkpoints:
  get:
    tags: [memory]
    summary: List structured memory checkpoints (rolling snapshots)
    description: |
      Lists `memory/checkpoints/structured_*.json` snapshots with deterministic `sha256`.
      Useful for time correlation and replay surfaces.
    parameters:
      - in: query
        name: since_utc_ms
        required: false
        schema: { type: integer, format: int64 }
      - in: query
        name: until_utc_ms
        required: false
        schema: { type: integer, format: int64 }
      - in: query
        name: structured_path
        required: false
        schema: { type: string }
        description: Only return checkpoints whose `path` matches this structured file (e.g. `STRUCTURED.md`).
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
    responses:
      "200":
        description: Checkpoints list
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCheckpointsResponse"

/api/v1/memory/index:
  get:
    tags: [memory]
    summary: List memory files with size/line/token estimates
    description: |
      Lightweight index of memory files to support progressive disclosure.
      Returns per-file size, line count, and token estimate (bytes/4).
    parameters:
      - in: query
        name: session_id
        required: false
        schema: { type: string }
        description: Optional session id for including `memory/sessions/<session_id>.md`.
      - in: query
        name: include_structured
        required: false
        schema: { type: boolean }
      - in: query
        name: include_core
        required: false
        schema: { type: boolean }
      - in: query
        name: include_daily
        required: false
        schema: { type: boolean }
      - in: query
        name: include_session
        required: false
        schema: { type: boolean }
        description: When true, include session memory (requires session_id).
      - in: query
        name: daily_days
        required: false
        schema: { type: integer, format: int32 }
        description: Number of daily files to include (clamped to [0,31]).
    responses:
      "200":
        description: Memory index list
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryIndexResponse"

/api/v1/memory/salience:
  get:
    tags: [memory]
    summary: List salience-ranked memory items (recency + importance)
    description: |
      Computes a deterministic salience ranking over structured memory checkpoints and daily @obs notes.
      Useful for dynamic memory context injection and operator inspection.
    parameters:
      - in: query
        name: include_structured
        required: false
        schema: { type: boolean }
      - in: query
        name: include_daily
        required: false
        schema: { type: boolean }
      - in: query
        name: daily_days
        required: false
        schema: { type: integer, format: int32 }
        description: Number of daily files to scan (clamped to [0,31]).
      - in: query
        name: max_items
        required: false
        schema: { type: integer, format: int32 }
      - in: query
        name: max_structured_items
        required: false
        schema: { type: integer, format: int32 }
      - in: query
        name: max_daily_items
        required: false
        schema: { type: integer, format: int32 }
      - in: query
        name: half_life_days
        required: false
        schema: { type: number, format: double }
      - in: query
        name: importance_weight
        required: false
        schema: { type: number, format: double }
    responses:
      "200":
        description: Salience report
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySalienceResponse"

/api/v1/memory/recaps:
  get:
    tags: [memory]
    summary: List memory recap snapshots
    description: |
      Lists recap JSON snapshots under `memory/recaps/` (newest first).
      Use `include_summary=true` to include the recap summary text.
    parameters:
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
      - in: query
        name: include_summary
        required: false
        schema: { type: boolean }
      - in: query
        name: kind
        required: false
        schema: { type: string }
    responses:
      "200":
        description: Recap list
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryRecapsListResponse"
  post:
    tags: [memory]
    summary: Generate a memory recap (LLM summary)
    description: |
      Generates a recap JSON document from the current salience-ranked memory items.
      Supports `dry_run` to preview the prompt and ranked items without invoking the model.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MemoryRecapRequest"
    responses:
      "200":
        description: Recap report
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryRecapResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "500":
        description: Recap failed
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/memory/correlate:
  get:
    tags: [memory]
    summary: Correlate structured memory evidence by trace_id (bounded)
    description: |
      Selects the newest structured checkpoint in the requested time window and returns
      structured keys whose `sources[]` mention `trace:<trace_id>`.
      When a correlation index exists, the response also includes `daily_entries`, `recap_entries`,
      and `index` metadata.
    parameters:
      - in: query
        name: trace_id
        required: true
        schema: { $ref: "#/components/schemas/TraceID" }
      - in: query
        name: since_utc_ms
        required: false
        schema: { type: integer, format: int64 }
      - in: query
        name: until_utc_ms
        required: false
        schema: { type: integer, format: int64 }
      - in: query
        name: structured_path
        required: false
        schema: { type: string }
        description: Only consider checkpoints whose `path` matches this structured file (e.g. `STRUCTURED.md`).
      - in: query
        name: max_entries
        required: false
        schema: { type: integer, format: int32 }
      - in: query
        name: key_prefix
        required: false
        schema: { type: string }
        description: Restrict matches to keys that start with this prefix (e.g. `wf.test.`).
      - in: query
        name: timeline
        required: false
        schema: { type: boolean }
    responses:
      "200":
        description: Correlation result
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCorrelateResponse"

/api/v1/memory/correlation/index:
  post:
    tags: [memory]
    summary: Build cross-run correlation index
    description: |
      Builds a cross-run correlation index over structured checkpoints, daily observations, and recap evidence.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MemoryCorrelationIndexBuildRequest"
    responses:
      "200":
        description: Correlation index report
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCorrelationIndexBuildResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "500":
        description: Index build failed
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/memory/query:
  get:
    tags: [memory]
    summary: Query structured memory current view (bounded)
    description: |
      Selects the newest structured checkpoint in the requested time window and returns
      the current structured keys filtered by `key_prefix` (if provided).
    parameters:
      - in: query
        name: since_utc_ms
        required: false
        schema: { type: integer, format: int64 }
      - in: query
        name: until_utc_ms
        required: false
        schema: { type: integer, format: int64 }
      - in: query
        name: structured_path
        required: false
        schema: { type: string }
        description: Only consider checkpoints whose `path` matches this structured file (e.g. `STRUCTURED.md`).
      - in: query
        name: key_prefix
        required: false
        schema: { type: string }
        description: Restrict results to keys that start with this prefix (e.g. `wf.`).
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
        description: Max number of entries to return (clamped).
    responses:
      "200":
        description: Query result
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryQueryResponse"

/api/v1/workflow/submit:
  post:
    tags: [workflows]
    summary: Submit a durable workflow (DAG)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowSubmitRequest"
    responses:
      "200":
        description: Workflow accepted
        content:
          application/json:
            schema:
              type: object
              required: [ok, workflow_id, trace_id, deduped]
              properties:
                ok: { type: boolean }
                workflow_id: { type: string }
                trace_id: { $ref: "#/components/schemas/TraceID" }
                session_id: { type: string }
                deduped:
                  type: boolean
                  description: If true, the workflow already existed for the provided idempotency_key and was not re-created.
      "429":
        description: Admission control / backpressure
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/workflow:
  get:
    tags: [workflows]
    summary: Get workflow status
    parameters:
      - in: query
        name: workflow_id
        required: true
        schema: { type: string }
      - in: query
        name: include_tasks
        required: false
        schema: { type: boolean }
      - in: query
        name: include_results
        required: false
        schema: { type: boolean }
      - in: query
        name: include_spec
        required: false
        schema: { type: boolean }
    responses:
      "200":
        description: Workflow snapshot
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowGetResponse"

/api/v1/workflow/stats:
  get:
    tags: [workflows]
    summary: Workflow scheduler stats (queue pressure)
    parameters:
      - in: query
        name: include_budget_pressure
        required: false
        schema: { type: boolean }
        description: If true, include best-effort aggregate budget pressure under `budget_pressure`.
      - in: query
        name: budget_workflow_limit
        required: false
        schema: { type: integer, format: int32 }
        description: Max number of queued|running workflows to scan for budget pressure (default 64; max 512).
      - in: query
        name: include_budget_workflows
        required: false
        schema: { type: boolean }
        description: If true, include a small sampled workflow list under `budget_pressure.workflows` (best-effort).
      - in: query
        name: include_sessions
        required: false
        schema: { type: boolean }
        description: If true, include per-session inflight snapshot under `sessions` (best-effort).
      - in: query
        name: session_limit
        required: false
        schema: { type: integer, format: int32 }
        description: Max number of session rows to return when include_sessions=true (default 32; max 512).
      - in: query
        name: include_no_session
        required: false
        schema: { type: boolean }
        description: When include_sessions=true, include empty session_id bucket (default false).
    responses:
      "200":
        description: Scheduler stats snapshot
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowStatsResponse"

/api/v1/workflows:
  get:
    tags: [workflows]
    summary: List workflows by status
    parameters:
      - in: query
        name: status
        required: false
        schema: { type: string }
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
    responses:
      "200":
        description: Workflow list
        content:
          application/json:
            schema:
              type: object
              required: [ok, status, workflows]
              properties:
                ok: { type: boolean }
                status: { type: string }
                workflows:
                  type: array
                  items:
                    type: object
                    required: [workflow_id, status, priority, cancel_requested, created_unix_ms, updated_unix_ms]
                    properties:
                      workflow_id: { type: string }
                      status: { type: string }
                      priority: { type: integer, format: int32 }
                      deadline_unix_ms: { type: integer, format: int64 }
                      idempotency_key: { type: string }
                      trace_id: { $ref: "#/components/schemas/TraceID" }
                      session_id: { type: string }
                      cancel_requested: { type: boolean }
                      error: { type: string }
                      created_unix_ms: { type: integer, format: int64 }
                      updated_unix_ms: { type: integer, format: int64 }

/api/v1/workflow/cancel:
  post:
    tags: [workflows]
    summary: Cancel a workflow (best-effort)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workflow_id]
            properties:
              workflow_id: { type: string }
    responses:
      "200":
        description: Cancellation requested

/api/v1/workflow/events:
  get:
    tags: [workflows]
    summary: List workflow events (durable)
    parameters:
      - in: query
        name: workflow_id
        required: true
        schema: { type: string }
      - in: query
        name: after_event_id
        required: false
        schema: { type: integer, format: int64 }
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
    responses:
      "200":
        description: Workflow event slice
        content:
          application/json:
            schema:
              type: object
              required: [ok, workflow_id, events, cursor_next]
              properties:
                ok: { type: boolean }
                workflow_id: { type: string }
                after_event_id: { type: integer, format: int64 }
                cursor_next: { type: integer, format: int64 }
                events:
                  type: array
                  items:
                    type: object
                    additionalProperties: true

/api/v1/workflow/stream:
  get:
    tags: [workflows]
    summary: Stream workflow events (SSE)
    description: |
      Streams `workflow_event` events (durable workflow event log) and ends with terminal `workflow_done`.
    parameters:
      - in: query
        name: workflow_id
        required: true
        schema: { type: string }
      - in: query
        name: cursor
        required: false
        schema: { type: integer, format: int64 }
    responses:
      "200":
        description: SSE stream
        content:
          text/event-stream:
            schema:
              type: string

/api/v1/edge/message:
  post:
    tags: [edge]
    summary: Ingest an UM-BMP message envelope (edge interop)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EdgeMessageEnvelope"
        application/cbor:
          schema:
            type: string
            format: binary
    responses:
      "200":
        description: Accepted (idempotent)
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean }
                deduped: { type: boolean }

/api/v1/edge/outbox:
  get:
    tags: [edge]
    summary: Poll outbound UM-BMP messages for a node (outbox cursor)
    parameters:
      - in: query
        name: node_id
        required: true
        schema: { type: string }
      - in: query
        name: cursor
        required: false
        schema: { type: integer, format: int64 }
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
    responses:
      "200":
        description: Outbox slice
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeOutboxResponse"
          application/cbor:
            schema:
              type: string
              format: binary

/api/v1/edge/nodes:
  get:
    tags: [edge]
    summary: List registered edge nodes
    parameters:
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
    responses:
      "200":
        description: Nodes list

/api/v1/edge/node:
  get:
    tags: [edge]
    summary: Get node registry record (summary)
    parameters:
      - in: query
        name: node_id
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Node record

/api/v1/edge/node/caps:
  get:
    tags: [edge]
    summary: Get node capability manifest (UM-ACDS)
    parameters:
      - in: query
        name: node_id
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Node manifest

/api/v1/edge/task/assign:
  post:
    tags: [edge]
    summary: Enqueue a TASK_ASSIGN to a node (platform helper)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EdgeTaskAssignRequest"
    responses:
      "200":
        description: Enqueued
        content:
          application/json:
            schema:
              type: object
              required: [ok, node_id, task_id, step_id, outbox_id]
              properties:
                ok: { type: boolean }
                node_id: { type: string }
                task_id: { type: string }
                step_id: { type: string }
                outbox_id: { type: integer, format: int64 }
                deduped: { type: boolean }

/api/v1/edge/task:
  get:
    tags: [edge]
    summary: Get an edge task status
    description: |
      Returns a platform-side view of the edge task row.

      Notes (best-effort):
      - When a task reaches `SUCCEEDED` with a persisted `result`, the platform also stores a deterministic
        hash surface `result_sha256` (sha256 of stored `result_json` bytes).
      - If the node reports a `result.attest` object in `TASK_DONE`, the platform persists it and surfaces it
        as `task.attest`.
    parameters:
      - in: query
        name: task_id
        required: true
        schema: { type: string }
      - in: query
        name: step_id
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Task state
        content:
          application/json:
            schema:
              type: object
              required: [ok, task]
              properties:
                ok: { type: boolean }
                task:
                  type: object
                  additionalProperties: true

/api/v1/edge/rule/upsert:
  post:
    tags: [edge]
    summary: Create or update an automation rule (SENSOR_EVENT -> action)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EdgeRuleUpsertRequest"
    responses:
      "200":
        description: Upserted
        content:
          application/json:
            schema:
              type: object
              required: [ok, rule_id]
              properties:
                ok: { type: boolean }
                rule_id: { type: string }

/api/v1/edge/rules:
  get:
    tags: [edge]
    summary: List automation rules
