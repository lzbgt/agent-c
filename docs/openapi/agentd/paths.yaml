        application/json:
          schema:
            type: object
            required: [workflow_id]
            properties:
              workflow_id: { type: string }
    responses:
      "200":
        description: Canceled

/api/v1/edge/workflow:
  get:
    tags: [edge]
    summary: Get an edge workflow
    parameters:
      - in: query
        name: workflow_id
        required: true
        schema: { type: string }
      - in: query
        name: include_steps
