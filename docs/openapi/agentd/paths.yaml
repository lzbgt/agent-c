        schema: { type: string }
    responses:
      "200":
        description: Workflow

/api/v1/edge/workflow/events:
  get:
    tags: [edge]
    summary: List edge workflow events (paged)
    parameters:
      - in: query
        name: workflow_id
        required: true
        schema: { type: string }
      - in: query
        name: cursor
        required: false
        schema: { type: integer, format: int64 }
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
    responses:
      "200":
        description: Events list

/api/v1/edge/workflow/stream:
  get:
    tags: [edge]
    summary: Stream edge workflow events (SSE)
    parameters:
      - in: query
        name: workflow_id
        required: true
        schema: { type: string }
      - in: query
        name: cursor
        required: false
        schema: { type: integer, format: int64 }
    responses:
      "200":
        description: SSE stream (text/event-stream)

/api/v1/edge/workflows:
  get:
    tags: [edge]
    summary: List edge workflows by status
    parameters:
      - in: query
        name: status
        required: false
        schema: { type: string }
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
    responses:
      "200":
        description: Workflows list

/api/v1/blob:
  get:
    tags: [blobs]
    summary: Download blob bytes (local or object-store)
    description: |
      Returns blob bytes for local tier. In object-store mode, the daemon either
      proxies the object stream or returns a `302` redirect to a presigned URL
      (see `blob_store.read_mode`).
    parameters:
      - in: query
        name: blob_id
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Blob bytes
      "206":
        description: Partial content (Range)
      "302":
        description: Redirect to presigned URL (object-store read_mode=redirect)

/api/v1/blob/meta:
  get:
    tags: [blobs]
    summary: Get blob metadata
    parameters:
      - in: query
        name: blob_id
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Blob metadata
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlobMetaResponse"

/api/v1/blob/upload:
  post:
    tags: [blobs]
    summary: Upload a blob (local or object-store)
    description: |
      Accepts JSON (`data_base64`) or raw bytes. In object-store mode, the daemon
      writes the object and stores `tier`, `location`, and `etag` metadata.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [data_base64]
            properties:
              data_base64: { type: string }
              mime: { type: string }
              retain: { type: boolean }
    responses:
      "200":
        description: Upload result
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlobUploadResponse"

/api/v1/blob/retain:
  post:
    tags: [blobs]
    summary: Adjust blob ref count
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [blob_id, delta]
            properties:
              blob_id: { type: string }
              delta: { type: integer, format: int64 }
    responses:
      "200":
        description: Updated ref count

/api/v1/blob/gc:
  post:
    tags: [blobs]
    summary: GC unreferenced blobs
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              min_age_ms: { type: integer, format: int64 }
              max_rows: { type: integer, format: int32 }
              dry_run: { type: boolean }
    responses:
      "200":
        description: GC summary

/api/v1/blob/tier/enforce:
  post:
    tags: [blobs]
    summary: Enforce blob tiering policy once
    description: |
      Applies the tiering policy (promotion + eviction) once. Intended for operator
      maintenance or cron usage; returns metrics for auditing.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BlobTierEnforceRequest"
    responses:
      "200":
        description: Tiering enforcement result
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlobTierEnforceResponse"

/api/v1/blob/archive:
  post:
    tags: [blobs]
    summary: Mark blobs as archived (operator)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BlobArchiveRequest"
    responses:
      "200":
        description: Archive results
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlobArchiveResponse"

/api/v1/blob/restore:
  post:
    tags: [blobs]
    summary: Request restore for archived blobs (operator)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BlobRestoreRequest"
    responses:
      "200":
        description: Restore results
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlobRestoreResponse"

/api/v1/sessions:
  get:
    tags: [sessions]
    summary: List sessions
    responses:
      "200":
        description: Sessions list
/api/v1/session:
  get:
    tags: [sessions]
    summary: Get session messages
    parameters:
      - in: query
        name: session_id
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Session payload
        content:
          application/json:
            schema:
              type: object
              required: [ok, session_id, messages]
              properties:
                ok: { type: boolean }
                session_id: { type: string }
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string }
                      content: { type: string }
                      mm_json: { type: string }
                      mm_bytes: { type: integer, format: int64 }
                      mm_truncated: { type: integer, format: int64 }
                error: { type: string }

/api/v1/moderator/directive:
