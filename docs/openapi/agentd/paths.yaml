              $ref: "#/components/schemas/ErrorResponse"

/api/v1/edge/auth/revocations/update:
  post:
    tags: [config, edge]
    summary: Update durable edge auth revocations
    description: |
      Applies a monotonic revocation epoch and updates the current revoked kid / revoked node set.

      Notes:
      - Requires Bearer auth when daemon auth is enabled.
      - `mode:"replace"` clears the current revocation set before applying the request body.
      - `rotation_epoch` must be strictly greater than the current epoch.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EdgeAuthRevocationsUpdateRequest"
    responses:
      "200":
        description: Revocation update acknowledged
        content:
