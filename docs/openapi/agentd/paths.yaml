/api/v1/trace:
  get:
    tags: [run]
    summary: Lookup persisted records by trace_id
    description: |
      Returns best-effort persisted records whose JSON contains the given `trace_id`.

      Sources (best-effort):
      - durable run/workflow audit records (`audit_records`)
      - durable workflow events (`workflow_events`) for workflows whose `workflows.trace_id` matches (indexed),
        returned as wrapper objects with `source:"workflow_event"`.
      - edge interop task metadata (`edge_tasks`), task events (`edge_task_events`), and inbound envelopes (`edge_inbox_messages`)
        returned as wrapper objects with `source:"edge_task"` / `source:"edge_task_event"` / `source:"edge_inbox_message"`.
      - edge workflow events (`edge_workflow_events`) correlated via `edge_tasks.trace_id` (and also `workflow_id == trace_id`),
        returned as wrapper objects with `source:"edge_workflow_event"`.

      Notes:
      - Only runs persisted with `no_session=false` will appear (audit_records are DB-backed).
      - This is a best-effort query intended for debugging/correlation, not a primary index.
    parameters:
      - in: query
        name: trace_id
        required: true
        schema:
          $ref: "#/components/schemas/TraceID"
      - in: query
        name: limit
        required: false
        schema: { type: integer, format: int32 }
      - in: query
        name: max_bytes
        required: false
        schema: { type: integer, format: int32 }
      - in: query
        name: include_memory
        required: false
        schema: { type: boolean }
        description: When true, also attach best-effort structured memory correlation under `memory_correlate` (default false).
      - in: query
        name: memory_since_utc_ms
        required: false
        schema: { type: integer, format: int64 }
        description: When include_memory=true, lower bound for checkpoint scan (default 0).
      - in: query
        name: memory_until_utc_ms
        required: false
        schema: { type: integer, format: int64 }
        description: When include_memory=true, upper bound for checkpoint scan (default INT64_MAX).
      - in: query
        name: memory_max_entries
        required: false
        schema: { type: integer, format: int32 }
        description: When include_memory=true, max entries to return per checkpoint (default 200; clamped).
      - in: query
        name: memory_timeline
        required: false
        schema: { type: boolean }
        description: When include_memory=true, return a bounded checkpoint timeline instead of only the newest checkpoint (default false).
    responses:
      "200":
        description: Trace lookup response
        content:
          application/json:
            schema:
              type: object
              required: [ok, trace_id, records]
              properties:
                ok: { type: boolean }
                trace_id: { $ref: "#/components/schemas/TraceID" }
                count: { type: integer, format: int32 }
                records:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                memory_correlate:
                  $ref: "#/components/schemas/MemoryCorrelateResponse"

/api/v1/memory/consolidate:
  post:
    tags: [memory]
    summary: Promote @mem markers into structured memory
    description: |
      Deterministic rolling consolidation:
      - scans recent daily memory files for explicit `@mem` markers
      - upserts them into `memory/STRUCTURED.md`
      - writes a checkpoint snapshot (best-effort) when changes occur
      - rebuilds the correlation index (best-effort) when `dry_run=false`
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              daily_days: { type: integer, format: int32 }
              keep_checkpoints: { type: integer, format: int32 }
              max_entries: { type: integer, format: int32 }
              dry_run: { type: boolean }
    responses:
      "200":
        description: Consolidation report
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean }
                data:
                  type: object
                  additionalProperties: true
      "400":
        description: Invalid request or consolidation not allowed
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/memory/retention/enforce:
