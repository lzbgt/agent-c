/api/v1/tools:
  get:
    tags: [tools]
    summary: List available tools
    parameters:
      - in: query
        name: tools
        required: false
        schema: { type: string }
        description: Requested tool mode (none|basic|host)
      - in: query
        name: yolo
        required: false
        schema: { type: boolean }
        description: Request unrestricted tools (cannot exceed daemon policy)
      - in: query
        name: host_policy
        required: false
        schema: { type: string }
        description: Requested host policy (full|readonly)
      - in: query
        name: session_id
        required: false
        schema: { type: string }
        description: Session id for session-scoped tools
    responses:
      "200":
        description: Tools list
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean }
                tools:
                  type: string
                  description: Effective tool mode (none|basic|host)
                daemon_tools:
                  type: string
                  description: Daemon tool mode ceiling (none|basic|host)
                requested_tools:
                  type: string
                  description: Requested tool mode (when provided by the client)
                effective_yolo:
                  type: boolean
                effective_host_policy:
                  type: string
                  description: Effective host policy (full|readonly)
                effective_session_id:
                  type: string
                defs:
                  type: array
                  items:
                    $ref: "#/components/schemas/ToolDef"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/v1/sandbox/mount_validate:
  post:
