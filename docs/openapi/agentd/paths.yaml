        application/json:
          schema:
            $ref: "#/components/schemas/ClientPrefsUpdateRequest"
    responses:
      "200":
        description: Client prefs response
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientPrefsResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "500":
        description: Persist failed
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

