AgentdConfigResponse:
  type: object
  required: [ok, service, version, daemon, engines, edge_auth, edge_confidentiality, edge_attest]
  properties:
    ok: { type: boolean }
    service: { type: string }
    version: { type: string }
    have_jsoncpp: { type: boolean }
    have_sqlite3: { type: boolean }
    daemon:
      type: object
      additionalProperties: true
      properties:
        listen_host: { type: string }
        listen_port: { type: integer, format: int64 }
        base_url: { type: string }
        model: { type: string }
        summary_model: { type: string, nullable: true }
        summary_max_chars: { type: integer, format: int64 }
        timeout_ms: { type: integer, format: int64 }
        proxy_url_set: { type: boolean }
        api_key_set: { type: boolean }
        provider_keys_set:
          type: object
          additionalProperties: true
          properties:
            deepseek: { type: boolean }
            openrouter: { type: boolean }
            moonshot: { type: boolean }
            openai: { type: boolean }
        auth_enabled: { type: boolean }
        allow_unauthenticated_non_loopback: { type: boolean }
        db_path: { type: string, nullable: true }
        state_dir: { type: string, nullable: true }
        sessions_root_dir: { type: string, nullable: true }
        audio_webrtc:
          type: object
          additionalProperties: true
          properties:
            broker_url_default_configured: { type: boolean }
            broker_token_default_configured: { type: boolean }
            peer_tool_path_configured: { type: boolean }
            builtin_native_library_path_configured: { type: boolean }
            builtin_local_playback_enabled: { type: boolean }
            builtin_available: { type: boolean }
            builtin_native_probe:
              $ref: "#/components/schemas/VoiceWebRtcPeerNativeMediaProviderProbe"
            builtin_mode:
              type: string
              enum: [disabled, signaling_stub, native_plugin]
            bundled_available: { type: boolean }
            external_available: { type: boolean }
            builtin_unavailable_reason: { type: string }
            bundled_unavailable_reason: { type: string }
            external_unavailable_reason: { type: string }
            default_runtime_kind:
              type: string
              nullable: true
              enum: [builtin, bundled, external]
            default_runtime_kind_source:
              type: string
              enum: [auto, env, config]
            default_runtime_kind_available: { type: boolean }
            default_runtime_kind_unavailable_reason: { type: string }
            node_bin: { type: string }
        max_steps_default: { type: integer, format: int64 }
        max_tool_calls_total_default: { type: integer, format: int64 }
        max_tool_calls_per_tool_default: { type: integer, format: int64 }
        max_tool_call_args_chars_default: { type: integer, format: int64 }
        max_tool_result_chars_default: { type: integer, format: int64 }
        tool_call_limits_default:
          type: array
          items:
            type: object
            required: [tool, max_calls]
            properties:
              tool: { type: string }
              max_calls: { type: integer, format: int64 }
        blob_store:
          $ref: "#/components/schemas/BlobStoreConfig"
        blob_tier:
          $ref: "#/components/schemas/BlobTierConfig"
    cors:
      type: object
      additionalProperties: true
    sandbox:
      type: object
      additionalProperties: true
    jobs:
      type: object
      additionalProperties: true
    engines:
      type: object
      additionalProperties: true
      properties:
        workflow_enable_http_tasks: { type: boolean }
        workflow_http_allow_hosts:
          type: array
          items: { type: string }
        workflow_http_allow_cidrs:
          type: array
          items: { type: string }
        workflow_http_deny_cidrs:
          type: array
          items: { type: string }
        workflow_http_deny_private_addrs: { type: boolean }
        workflow_http_dns_pin: { type: boolean }
    edge_auth:
      type: object
      additionalProperties: true
      properties:
        required: { type: boolean }
        require_ts: { type: boolean }
        max_skew_ms: { type: integer, format: int64 }
        require_seq: { type: boolean }
        kid_policy: { type: string }
        hmac_keys_set: { type: integer, format: int64 }
        ed25519_pubkeys_set: { type: integer, format: int64 }
        trust_roots_epoch: { type: integer, format: int64 }
        trust_roots_updated_utc_ms: { type: integer, format: int64 }
        cert_roots_set: { type: integer, format: int64 }
        cert_roots_epoch: { type: integer, format: int64 }
        cert_roots_updated_utc_ms: { type: integer, format: int64 }
        require_manifest_cert_chain: { type: boolean }
        revoked_kids_set: { type: integer, format: int64 }
        revoked_node_ids_set: { type: integer, format: int64 }
        revocations_epoch: { type: integer, format: int64 }
        revocations_updated_utc_ms: { type: integer, format: int64 }
    edge_attest:
      type: object
      additionalProperties: true
      properties:
        required: { type: boolean }
        require_sig: { type: boolean }
    edge_confidentiality:
      type: object
      additionalProperties: true
      properties:
        required: { type: boolean }
        keys_set: { type: integer, format: int64 }
    edge_consensus:
      type: object
      additionalProperties: true
      properties:
        node_tool_path_configured: { type: boolean }
        builtin_available: { type: boolean, enum: [true] }
        external_available: { type: boolean }
        external_unavailable_reason: { type: string }
        default_runtime_kind:
          type: string
          enum: [builtin, external]
        default_runtime_kind_source:
          type: string
          enum: [auto, env, config]
        default_runtime_kind_available: { type: boolean }
        default_runtime_kind_unavailable_reason: { type: string }
        clusters_set: { type: integer, format: int64 }
        cluster_ids:
          type: array
          items: { type: string }
    memory:
      type: object
      additionalProperties: true
      properties:
        consolidate_interval_ms: { type: integer, format: int64 }
        consolidate_daily_days: { type: integer, format: int32 }
        consolidate_keep_checkpoints: { type: integer, format: int32 }
        recap_daily_interval_ms: { type: integer, format: int64 }
        recap_weekly_interval_ms: { type: integer, format: int64 }
        recap_daily_days: { type: integer, format: int32 }
        recap_weekly_days: { type: integer, format: int32 }
        retention_interval_ms: { type: integer, format: int64 }
        retention_daily_max_days: { type: integer, format: int32 }
        retention_daily_max_bytes: { type: integer, format: int64 }
        retention_checkpoint_max_days: { type: integer, format: int32 }
        retention_checkpoint_max_count: { type: integer, format: int32 }
        retention_structured_deprecate_days: { type: integer, format: int32 }
        retention_structured_deprecate_max_entries: { type: integer, format: int32 }
        salience_daily_days: { type: integer, format: int32 }
        salience_max_items: { type: integer, format: int32 }
        salience_structured_max_items: { type: integer, format: int32 }
        salience_daily_max_items: { type: integer, format: int32 }
        salience_half_life_days: { type: number, format: double }
        salience_importance_weight: { type: number, format: double }


AgentdConfigUpdateRequest:
  type: object
  additionalProperties: false
  properties:
    edge_attest_required:
      type: boolean
      description: When true, invoke-mode edge TASK_DONE requires `result.attest` with a matching `result_sha256`
    edge_attest_require_sig:
      type: boolean
      description: When true, invoke-mode edge TASK_DONE requires a valid attestation signature
    edge_auth_required:
      type: boolean
      description: When true, `/api/v1/edge/message` requires a valid `envelope.auth` (HMAC/Ed25519 profiles)
    edge_auth_require_ts:
      type: boolean
      description: When true, authenticated envelopes must include `ts_utc_ms` (> 0)
    edge_auth_max_skew_ms:
      type: integer
      format: int64
      description: Max allowed absolute time skew (ms) for authenticated envelopes; 0 disables
    edge_auth_require_seq:
      type: boolean
      description: When true, authenticated envelopes must include a monotonic `auth.seq` and be strictly increasing per node
    edge_auth_kid_policy:
      type: string
      description: Key selection policy for authenticated node envelopes (any|match_node|node_prefix)
    edge_auth_require_manifest_cert_chain:
      type: boolean
      description: When true, `NODE_CAPS_RSP.body.manifest.identity.{cert_pem,cert_chain_pem}` must verify against the stored PEM cert-root set
    edge_confidentiality_required:
      type: boolean
      description: When true, `/api/v1/edge/message` requires encrypted `body_enc` instead of plaintext `body`
    edge_auth_trust_roots_epoch:
      type: integer
      format: int64
      description: Optional explicit trust-root rotation epoch metadata (also updated by `/api/v1/edge/auth/trust_roots/rotate`)
    edge_auth_cert_roots_epoch:
      type: integer
      format: int64
      description: Optional explicit cert-root rotation epoch metadata (also updated by `/api/v1/edge/auth/cert_roots/rotate`)
    edge_auth_revocations_epoch:
      type: integer
      format: int64
      description: Optional explicit revocation epoch metadata (also updated by `/api/v1/edge/auth/revocations/update`)
    edge_auth_hmac_keys:
      type: object
      additionalProperties:
        type: string
        nullable: true
      description: Map of `kid` → shared secret for edge envelope auth (null clears that kid)
    edge_auth_ed25519_pubkeys:
      type: object
      additionalProperties:
        type: string
        nullable: true
      description: Map of `kid` → base64(pubkey32) for Ed25519 edge envelope auth (null clears that kid)
    edge_confidentiality_keys:
      type: object
      additionalProperties:
        type: string
        nullable: true
      description: Map of `kid` → shared secret for AES-GCM encrypted `body_enc` payloads (null clears that kid)
    base_url:
      type: string
      description: Default base_url (used for provider inference and some clients)
    model:
      type: string
      description: Default model
    system_profile:
      type: string
      description: Default host system profile (e.g. default, jules_codex)
    summary_model:
      type: string
      nullable: true
      description: Optional model for compaction summaries (set null to clear)
    summary_max_chars:
      type: integer
      format: int64
      description: Max chars for inserted summary
    max_steps_default:
      type: integer
      format: int64
      description: Default max_steps for tool loops
    max_tool_calls_total_default:
      type: integer
      format: int64
      description: Default max tool calls total for tool loops
    max_tool_calls_per_tool_default:
      type: integer
      format: int64
      description: Default max tool calls per tool for tool loops
    max_tool_call_args_chars_default:
      type: integer
      format: int64
      description: Default max tool call args JSON length
    max_tool_result_chars_default:
      type: integer
      format: int64
      description: Default max tool result chars before prompt reinsertion
    tool_call_limits_default:
      type: array
      description: Default per-tool call limits (replaces the whole list)
      items:
        type: object
        required: [tool, max_calls]
        properties:
          tool: { type: string }
          max_calls: { type: integer, format: int64 }
    timeout_ms:
      type: integer
      format: int64
      description: Provider HTTP timeout in ms
    proxy_url:
      type: string
      nullable: true
      description: Optional HTTP proxy override (set null to clear)
    workflow_admit_max_inflight_tasks_per_session:
      type: integer
      format: int32
      description: Admission control cap (queued|running tasks per session); 0 disables
    workflow_admit_max_inflight_tasks_total:
      type: integer
      format: int32
      description: Admission control cap (queued|running tasks total); 0 disables
    workflow_http_allow_hosts:
      type: array
      items: { type: string }
      description: Optional allowlist for workflow outbound HTTP targets (replaces the whole list)
    workflow_http_allow_cidrs:
      type: array
      items: { type: string }
      description: Optional CIDR allowlist for workflow outbound HTTP targets (replaces the whole list)
    workflow_http_deny_cidrs:
      type: array
      items: { type: string }
      description: Optional CIDR denylist for workflow outbound HTTP targets (replaces the whole list)
    workflow_http_deny_private_addrs:
      type: boolean
      description: Deny private/loopback/link-local unless explicitly allowed (defense-in-depth)
    workflow_http_dns_pin:
      type: boolean
      description: Pin hostname DNS results per request (defense-in-depth vs DNS rebinding)
    provider:
      type: string
      enum: [deepseek, openrouter, moonshot, openai]
      description: Provider name for `api_key` (if omitted, inferred from base_url)
    api_key:
      type: string
      description: Provider API key (empty string clears)
    provider_keys:
      type: object
      additionalProperties:
        type: string
        nullable: true
      description: Map of provider name → API key (null clears that provider key). Keys must be one of deepseek|openrouter|moonshot|openai.
    audio_webrtc:
      type: object
      additionalProperties: false
      properties:
        broker_url:
          type: string
          nullable: true
          description: Default broker base URL for managed WebRTC voice runtimes (null clears)
        broker_token:
          type: string
          nullable: true
          description: Default broker bearer token for managed WebRTC voice runtimes (null clears)
        peer_tool_path:
          type: string
          nullable: true
          description: External helper tool path for `runtime_kind=external` (null clears)
        builtin_native_library_path:
          type: string
          nullable: true
          description: Shared-library path for `audio_webrtc.builtin_mode=native_plugin` (null clears)
        builtin_local_playback:
          type: boolean
          nullable: true
          description: Best-effort default-output PortAudio playback for builtin managed WebRTC runtimes after agentd has already decoded and owned inbound PCM (null disables)
        builtin_mode:
          type: string
          nullable: true
          enum: [signaling_stub, native_plugin]
          description: Experimental builtin managed WebRTC runtime mode. `signaling_stub` enables the in-process native signaling stub backend; `native_plugin` loads a process-local native media-engine provider shared library from `builtin_native_library_path`; null disables builtin runtime availability.
        default_runtime_kind:
          type: string
          nullable: true
          enum: [builtin, bundled, external]
          description: Preferred default managed WebRTC backend when callers omit `runtime_kind` (null resets to auto selection)
        node_bin:
          type: string
          nullable: true
          description: Node launcher binary for bundled or external managed WebRTC peers (null resets to `node`)
    edge_consensus:
      type: object
      additionalProperties: false
      properties:
        node_tool_path:
          type: string
          nullable: true
          description: External helper tool path for `runtime_kind=external` managed consensus runtimes (null clears)
        default_runtime_kind:
          type: string
          nullable: true
          enum: [builtin, external]
          description: Preferred default managed consensus backend when callers omit `runtime_kind` (null resets to builtin auto selection)
    blob_store:
      $ref: "#/components/schemas/BlobStoreUpdate"
    blob_store_secrets:
      $ref: "#/components/schemas/BlobStoreSecretsUpdate"
    blob_tier:
      $ref: "#/components/schemas/BlobTierConfig"
    memory:
      type: object
      additionalProperties: false
      properties:
        consolidate_interval_ms: { type: integer, format: int64 }
        consolidate_daily_days: { type: integer, format: int32 }
        consolidate_keep_checkpoints: { type: integer, format: int32 }
        recap_daily_interval_ms: { type: integer, format: int64 }
        recap_weekly_interval_ms: { type: integer, format: int64 }
        recap_daily_days: { type: integer, format: int32 }
        recap_weekly_days: { type: integer, format: int32 }
        retention_interval_ms: { type: integer, format: int64 }
        retention_daily_max_days: { type: integer, format: int32 }
        retention_daily_max_bytes: { type: integer, format: int64 }
        retention_checkpoint_max_days: { type: integer, format: int32 }
        retention_checkpoint_max_count: { type: integer, format: int32 }
        retention_structured_deprecate_days: { type: integer, format: int32 }
        retention_structured_deprecate_max_entries: { type: integer, format: int32 }
        salience_daily_days: { type: integer, format: int32 }
        salience_max_items: { type: integer, format: int32 }
        salience_structured_max_items: { type: integer, format: int32 }
        salience_daily_max_items: { type: integer, format: int32 }
        salience_half_life_days: { type: number, format: double }
        salience_importance_weight: { type: number, format: double }


