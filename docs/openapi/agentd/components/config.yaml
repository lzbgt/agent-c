EdgeAuthTrustRootsAttestation:
  type: object
  required: [schema, ts_utc_ms, rotation_epoch, signing_schema, alg, kid, sig]
  properties:
    schema: { type: string, enum: [edge_auth_trust_roots_attest_v1] }
    ts_utc_ms: { type: integer, format: int64 }
    rotation_epoch: { type: integer, format: int64 }
    signing_schema: { type: string, enum: [edge_auth_trust_roots_v1] }
    alg: { type: string, enum: [hmac-sha256, ed25519] }
    kid: { type: string }
    pubkey:
      type: string
      description: Present for Ed25519 signatures
    sig: { type: string }


EdgeAuthTrustRootsBundle:
  type: object
  required:
    [schema, created_utc_ms, rotation_epoch, updated_utc_ms, auth_required, require_ts, max_skew_ms, require_seq, kid_policy, hmac_kids, ed25519_pubkeys]
  properties:
    schema: { type: string, enum: [edge_auth_trust_roots_v1] }
    created_utc_ms: { type: integer, format: int64 }
    rotation_epoch: { type: integer, format: int64 }
    updated_utc_ms: { type: integer, format: int64 }
    auth_required: { type: boolean }
    require_ts: { type: boolean }
    max_skew_ms: { type: integer, format: int64 }
    require_seq: { type: boolean }
    kid_policy: { type: string }
    hmac_kids:
      type: array
      items: { type: string }
    ed25519_pubkeys:
      type: object
      additionalProperties: { type: string }
    attest:
      $ref: "#/components/schemas/EdgeAuthTrustRootsAttestation"


EdgeAuthTrustRootsResponse:
  type: object
  required: [ok, trust_roots]
  properties:
    ok: { type: boolean }
    trust_roots:
      $ref: "#/components/schemas/EdgeAuthTrustRootsBundle"


EdgeAuthTrustRootsSendRequest:
  type: object
  additionalProperties: false
  required: [target_node_id]
  properties:
    target_node_id:
      type: string
      description: Recipient node that will receive the trust-root bundle via outbox
    confidential_kid:
      type: string
      description: Optional configured confidentiality `kid`; when set, the outbox envelope is emitted with `body_enc`


EdgeAuthTrustRootsSendResponse:
  type: object
  required: [ok, target_node_id, outbox_id, trust_roots]
  properties:
    ok: { type: boolean }
