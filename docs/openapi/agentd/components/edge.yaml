EdgeEncryptedBody:
  type: object
  required: [schema, alg, kid, iv, tag, ct, content_type]
  properties:
    schema: { type: string, enum: [umbmp_body_enc_v1] }
    alg: { type: string, enum: [aes-256-gcm] }
    kid: { type: string }
    iv:
      type: string
      description: Base64 of a 12-byte AES-GCM IV
    tag:
      type: string
      description: Base64 of a 16-byte AES-GCM authentication tag
    ct:
      type: string
      description: Base64 ciphertext of the compact JSON body object
    content_type: { type: string, enum: [application/json] }

EdgeMessageEnvelope:
  type: object
  required: [msg_id, ts_utc_ms, type, from, to]
  properties:
    msg_id: { type: string }
    ts_utc_ms: { type: integer, format: int64 }
    type: { type: string }
    from: { type: string }
    to:
      description: Destination address or null
      type: string
      nullable: true
    body:
      type: object
      additionalProperties: true
      description: Plaintext UM-BMP body object. Mutually exclusive with `body_enc`.
    body_enc:
      $ref: "#/components/schemas/EdgeEncryptedBody"
    auth:
      type: object
      additionalProperties: true
    trace:
      type: object
      additionalProperties: true

EdgeNodeConsensusFrame:
  type: object
  required: [schema, frame_id, kind, term, from]
  properties:
    schema: { type: string, enum: [edge_node_consensus_frame_v1] }
    frame_id: { type: string }
    kind: { type: string, enum: [vote_request, vote_grant, leader_commit] }
    term: { type: integer, format: int64 }
    decision_sha256: { type: string }
    candidate_node_id: { type: string }
    leader_node_id: { type: string }
    granted: { type: boolean }
    from:
      type: object
      additionalProperties: true
    vote_witnesses:
      type: array
      items:
        type: object
        additionalProperties: true

EdgeNodeConsensusStatus:
  type: object
  required: [schema, updated_utc_ms, last_frame_id, last_frame_kind, current_term, from]
  properties:
    schema: { type: string, enum: [edge_node_consensus_status_v1] }
    updated_utc_ms: { type: integer, format: int64 }
    last_msg_id: { type: string }
    last_frame_id: { type: string }
    last_frame_kind: { type: string, enum: [vote_request, vote_grant, leader_commit] }
    current_term: { type: integer, format: int64 }
    decision_sha256: { type: string }
    candidate_node_id: { type: string }
    leader_node_id: { type: string }
    granted: { type: boolean }
    from:
      type: object
      additionalProperties: true
    target_node_ids:
      type: array
      items: { type: string }
    forwarded_count: { type: integer, format: int64 }
    vote_witness_count: { type: integer, format: int64 }
    vote_witnesses:
      type: array
      items:
        type: object
        additionalProperties: true

EdgeConsensusClusterPolicy:
  type: object
  required: [schema, cluster_id, membership_epoch, updated_utc_ms, campaign_delay_ms, campaign_retry_ms, member_node_ids]
  properties:
    schema: { type: string, enum: [edge_consensus_cluster_policy_v1] }
    cluster_id: { type: string }
    membership_epoch: { type: integer, format: int64 }
    updated_utc_ms: { type: integer, format: int64 }
    campaign_delay_ms: { type: integer, format: int64 }
    campaign_retry_ms: { type: integer, format: int64 }
    member_node_ids:
      type: array
      items: { type: string }

EdgeNodeConsensusRuntime:
  type: object
  required: [schema, node_id, cluster_id, manifest_sha256, peer_node_ids, member_node_ids, daemon_url, tool_path, started_unix_ms, campaign_delay_ms, campaign_retry_ms, poll_interval_ms, deadline_ms, cluster_size, outbox_limit, trust_epochs, membership_epoch, running]
  properties:
    schema: { type: string, enum: [edge_node_consensus_runtime_v1] }
    node_id: { type: string }
    cluster_id: { type: string }
    manifest_sha256: { type: string }
    decision_sha256: { type: string }
    peer_node_ids:
      type: array
      items: { type: string }
    member_node_ids:
      type: array
      items: { type: string }
    daemon_url: { type: string }
    tool_path: { type: string }
    model: { type: string }
    fw_git_sha: { type: string }
    stderr_log_path: { type: string }
    started_unix_ms: { type: integer, format: int64 }
    ended_unix_ms: { type: integer, format: int64 }
    campaign_delay_ms: { type: integer, format: int64 }
    campaign_retry_ms: { type: integer, format: int64 }
    poll_interval_ms: { type: integer, format: int64 }
    deadline_ms: { type: integer, format: int64 }
    cluster_size: { type: integer, format: int64 }
    outbox_limit: { type: integer, format: int64 }
    trust_epochs:
      type: object
      required: [trust_roots_epoch, revocations_epoch, cert_roots_epoch]
      properties:
        trust_roots_epoch: { type: integer, format: int64 }
        revocations_epoch: { type: integer, format: int64 }
        cert_roots_epoch: { type: integer, format: int64 }
    membership_epoch: { type: integer, format: int64 }
    running: { type: boolean }
    pid: { type: integer, format: int64 }
    exit_code: { type: integer }
    exit_signal: { type: integer }
    last_error: { type: string }
    last_stdout_line: { type: string }
    last_stdout:
      type: object
      additionalProperties: true
    result:
      type: object
      additionalProperties: true

EdgeNodeSummary:
  type: object
  required: [node_id, last_hello_utc_ms, last_heartbeat_utc_ms]
  properties:
    node_id: { type: string }
    model: { type: string }
    fw_git_sha: { type: string }
    caps_sha256: { type: string }
    last_hello_utc_ms: { type: integer, format: int64 }
    last_heartbeat_utc_ms: { type: integer, format: int64 }
    consensus:
      $ref: "#/components/schemas/EdgeNodeConsensusStatus"
    consensus_runtime:
      $ref: "#/components/schemas/EdgeNodeConsensusRuntime"

EdgeNodesResponse:
  type: object
  required: [ok, nodes]
  properties:
    ok: { type: boolean }
    nodes:
      type: array
      items:
        $ref: "#/components/schemas/EdgeNodeSummary"

EdgeNodeRecordResponse:
  type: object
  required: [ok, node]
  properties:
    ok: { type: boolean }
    node:
      allOf:
        - $ref: "#/components/schemas/EdgeNodeSummary"
        - type: object
          properties:
            tags:
              type: array
              items: { type: string }
            tools:
              type: array
              items:
                type: object
                additionalProperties: true
            hardware_presence:
              type: object
              additionalProperties: true
            health:
              type: object
              additionalProperties: true
            identity_cert_verify:
              type: object
              additionalProperties: true
            has_manifest: { type: boolean }
            consensus_runtime:
              $ref: "#/components/schemas/EdgeNodeConsensusRuntime"

EdgeNodeConsensusRuntimeRequest:
  type: object
  additionalProperties: false
  required: [action, node_id]
  properties:
    action: { type: string, enum: [start, stop] }
    node_id: { type: string }
    cluster_id: { type: string }
    manifest_sha256: { type: string }
    decision_sha256: { type: string }
    peer_node_ids:
      type: array
      items: { type: string }
    member_node_ids:
      type: array
      items: { type: string }
    cluster_size: { type: integer, format: int64 }
    outbox_limit: { type: integer, format: int64 }
    campaign_delay_ms: { type: integer, format: int64 }
    campaign_retry_ms: { type: integer, format: int64 }
    poll_interval_ms: { type: integer, format: int64 }
    deadline_ms: { type: integer, format: int64 }
    trust_roots_epoch: { type: integer, format: int64 }
    revocations_epoch: { type: integer, format: int64 }
    cert_roots_epoch: { type: integer, format: int64 }
    membership_epoch: { type: integer, format: int64 }
    daemon_url:
      type: string
      description: Optional override; defaults to the local agentd listener URL
    auth_token:
      type: string
      description: Optional override for the managed helper; defaults to agentd's configured daemon auth token
    model: { type: string }
    fw_git_sha: { type: string }

EdgeNodeConsensusRuntimeResponse:
  type: object
  required: [ok, node_id, tool_configured, default_daemon_url]
  properties:
    ok: { type: boolean }
    node_id: { type: string }
    tool_configured: { type: boolean }
    tool_path: { type: string }
    default_daemon_url: { type: string }
    started: { type: boolean }
    stopped: { type: boolean }
    already_running: { type: boolean }
    reason: { type: string }
    error: { type: string }
    runtime:
      nullable: true
      allOf:
        - $ref: "#/components/schemas/EdgeNodeConsensusRuntime"
    cluster_policy:
      $ref: "#/components/schemas/EdgeConsensusClusterPolicy"

EdgeNodeConsensusRuntimeStatusResponse:
  type: object
  required: [ok, node_id, tool_configured, default_daemon_url, node_exists, running]
  properties:
    ok: { type: boolean }
    node_id: { type: string }
    tool_configured: { type: boolean }
    tool_path: { type: string }
    default_daemon_url: { type: string }
    node_exists: { type: boolean }
    running: { type: boolean }
    node_consensus:
      $ref: "#/components/schemas/EdgeNodeConsensusStatus"
    runtime:
      nullable: true
      allOf:
        - $ref: "#/components/schemas/EdgeNodeConsensusRuntime"
    cluster_policy:
      $ref: "#/components/schemas/EdgeConsensusClusterPolicy"


EdgeOutboxResponse:
  type: object
  required: [ok, node_id, cursor_base, cursor_next, messages]
  properties:
    ok: { type: boolean }
    node_id: { type: string }
    cursor_base: { type: integer, format: int64 }
    cursor_next: { type: integer, format: int64 }
    messages:
      type: array
      items:
        type: object
        required: [outbox_id, ts_utc_ms]
        properties:
          outbox_id: { type: integer, format: int64 }
          ts_utc_ms: { type: integer, format: int64 }
          msg:
            $ref: "#/components/schemas/EdgeMessageEnvelope"
          msg_raw: { type: string }
          parse_error: { type: string }


EdgeNodeCapsResponse:
  type: object
  required: [ok, node_id, manifest]
  properties:
    ok: { type: boolean }
    node_id: { type: string }
    manifest:
      type: object
      additionalProperties: true


EdgeNodeManifestAttestation:
  type: object
  required: [schema, ts_utc_ms, signing_schema, node_id, manifest_sha256, alg, kid, sig]
  properties:
    schema: { type: string, enum: [edge_node_manifest_attest_v1] }
    ts_utc_ms: { type: integer, format: int64 }
    signing_schema: { type: string, enum: [edge_node_manifest_bundle_v1] }
    node_id: { type: string }
    caps_sha256: { type: string }
    manifest_sha256: { type: string }
    alg: { type: string, enum: [hmac-sha256, ed25519] }
    kid: { type: string }
    pubkey:
      type: string
      description: Present for Ed25519 signatures
    sig: { type: string }


EdgeNodeManifestBundle:
  type: object
  required:
    [schema, created_utc_ms, node_id, manifest_sha256, manifest_sha256_alg, last_hello_utc_ms, last_heartbeat_utc_ms, manifest]
  properties:
    schema: { type: string, enum: [edge_node_manifest_bundle_v1] }
    created_utc_ms: { type: integer, format: int64 }
    node_id: { type: string }
    caps_sha256: { type: string }
    manifest_sha256: { type: string }
    manifest_sha256_alg: { type: string, enum: [agent_json_c14n_v1] }
    model: { type: string }
    fw_git_sha: { type: string }
    last_hello_utc_ms: { type: integer, format: int64 }
    last_heartbeat_utc_ms: { type: integer, format: int64 }
    manifest:
      type: object
      additionalProperties: true
    tools:
      type: array
      items:
        type: object
        additionalProperties: true
    tags:
      type: array
      items: { type: string }
    hardware_presence:
      type: object
      additionalProperties: true
    identity_cert_verify:
      type: object
      additionalProperties: true
      description: Best-effort verification summary for `manifest.identity.{cert_pem,cert_chain_pem}` against the current PEM cert-root set
    attest:
      $ref: "#/components/schemas/EdgeNodeManifestAttestation"


EdgeNodeManifestBundleResponse:
  type: object
  required: [ok, node_id, bundle]
  properties:
    ok: { type: boolean }
    node_id: { type: string }
    bundle:
      $ref: "#/components/schemas/EdgeNodeManifestBundle"


EdgeNodeManifestBundleSendRequest:
  type: object
  additionalProperties: false
  required: [target_node_id, subject_node_id]
  properties:
    target_node_id:
      type: string
      description: Recipient node that will receive the bundle via outbox
    subject_node_id:
      type: string
      description: Node whose manifest bundle will be signed and delivered
    confidential_kid:
      type: string
      description: Optional configured confidentiality `kid`; when set, the outbox envelope is emitted with `body_enc`


EdgeNodeManifestBundleSendResponse:
  type: object
  required: [ok, target_node_id, subject_node_id, outbox_id, bundle]
  properties:
    ok: { type: boolean }
    target_node_id: { type: string }
    subject_node_id: { type: string }
    outbox_id: { type: integer, format: int64 }
    confidential_kid: { type: string }
    bundle:
      $ref: "#/components/schemas/EdgeNodeManifestBundle"


EdgeTaskAssignRequest:
  type: object
  required: [task_id, step_id, idempotency_key, mode, deadline_utc_ms, payload]
  properties:
    trace:
      type: object
      description: "Optional trace correlation object (best-effort). Recommended field: trace_id."
      additionalProperties: true
    node_id:
      type: string
      description: Explicit target node_id (preferred when known)
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    match_any:
      type: object
      description: |
        Capability-based node selection.

        Common keys (best-effort):
        - `requires_tools` (array of tool names)
        - `tags_all`, `tags_any`, `tags_none` (arrays of tag strings)
        - `exclude_node_ids` (array of node_id strings to exclude; useful for distinct-node fan-out)
      additionalProperties: true
    allow_hazards:
      type: array
      description: Explicitly allowed hazard tags (unsafe; use sparingly)
      items: { type: string }
    allow_high_side_effect:
      type: boolean
      description: Allow dispatch when tool side_effect_level is high
    task_id:
      type: string
      description: Task identifier (id-safe token)
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    step_id:
      type: string
      description: Step identifier within the task/workflow (id-safe token)
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    idempotency_key:
      type: string
      description: Idempotency token used for platform-side dedupe (id-safe token)
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    mode:
      type: string
      enum: [invoke, agent]
    deadline_utc_ms: { type: integer, format: int64 }
    attempt:
      type: integer
      format: int32
      description: Optional attempt number (for workflow orchestration/debug; default 0)
    payload:
      type: object
      description: |
        Task payload.

        - mode=invoke: requires payload.tool (string) and payload.args (object). When the target node has a stored
          manifest, payload.args is validated (best-effort) against the tool schema in the node manifest:
          manifest.tools[].parameters_schema (preferred) or manifest.tools[].parameters (fallback).
          If the schema specifies additionalProperties:false, unknown keys are rejected.
        - mode=agent: payload is forwarded to the node/embedded agent_core; platform does not interpret it.
      additionalProperties: true


EdgeRuleUpsertRequest:
  type: object
  required: [event_type, action]
  properties:
    rule_id:
      type: string
      description: Optional; if omitted, server generates one
    enabled: { type: boolean }
    event_type: { type: string }
    min_confidence: { type: number, format: double }
    cooldown_ms: { type: integer, format: int32 }
    action:
      type: object
      description: |
        Rule action.

        Supported `type` values:
        - `task_assign`: enqueue a UM‑BMP `TASK_ASSIGN` (like `POST /api/v1/edge/task/assign`)
        - `durable_workflow_submit`: submit a durable workflow to the platform workflow engine

        Note: OpenAPI cannot fully express the conditional shape; see server behavior.
      additionalProperties: true


EdgeWorkflowSubmitRequest:
  type: object
  required: [steps]
  properties:
    workflow_id:
      type: string
      description: Optional; if omitted, server generates one
    goal: { type: string }
    priority: { type: integer, format: int32 }
    steps:
      type: array
      items:
        type: object
        required: [step_id, kind]
        properties:
          step_id: { type: string }
          kind: { type: string, enum: [invoke_tool, run_agent, join] }
          depends_on:
            type: array
            items: { type: string }
          target:
            type: object
            additionalProperties: true
          payload:
            type: object
            additionalProperties: true
          join_mode: { type: string, enum: [all, any] }
          deadline_utc_ms: { type: integer, format: int64 }
          max_attempts: { type: integer, format: int32 }
          backoff_ms: { type: integer, format: int32 }
