VoiceWebRtcPeerBackendPolicyDrift:
  type: object
  required: [changed_fields, current_effective_start]
  properties:
    changed_fields:
      type: array
      items: { type: string }
    current_effective_start:
      type: object
      additionalProperties: true

VoiceWebRtcPeerBuiltinBrokerSessionContract:
  type: object
  required: [mode, preflighted]
  properties:
    mode:
      type: string
      enum: [borrowed, auto_create]
    preflighted: { type: boolean }
    session_id: { type: string }
    session_mode: { type: string }
    agent_id: { type: string }
    deployment_id: { type: string }

VoiceWebRtcPeerBuiltinStartStage:
  type: object
  required: [stage, deferred]
  properties:
    stage:
      type: string
      enum: [borrowed_broker_session_preflight, auto_create_broker_session, launch_runtime, startup_confirmation, startup_failure_cleanup]
    deferred: { type: boolean }

VoiceWebRtcPeerBuiltinRuntimeArtifacts:
  type: object
  required: [runtime_dir, ready_file_path, stdout_log_path, stderr_log_path, ready_signal, stdout_format, stderr_format]
  properties:
    runtime_dir: { type: string }
    ready_file_path: { type: string }
    stdout_log_path: { type: string }
    stderr_log_path: { type: string }
    ready_signal:
      type: string
      enum: [ready_file]
    stdout_format:
      type: string
      enum: [jsonl]
    stderr_format:
      type: string
      enum: [text]

VoiceWebRtcPeerNativeMediaProvider:
  type: object
  required: [abi_version, name]
  properties:
    abi_version: { type: integer, format: int32 }
    name: { type: string }
    version: { type: string }
    library_path:
      type: string
      description: Shared-library path for `native_plugin` providers when known to agentd.
    capabilities:
      type: object
      additionalProperties: true
      description: Provider-declared capability map exported by the native media-engine ABI.

VoiceWebRtcPeerNativeMediaProviderProbe:
  type: object
  required: [configured, loadable]
  properties:
    configured: { type: boolean }
    loadable: { type: boolean }
    library_path: { type: string }
    media_engine_kind: { type: string }
    native_media_supported: { type: boolean }
    provider:
      $ref: "#/components/schemas/VoiceWebRtcPeerNativeMediaProvider"
    error: { type: string }

VoiceWebRtcPeerMediaRuntimePlan:
  type: object
  required: [schema, signaling_surface, runtime_kind, media_engine_kind, session_id, broker_url, managed_broker_session, sender_tag, ready_signal, ready_file_path, deadline_ms, poll_interval_ms, tone_hz, native_media_supported]
  properties:
    schema:
      type: string
      enum: [voice_webrtc_peer_media_runtime_plan_v1]
    signaling_surface:
      type: string
      enum: [voice_webrtc_peer]
    runtime_kind:
      type: string
      enum: [builtin, bundled, external]
    media_engine_kind:
      type: string
      enum: [builtin_reserved, builtin_signaling_stub, builtin_native_plugin, browser_peer]
      description: Concrete media-engine family the selected runtime will use. `browser_peer` means the shipped browser-backed RTP path, `builtin_reserved` means builtin was selected but native media is still disabled, `builtin_signaling_stub` means the experimental in-process signaling-only builtin runtime, and `builtin_native_plugin` means builtin loads a process-local native media-engine provider shared library.
    session_id: { type: string }
    broker_session_id: { type: string }
    broker_url: { type: string }
    managed_broker_session: { type: boolean }
    broker_agent_id: { type: string }
    broker_deployment_id: { type: string }
    sender_tag: { type: string }
    ready_signal:
      type: string
      enum: [ready_file]
    ready_file_path: { type: string }
    deadline_ms: { type: integer, format: int64 }
    poll_interval_ms: { type: integer, format: int64 }
    tone_hz: { type: integer, format: int64 }
    native_media_supported:
      type: boolean
      description: Whether this runtime plan terminates media natively inside agentd instead of delegating RTP/media handling to the shipped browser peer. `builtin_native_plugin` mirrors the loaded provider capability rather than the mode name alone, so the shipped sample provider still reports `false`.
    native_media_provider:
      $ref: "#/components/schemas/VoiceWebRtcPeerNativeMediaProvider"

VoiceWebRtcPeerBuiltinStartContract:
  type: object
  required: [session_id, runtime_kind, signaling_surface, broker_url, sender_tag, deadline_ms, poll_interval_ms, tone_hz, startup_wait_ms, mutating_broker_actions_deferred, startup_sequence, runtime_artifacts, broker_session, media_runtime_plan, planned_runtime]
  properties:
    session_id: { type: string }
    runtime_kind:
      type: string
      enum: [builtin]
    signaling_surface:
      type: string
      enum: [voice_webrtc_peer]
    broker_url: { type: string }
    sender_tag: { type: string }
    deadline_ms: { type: integer, format: int64 }
    poll_interval_ms: { type: integer, format: int64 }
    tone_hz: { type: integer, format: int64 }
    startup_wait_ms: { type: integer, format: int64 }
    mutating_broker_actions_deferred: { type: boolean, enum: [true] }
    startup_sequence:
      type: array
      items:
        $ref: "#/components/schemas/VoiceWebRtcPeerBuiltinStartStage"
    runtime_artifacts:
      $ref: "#/components/schemas/VoiceWebRtcPeerBuiltinRuntimeArtifacts"
    broker_session:
      $ref: "#/components/schemas/VoiceWebRtcPeerBuiltinBrokerSessionContract"
    media_runtime_plan:
      $ref: "#/components/schemas/VoiceWebRtcPeerMediaRuntimePlan"
    planned_runtime:
      $ref: "#/components/schemas/VoiceWebRtcPeerRuntime"

VoiceWebRtcPeerRuntime:
  type: object
  required: [schema, runtime_kind, media_engine_kind, media_engine_state, status_source, session_id, broker_url, sender_tag, tool_path, node_bin, started_unix_ms, deadline_ms, poll_interval_ms, tone_hz, media_state_updated_unix_ms, media_events_total, media_remote_offers_seen, media_answers_sent, media_remote_candidates_seen, media_remote_byes_seen, media_local_byes_sent, native_media_supported, native_media_active, ready, running]
  properties:
    schema: { type: string, enum: [session_voice_webrtc_peer_runtime_v1] }
    runtime_kind:
      type: string
      enum: [builtin, bundled, external]
    media_engine_kind:
      type: string
      enum: [builtin_reserved, builtin_signaling_stub, builtin_native_plugin, browser_peer]
      description: Concrete media-engine family for the live or planned runtime. `browser_peer` means the bundled/external browser-backed RTP path, `builtin_reserved` means builtin was requested but native media is still unavailable, `builtin_signaling_stub` means the experimental in-process signaling-only builtin runtime, and `builtin_native_plugin` means builtin loads a process-local native media-engine provider shared library.
    media_engine_state:
      type: string
      enum: [idle, planned, starting, signaling_ready, answer_ready, signaling_active, stopping, stopped, failed]
      description: Best-effort lifecycle state for the selected media engine. Current builtin runtime transitions through `starting`, `signaling_ready`, `answer_ready`, `signaling_active`, and terminal `stopped|failed`; planned previews use `planned`.
    status_source:
      type: string
      enum: [memory, persisted, planned]
    session_id: { type: string }
    broker_session_id: { type: string }
    broker_url: { type: string }
    managed_broker_session: { type: boolean }
    broker_agent_id: { type: string }
    broker_deployment_id: { type: string }
    sender_tag: { type: string }
    tool_path: { type: string }
    node_bin: { type: string }
    ready_file_path: { type: string }
    stdout_log_path: { type: string }
    stderr_log_path: { type: string }
    started_unix_ms: { type: integer, format: int64 }
    ended_unix_ms: { type: integer, format: int64 }
    deadline_ms: { type: integer, format: int64 }
    poll_interval_ms: { type: integer, format: int64 }
    tone_hz: { type: integer, format: int64 }
    media_state_updated_unix_ms:
      type: integer
      format: int64
      description: Unix ms timestamp for the most recent `media_engine_state` transition; `0` is used by deterministic planned previews.
    media_events_total:
      type: integer
      format: int64
      description: Total number of normalized builtin media-engine events observed for this runtime snapshot.
    media_remote_offers_seen: { type: integer, format: int64 }
    media_answers_sent: { type: integer, format: int64 }
    media_remote_candidates_seen: { type: integer, format: int64 }
    media_remote_byes_seen: { type: integer, format: int64 }
    media_local_byes_sent: { type: integer, format: int64 }
    native_media_supported:
      type: boolean
      description: Whether this runtime can terminate RTP/media natively inside agentd. Current shipped runtimes, including the builtin sample provider, still report `false`.
    native_media_active:
      type: boolean
      description: Whether native media handling is currently active inside agentd for this runtime. Current shipped runtimes report `false`.
    native_media_provider:
      $ref: "#/components/schemas/VoiceWebRtcPeerNativeMediaProvider"
    ready: { type: boolean }
    running: { type: boolean }
    pid: { type: integer, format: int64 }
    exit_code: { type: integer }
    exit_signal: { type: integer }
    last_error: { type: string }
    last_stdout_line: { type: string }
    last_stdout:
      type: object
      additionalProperties: true

VoiceWebRtcPeerRequest:
  type: object
  additionalProperties: false
  required: [session_id, action]
  properties:
    session_id: { type: string }
    action:
      type: string
      enum: [start, stop]
    runtime_kind:
      type: string
      enum: [builtin, bundled, external]
      description: Optional backend selector for `action=start`; ignored on `action=stop`. `bundled` uses the shipped repo-local Node/Playwright peer when discoverable, `external` uses an operator-configured helper path, and `builtin` uses either the in-process signaling stub (`audio_webrtc.builtin_mode=signaling_stub`) or a process-local native media-engine provider shared library (`audio_webrtc.builtin_mode=native_plugin` plus `audio_webrtc.builtin_native_library_path`). When builtin mode is disabled or unavailable, the same request and non-mutating broker-session preflight validation still applies before returning the unavailable response.
    broker_session_id:
      type: string
      description: Optional existing broker audio-session id. Must not be combined with `broker_agent_id` or `broker_deployment_id`; when supplied, agentd preflights that broker session before launch, and the same borrowed-session validation also applies to `runtime_kind=builtin`.
    broker_agent_id:
      type: string
      description: Optional broker `agent_id` used to auto-create a broker audio session when `broker_session_id` is omitted.
    broker_deployment_id:
      type: string
      description: Optional broker `deployment_id` passed through when agentd auto-creates the broker audio session. Must be omitted when `broker_session_id` is supplied.
    broker_url:
      type: string
      description: Optional broker base URL override. When omitted, agentd uses its configured default broker URL if available.
    broker_token:
      type: string
      description: Broker bearer token override used for session creation on `start`, and optionally reused on `stop` so agentd can delete an owned broker audio session itself if the child peer died before sending `bye`. When omitted, agentd uses its configured default broker token if available.
    sender_tag: { type: string }
    deadline_ms: { type: integer, format: int64 }
    poll_interval_ms: { type: integer, format: int64 }
    tone_hz: { type: integer, format: int64 }
    startup_wait_ms:
      type: integer
      format: int64
      description: Optional bounded startup confirmation window in ms. Agentd waits up to this long for the peer to become ready and fails the start if the child exits before readiness.

VoiceWebRtcPeerResponse:
  type: object
  required: [ok, session_id, tool_configured, builtin_available, bundled_available, external_available, default_runtime_kind, default_runtime_kind_source, default_runtime_kind_available, node_bin]
  properties:
    ok: { type: boolean }
    session_id: { type: string }
    tool_configured: { type: boolean }
    builtin_available: { type: boolean }
    builtin_native_library_path_configured: { type: boolean }
    builtin_native_probe:
      $ref: "#/components/schemas/VoiceWebRtcPeerNativeMediaProviderProbe"
    builtin_mode:
      type: string
      enum: [disabled, signaling_stub, native_plugin]
    bundled_available: { type: boolean }
    external_available: { type: boolean }
    builtin_unavailable_reason: { type: string }
    bundled_unavailable_reason: { type: string }
    external_unavailable_reason: { type: string }
    broker_url_default_configured: { type: boolean }
    broker_token_default_configured: { type: boolean }
    startup_confirmed: { type: boolean }
    default_runtime_kind:
      type: string
      enum: [builtin, bundled, external]
    default_runtime_kind_source:
      type: string
      enum: [auto, env, config]
    default_runtime_kind_available: { type: boolean }
    default_runtime_kind_unavailable_reason: { type: string }
    bundled_tool_path: { type: string }
    tool_path: { type: string }
    node_bin: { type: string }
    started: { type: boolean }
    stopped: { type: boolean }
    broker_session_deleted: { type: boolean }
    broker_session_delete_error: { type: string }
    startup_cleanup:
      type: object
      additionalProperties: true
    cleanup_on_corrupt_record:
      type: object
      additionalProperties: true
    cleanup_on_stale_record:
      type: object
      additionalProperties: true
    already_running: { type: boolean }
    reason: { type: string }
    error: { type: string }
    builtin_start_contract:
      $ref: "#/components/schemas/VoiceWebRtcPeerBuiltinStartContract"
    backend_policy_drift:
      $ref: "#/components/schemas/VoiceWebRtcPeerBackendPolicyDrift"
    peer:
      nullable: true
      allOf:
        - $ref: "#/components/schemas/VoiceWebRtcPeerRuntime"

VoiceWebRtcPeerStatusResponse:
  type: object
  required: [ok, session_id, tool_configured, builtin_available, bundled_available, external_available, default_runtime_kind, default_runtime_kind_source, default_runtime_kind_available, node_bin, session_exists, running]
  properties:
    ok: { type: boolean }
    session_id: { type: string }
    tool_configured: { type: boolean }
    builtin_available: { type: boolean }
    builtin_native_library_path_configured: { type: boolean }
    builtin_mode:
      type: string
      enum: [disabled, signaling_stub, native_plugin]
    bundled_available: { type: boolean }
    external_available: { type: boolean }
    builtin_unavailable_reason: { type: string }
    bundled_unavailable_reason: { type: string }
    external_unavailable_reason: { type: string }
    broker_url_default_configured: { type: boolean }
    broker_token_default_configured: { type: boolean }
    default_runtime_kind:
      type: string
      enum: [builtin, bundled, external]
    default_runtime_kind_source:
      type: string
      enum: [auto, env, config]
    default_runtime_kind_available: { type: boolean }
    default_runtime_kind_unavailable_reason: { type: string }
    bundled_tool_path: { type: string }
    tool_path: { type: string }
    node_bin: { type: string }
    session_exists: { type: boolean }
    running: { type: boolean }
    error: { type: string }
    cleanup_on_corrupt_record:
      type: object
      additionalProperties: true
    cleanup_on_stale_record:
      type: object
      additionalProperties: true
    cleanup_on_missing_session:
      type: object
      additionalProperties: true
    backend_policy_drift:
      $ref: "#/components/schemas/VoiceWebRtcPeerBackendPolicyDrift"
    peer:
      nullable: true
      allOf:
        - $ref: "#/components/schemas/VoiceWebRtcPeerRuntime"
