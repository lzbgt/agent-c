VoiceWebRtcPeerRuntime:
  type: object
  required: [schema, runtime_kind, status_source, session_id, broker_url, sender_tag, tool_path, node_bin, started_unix_ms, deadline_ms, poll_interval_ms, tone_hz, ready, running]
  properties:
    schema: { type: string, enum: [session_voice_webrtc_peer_runtime_v1] }
    runtime_kind:
      type: string
      enum: [bundled, external]
    status_source:
      type: string
      enum: [memory, persisted]
    session_id: { type: string }
    broker_session_id: { type: string }
    broker_url: { type: string }
    managed_broker_session: { type: boolean }
    broker_agent_id: { type: string }
    broker_deployment_id: { type: string }
    sender_tag: { type: string }
    tool_path: { type: string }
    node_bin: { type: string }
    ready_file_path: { type: string }
    stdout_log_path: { type: string }
    stderr_log_path: { type: string }
    started_unix_ms: { type: integer, format: int64 }
    ended_unix_ms: { type: integer, format: int64 }
    deadline_ms: { type: integer, format: int64 }
    poll_interval_ms: { type: integer, format: int64 }
    tone_hz: { type: integer, format: int64 }
    ready: { type: boolean }
    running: { type: boolean }
    pid: { type: integer, format: int64 }
    exit_code: { type: integer }
    exit_signal: { type: integer }
    last_error: { type: string }
    last_stdout_line: { type: string }
    last_stdout:
      type: object
      additionalProperties: true

VoiceWebRtcPeerRequest:
  type: object
  additionalProperties: false
  required: [session_id, action]
  properties:
    session_id: { type: string }
    action:
      type: string
      enum: [start, stop]
    runtime_kind:
      type: string
      enum: [builtin, bundled, external]
      description: Optional backend selector. `bundled` uses the shipped repo-local Node/Playwright peer when discoverable, `external` uses an operator-configured helper path, and `builtin` is reserved for the future embedded agentd-native media service.
    broker_session_id: { type: string }
    broker_agent_id:
      type: string
      description: Optional broker `agent_id` used to auto-create a broker audio session when `broker_session_id` is omitted.
    broker_deployment_id:
      type: string
      description: Optional broker `deployment_id` passed through when agentd auto-creates the broker audio session.
    broker_url: { type: string }
    broker_token:
      type: string
      description: Broker bearer token used for session creation on `start`, and optionally reused on `stop` so agentd can delete an owned broker audio session itself if the child peer died before sending `bye`.
    sender_tag: { type: string }
    deadline_ms: { type: integer, format: int64 }
    poll_interval_ms: { type: integer, format: int64 }
    tone_hz: { type: integer, format: int64 }

VoiceWebRtcPeerResponse:
  type: object
  required: [ok, session_id, tool_configured, builtin_available, bundled_available, default_runtime_kind, node_bin]
  properties:
    ok: { type: boolean }
    session_id: { type: string }
    tool_configured: { type: boolean }
    builtin_available: { type: boolean, enum: [false] }
    bundled_available: { type: boolean }
    default_runtime_kind:
      type: string
      enum: [bundled, external]
    bundled_tool_path: { type: string }
    tool_path: { type: string }
    node_bin: { type: string }
    started: { type: boolean }
    stopped: { type: boolean }
    broker_session_deleted: { type: boolean }
    broker_session_delete_error: { type: string }
    already_running: { type: boolean }
    reason: { type: string }
    error: { type: string }
    peer:
      nullable: true
      allOf:
        - $ref: "#/components/schemas/VoiceWebRtcPeerRuntime"

VoiceWebRtcPeerStatusResponse:
  type: object
  required: [ok, session_id, tool_configured, builtin_available, bundled_available, default_runtime_kind, node_bin, session_exists, running]
  properties:
    ok: { type: boolean }
    session_id: { type: string }
    tool_configured: { type: boolean }
    builtin_available: { type: boolean, enum: [false] }
    bundled_available: { type: boolean }
    default_runtime_kind:
      type: string
      enum: [bundled, external]
    bundled_tool_path: { type: string }
    tool_path: { type: string }
    node_bin: { type: string }
    session_exists: { type: boolean }
    running: { type: boolean }
    error: { type: string }
    cleanup_on_missing_session:
      type: object
      additionalProperties: true
    peer:
      nullable: true
      allOf:
        - $ref: "#/components/schemas/VoiceWebRtcPeerRuntime"
