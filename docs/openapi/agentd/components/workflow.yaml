WorkflowTaskSpec:
  description: |
    Workflow task specification.

    This is a tagged union:
    - LLM/tool tasks: `request` (a `RunRequest`) with a non-empty `prompt`
    - Deterministic capsule tasks: `kind: avm_capsule` with `capsule` (see `AvmCapsuleRunArgs`)
    - Deterministic aggregation tasks: `kind: aggregate` with `aggregate` (see `WorkflowAggregateSpec`)
    - Deterministic memory update tasks: `kind: memory_put` with `memory_put` (see `WorkflowMemoryPutSpec`)
    - Deterministic memory retrieval tasks: `kind: memory_search` with `memory_search` (host tool; no LLM required)
    - Deterministic memory timeline tasks: `kind: memory_timeline` with `memory_timeline` (host tool; no LLM required)
    - Deterministic structured memory query tasks: `kind: memory_structured_query` with `memory_structured_query` (host tool; no LLM required)
    - Deterministic memory correlation tasks: `kind: memory_correlate` with `memory_correlate` (scans structured memory checkpoints; no LLM required)
    - Deterministic memory query tasks: `kind: memory_query` with `memory_query` (reads newest structured checkpoint; no LLM required)
    - Deterministic outbound HTTP JSON tasks: `kind: http_json` with `http_json` (gated by daemon flag; no LLM required)
    - Deterministic agent collaboration tasks: `kind: agentd_call` with `agentd_call` (gated by daemon flag; no LLM required)
    - Parallel agent collaboration macro: `kind: agentd_parallel` with `agentd_parallel` (submit-time expansion into parallel `agentd_call` tasks + an aggregate join; configurable)
    - Deterministic memory consolidation tasks: `kind: memory_consolidate` with `memory_consolidate` (see `WorkflowMemoryConsolidateSpec`)
    - Deterministic delay tasks: `kind: delay` with `delay_ms` (no LLM required)
    - Edge collaboration tasks: `kind: edge_invoke` with `edge` (see `WorkflowEdgeInvokeSpec`)
    - Parallel edge fan-out macro: `kind: edge_parallel` with `edge_parallel` (submit-time expansion into `edge_invoke` tasks + an aggregate join; configurable)
    - Deterministic edge sensor wait: `kind: edge_wait_sensor` with `edge_wait_sensor` (polls edge sensor event log; retryable)
    - Sequential fallback collaboration: `kind: delegate` with `delegate` (see `WorkflowDelegateSpec`)
    - Parallel collaboration macro: `kind: delegate_parallel` with `delegate` (submit-time expansion into tasks + aggregate join; configurable)

    Note: OpenAPI cannot express conditional required fields perfectly; see the server-side behavior:
    - If `kind == avm_capsule`, `capsule.obc_base64` is required and `request.prompt` is not used.
    - If `kind == aggregate`, `aggregate.task_ids` is required and `request.prompt` is not used.
    - If `kind == memory_put`, `memory_put.entries` is required and `request.prompt` is not used.
    - If `kind == memory_search`, `memory_search.query` is required and `request.prompt` is not used.
    - If `kind == memory_timeline`, `memory_timeline` is required and `request.prompt` is not used.
    - If `kind == memory_structured_query`, `memory_structured_query` is required and `request.prompt` is not used.
    - If `kind == memory_correlate`, `memory_correlate` is required and `request.prompt` is not used.
    - If `kind == memory_query`, `memory_query` is required and `request.prompt` is not used.
    - If `kind == http_json`, `http_json` is required and `request.prompt` is not used.
    - If `kind == agentd_call`, `agentd_call` is required and `request.prompt` is not used.
    - If `kind == agentd_parallel`, `agentd_parallel.agentd_call` plus either `agentd_parallel.targets` or `agentd_parallel.targets_from_broker_registry` are required and `request.prompt` is not used (expanded into multiple tasks).
    - If `kind == memory_consolidate`, `memory_consolidate` is optional and `request.prompt` is not used.
    - If `kind == delay`, `delay_ms` is optional (default 0) and `request.prompt` is not used.
    - If `kind == edge_invoke`, `edge.tool`/`edge.args` are required and `request.prompt` is not used.
    - If `kind == edge_parallel`, `edge_parallel.edge.match_any` is required and `edge_parallel.edge.node_id` must be omitted; `edge.tool`/`edge.args` are required and `request.prompt` is not used (expanded into multiple tasks).
    - If `kind == edge_wait_sensor`, `edge_wait_sensor.event_type` is required and `request.prompt` is not used.
    - If `kind == delegate`, `delegate.attempts` is required and `request.prompt` is not used.
    - If `kind == delegate_parallel`, `delegate.attempts` is required and `request.prompt` is not used (expanded into multiple tasks).
    - Otherwise, `request.prompt` is required (or prompt at the top-level is accepted by the server for legacy reasons).
  oneOf:
    - $ref: "#/components/schemas/WorkflowTaskRunSpec"
    - $ref: "#/components/schemas/WorkflowTaskAvmCapsuleSpec"
    - $ref: "#/components/schemas/WorkflowTaskAggregateSpec"
    - $ref: "#/components/schemas/WorkflowTaskMemoryPutSpec"
    - $ref: "#/components/schemas/WorkflowTaskMemorySearchSpec"
    - $ref: "#/components/schemas/WorkflowTaskMemoryTimelineSpec"
    - $ref: "#/components/schemas/WorkflowTaskMemoryStructuredQuerySpec"
    - $ref: "#/components/schemas/WorkflowTaskMemoryCorrelateSpec"
    - $ref: "#/components/schemas/WorkflowTaskMemoryQuerySpec"
    - $ref: "#/components/schemas/WorkflowTaskHttpJsonSpec"
    - $ref: "#/components/schemas/WorkflowTaskAgentdCallSpec"
    - $ref: "#/components/schemas/WorkflowTaskAgentdParallelSpec"
    - $ref: "#/components/schemas/WorkflowTaskMemoryConsolidateSpec"
    - $ref: "#/components/schemas/WorkflowTaskDelaySpec"
    - $ref: "#/components/schemas/WorkflowTaskEdgeInvokeSpec"
    - $ref: "#/components/schemas/WorkflowTaskEdgeParallelSpec"
    - $ref: "#/components/schemas/WorkflowTaskEdgeWaitSensorSpec"
    - $ref: "#/components/schemas/WorkflowTaskDelegateSpec"


WorkflowTaskRunSpec:
  type: object
  required: [task_id, request]
  properties:
    task_id: { type: string }
    allow_error:
      type: boolean
      description: If true, task failure does not fail the workflow (soft-fail).
    inputs:
      type: object
      description: Optional per-task inputs (overrides workflow-level inputs).
      additionalProperties: true
    depends_on:
      type: array
      items: { type: string }
    max_attempts: { type: integer, format: int32 }
    priority:
      type: integer
      format: int32
      description: Higher tasks run sooner (scheduler hint). Overrides workflow priority.
    request:
      $ref: "#/components/schemas/RunRequest"
    expect:
      type: object
      description: Deterministic correctness assertions (engine-enforced)
      additionalProperties: true


